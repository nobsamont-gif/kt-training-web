<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People Center Training Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#CC0000; --red-dark:#A30000; --ink:#1A1A1A; --sub:#6B6B6B;
  --line:#E4E4E4; --line2:#F0F0F2; --bg:#F7F7F7; --card:#FFFFFF;
  --ok:#1E8E3E; --wait:#B26A00; --none:#9AA0A6; --alert:#D93025;
  --c-TH:#1f3a5f; --c-HRST:#CC0000; --c-EGAS:#3f6f68;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;font-weight:300}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:inherit;font-size:13px;font-weight:300;border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
.btn{padding:8px 15px;border-radius:4px;font-weight:400;display:inline-flex;align-items:center;gap:6px}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-dark)}
.btn-ghost{border:1px solid var(--line);background:#fff}.btn-ghost:hover{border-color:var(--sub)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#EFEFEF;color:var(--sub);white-space:nowrap}
.chip.ok{background:#E6F4EA;color:var(--ok)}.chip.wait{background:#FFF3E0;color:var(--wait)}
.chip.alert{background:#FDE7E7;color:var(--alert)}
.code{display:inline-block;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:4px;background:#F0F0F2;color:#444;font-family:'Prompt',monospace;letter-spacing:.02em}
.co{display:inline-block;font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap}
.co.TH{background:#E5EFFA;color:var(--c-TH)}.co.HRST{background:#FDE7E7;color:var(--red)}.co.EGAS{background:#E6F4EA;color:var(--c-EGAS)}
.by{font-size:10.5px;color:var(--none)}

#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.authcard{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:8px;width:min(420px,100%);padding:26px 30px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.authlogo{height:30px;margin-bottom:12px}
.authcard h1{font-size:18px;font-weight:600;margin-bottom:4px}
.authcard .sub{font-size:12.5px;color:var(--sub);margin-bottom:20px}
.frow{margin-bottom:14px}
.pick{display:grid;gap:10px}
.pickbtn{border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-align:left;background:#fff;transition:border-color .15s}
.pickbtn:hover{border-color:var(--red)}
.pickbtn b{display:block;font-size:14px;font-weight:500;color:var(--ink)}.pickbtn span{font-size:12px;color:var(--sub)}
.authlink{color:var(--red);text-decoration:underline;font-size:12.5px;cursor:pointer}
.autherr{background:#FDE7E7;color:var(--alert);font-size:12.5px;padding:9px 12px;border-radius:5px;margin-bottom:14px}
.authok{background:#E6F4EA;color:var(--ok);font-size:12.5px;padding:9px 12px;border-radius:5px;margin-bottom:14px}
.crumbs{font-size:11px;color:var(--sub);margin-bottom:16px}.crumbs b{color:var(--ink);font-weight:500}

header{background:var(--card);border-bottom:2px solid var(--red);padding:0 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;height:56px}
header .brand{display:flex;align-items:center;gap:10px;margin-right:8px}
header .brand img{height:26px}
header .brand .nm{font-size:15px;font-weight:600;line-height:1.1}
.nav{display:flex;gap:2px;height:100%}
.nav button{padding:0 15px;font-size:13px;font-weight:400;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px;position:relative}
.nav button.on{color:var(--red);border-bottom-color:var(--red);font-weight:500}
.nav button:hover{color:var(--ink)}
.nav .badge{position:absolute;top:9px;right:4px;background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.spacer{flex:1}
.whoami{font-size:12px;color:var(--sub);text-align:right;line-height:1.35}
.whoami b{color:var(--ink);font-weight:500;font-size:13px}
.lock{font-size:11px;color:var(--c-EGAS)}
main{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
#syncState{font-size:12px;color:var(--sub)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.cofil{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.cofil button{padding:8px 14px;color:var(--sub)}.cofil button.on{background:var(--red);color:#fff}

table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
th{font-size:11px;font-weight:500;color:var(--sub);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:#FCFCFC;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover{background:#FFF6F6}
tbody tr.late{box-shadow:inset 3px 0 0 var(--alert)}
.cname{font-weight:400;max-width:300px}.cdate{white-space:nowrap;font-size:12.5px;color:var(--sub)}
.mrow td{background:#FCFCFC;font-size:11px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;cursor:default}
.dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;background:#E9E9E9;border:1px solid #DADADA}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.wait{background:#FFD9A0;border-color:var(--wait)}
.dot.hot{background:var(--alert);border-color:var(--alert)}

.tiles{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tile{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 15px;text-align:left;min-width:104px;line-height:1.35}
.tile b{display:block;font-size:20px;font-weight:500}.tile span{display:block;font-size:11px;color:var(--sub)}
.tile:hover{border-color:var(--sub)}.tile.on{border-color:var(--red);box-shadow:inset 0 -2px 0 var(--red)}
.tile.alert b{color:var(--alert)}.tile.wait b{color:var(--wait)}.tile.ok b{color:var(--ok)}
.tile.big b{font-size:26px}.tile.big{min-width:130px;padding:12px 18px}

.banner{background:#FFFAF2;border:1px solid #F3D9A8;border-left:3px solid var(--wait);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.banner b{color:var(--wait)}
.banner .row{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px dashed #F0DCB8;flex-wrap:wrap}
.banner .row:first-of-type{border-top:none}

#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}#ov.open{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:21;transform:translateX(100%);transition:transform .2s;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.12)}
#drawer.open{transform:none}
.dhead{padding:16px 20px;border-bottom:2px solid var(--red);display:flex;align-items:flex-start;gap:10px;position:sticky;top:0;background:var(--card);z-index:2}
.dhead h2{font-size:15px;font-weight:600;flex:1;line-height:1.35}
.dbody{padding:16px 20px 40px}
.sect{margin-bottom:20px}.sect h3{font-size:12px;font-weight:500;color:var(--red);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:none}.step .who{font-size:11px;color:var(--sub);min-width:78px}.step .nm{flex:1}
.step input[type=checkbox]{width:16px;height:16px;accent-color:var(--red)}.step select{width:auto}.step .ts{font-size:11px;color:var(--sub)}
.step.sub{padding:4px 0 6px 88px}
.reqbox{border:1px solid var(--line);border-left-width:3px;border-radius:5px;padding:10px 12px;background:#FAFAFA;margin-bottom:10px}
.reqbox.none{border-left-color:var(--alert);background:#FEF6F6}.reqbox.sent{border-left-color:var(--wait);background:#FFFAF2}.reqbox.ok{border-left-color:var(--ok);background:#F4FAF5}
.reqline{display:flex;align-items:center;gap:9px;font-size:13px}.reqdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.reqbox.none .reqdot{background:var(--alert)}.reqbox.sent .reqdot{background:var(--wait)}.reqbox.ok .reqdot{background:var(--ok)}
.mini{font-size:11px;padding:4px 10px;border-radius:4px;border:1px solid var(--line)}.mini:hover{border-color:var(--red);color:var(--red)}
.docrow{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}.docrow:last-child{border-bottom:none}
.docrow .nm{flex:1}.fn{font-size:11.5px;color:var(--ok);word-break:break-all}.fn.miss{color:var(--none)}
.filelist{margin-top:3px}.fileitem{display:flex;align-items:center;gap:6px;padding:2px 0}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:30;overflow-y:auto;padding:30px 12px}
.modal.open{display:flex}
.mcard{background:#fff;border-radius:8px;width:min(640px,100%);padding:22px}
.mcard h2{font-size:15px;font-weight:600;margin-bottom:14px}.mcard h2 span{color:var(--red)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.tabs{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:fit-content;margin-bottom:12px}
.tabs button{padding:6px 16px;background:#fff}.tabs button.on{background:var(--red);color:#fff}
.note{font-size:12px;color:var(--sub);line-height:1.6}
#emailOut{font-family:'Prompt',monospace;font-size:12.5px;height:300px;white-space:pre-wrap}
.urow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}.urow:last-child{border-bottom:none}
.tag{font-size:10.5px;padding:2px 8px;border-radius:10px;font-weight:500}
.tag.pending{background:#FFF3E0;color:var(--wait)}.tag.active{background:#E6F4EA;color:var(--ok)}.tag.rejected{background:#FDE7E7;color:var(--alert)}.tag.suspended{background:#EFEFEF;color:var(--sub)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:5px;font-size:13px;display:none;z-index:60}
.hide{display:none!important}
</style>
</head>
<body>
<div id="auth"></div>
<div id="appShell" class="hide">
  <header>
    <div class="brand"><img id="hdrLogo" alt="Honda"><span class="nm">People Center<br>Training Hub</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="whoami" id="whoami"></div>
    <button class="btn btn-ghost" style="margin-left:10px" onclick="App.logout()">ออกจากระบบ</button>
  </header>
  <main><div style="text-align:right"><span id="syncState"></span></div><div id="app"></div></main>
</div>
<div id="ov" onclick="document.getElementById('drawer').classList.remove('open');this.classList.remove('open')"></div>
<aside id="drawer"></aside>
<div id="toast"></div>

const API_KEY='kt_api', TOK_KEY='kt_token', PROF_KEY='kt_profile';
const GENPOS=['TH','HRST','EGAS'], CO={TH:'TH',HRST:'HRS-T',EGAS:'EG-AS'};
const state={ apiBase:localStorage.getItem(API_KEY)||'', token:localStorage.getItem(TOK_KEY)||'',

  view:'training', train:{}, dsd:{}, cal:{events:[],sha:null} };

const esc=s=>String(s??'').replace(/[<>&"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2800)}
function sync(t){const el=document.getElementById('syncState');if(el)el.textContent=t}
const nowStamp=()=>new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
const dstamp=()=>new Date().toISOString().slice(0,10);
/* ---- date helpers: แสดง/รับ dd/mm/yyyy, เก็บภายในเป็น ISO ---- */
function fmtDMY(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`;}
function parseDMY(s){s=(s||'').trim();const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);if(!m)return '';const d=+m[1],mo=+m[2],y=+m[3];if(mo<1||mo>12||d<1||d>31)return '';return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function dmask(el){let v=el.value.replace(/\D/g,'').slice(0,8);let o=v.slice(0,2);if(v.length>2)o+='/'+v.slice(2,4);if(v.length>4)o+='/'+v.slice(4,8);el.value=o;}
function dateInput(iso,handler,id){return `<input type="text" inputmode="numeric" placeholder="dd/mm/yyyy" ${id?`id="${id}"`:''} value="${fmtDMY(iso)}" oninput="dmask(this)"${handler?` onchange="${handler}"`:''}>`;}

async function api(method,ep,body){
  const r=await fetch(state.apiBase.replace(/\/+$/,'')+'/'+ep,{
    method, headers:{'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})},
    body:body?JSON.stringify(body):undefined });
  if(r.status===401){App.logout('เซสชันหมดอายุ — เข้าสู่ระบบใหม่');throw new Error('unauthorized')}
  if(r.status===409)throw new Error('conflict');
  let j={}; try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
const scopeGenpos=()=>state.profile.allAccess?[...GENPOS]:[state.profile.genpo];

/* ================= App: auth, shell, data layer ================= */
const App=(()=>{
  let authStep={type:null,role:null,genpo:null,mode:'login'};
  function renderAuth(msg,ok){
    const el=document.getElementById('auth');
    if(!state.apiBase){el.innerHTML=configScreen();return;}
    const err=msg?`<div class="${ok?'authok':'autherr'}">${esc(msg)}</div>`:'';
    if(authStep.mode==='register'){el.innerHTML=registerScreen(err);return;}
    if(!authStep.type){el.innerHTML=typeScreen(err);return;}
    if(!authStep.role){el.innerHTML=roleScreen(err);return;}
    el.innerHTML=loginScreen(err);
  }
  function crumbs(){const p=[];if(authStep.type)p.push(authStep.type);if(authStep.role)p.push(authStep.role);if(authStep.genpo)p.push(CO[authStep.genpo]);
    return p.length?`<div class="crumbs">${p.map(x=>`<b>${esc(x)}</b>`).join(' · ')}</div>`:'';}
  const shell=(inner)=>`<div class="authcard"><img class="authlogo" src="${LOGO}" alt="Honda"><h1>People Center Training Hub</h1><div class="sub">HR Service Excellent (HRSX) · Asian Honda Motor</div>${inner}</div>`;
  function configScreen(){return shell(`<div class="frow"><label>Worker API URL (ครั้งแรกครั้งเดียว)</label>
    <input id="cfgUrl" placeholder="https://xxx.workers.dev" value="${esc(state.apiBase)}"></div>
    <p class="note" style="margin-bottom:14px">กรอก URL ของ Worker ครั้งเดียวต่อเครื่อง — token ของ GitHub เก็บอยู่ที่ Worker ไม่ได้อยู่ในเครื่องนี้</p>
    <button class="btn btn-red" style="width:100%;justify-content:center" onclick="App.saveApi()">บันทึก</button>`);}
  function typeScreen(err){return shell(`${err}<p class="note" style="margin-bottom:16px">เข้าสู่ระบบ — เลือกกลุ่มผู้ใช้</p>
    <div class="pick">
      <button class="pickbtn" onclick="App.pickType('People Center')"><b>People Center</b><span>Training Co · DSD Cont · Manager — เข้าได้ทุกหน้า ทุก Genpo</span></button>
      <button class="pickbtn" onclick="App.pickType('Others')"><b>Others</b><span>Accounting · Purchasing — เฉพาะ Tracker และ Genpo ที่กำหนด</span></button>
    </div>
    <p style="margin-top:18px;text-align:center"><span class="authlink" onclick="App.gotoRegister()">ยังไม่มีบัญชี? ลงทะเบียน</span></p>`);}
  function roleScreen(err){const roles=authStep.type==='People Center'?['Training Co','DSD Cont','Manager']:['Accounting','Purchasing'];
    const gpick=authStep.type==='Others'?`<div class="frow"><label>Genpo</label><select id="authGenpo">${GENPOS.map(g=>`<option value="${g}">${CO[g]}</option>`).join('')}</select></div>`:'';
    return shell(`${err}${crumbs()}<p class="note" style="margin-bottom:14px">เลือกตำแหน่ง</p>
      <div class="pick" style="margin-bottom:14px">${roles.map(r=>`<button class="pickbtn" onclick="App.pickRole('${r}')"><b>${r}</b></button>`).join('')}</div>${gpick}
      <p style="margin-top:6px"><span class="authlink" onclick="App.resetAuth()">← ย้อนกลับ</span></p>`);}
  function loginScreen(err){return shell(`${err}${crumbs()}
    <div class="frow"><label>ชื่อผู้ใช้</label><input id="lUser" autocomplete="username"></div>
    <div class="frow"><label>รหัสผ่าน</label><input id="lPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')App.login()"></div>
    <button class="btn btn-red" style="width:100%;justify-content:center" onclick="App.login()">เข้าสู่ระบบ</button>
    <p style="margin-top:14px;text-align:center"><span class="authlink" onclick="App.resetAuth()">← เปลี่ยนกลุ่ม/ตำแหน่ง</span></p>`);}
  function registerScreen(err){return shell(`${err}<p class="note" style="margin-bottom:14px">ลงทะเบียนผู้ใช้ใหม่ — ต้องรอ Admin อนุมัติก่อนเข้าใช้งาน</p>
    <div class="frow"><label>ชื่อผู้ใช้</label><input id="rUser" autocomplete="off"></div>
    <div class="frow"><label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="rPass" type="password" autocomplete="new-password"></div>
    <div class="frow"><label>กลุ่มผู้ใช้</label><select id="rType" onchange="App.regTypeChange()"><option value="People Center">People Center</option><option value="Others">Others</option></select></div>
    <div class="frow"><label>ตำแหน่ง</label><select id="rRole"></select></div>
    <div class="frow hide" id="rGenpoRow"><label>Genpo</label><select id="rGenpo">${GENPOS.map(g=>`<option value="${g}">${CO[g]}</option>`).join('')}</select></div>
    <button class="btn btn-red" style="width:100%;justify-content:center" onclick="App.register()">ส่งคำขอลงทะเบียน</button>
    <p style="margin-top:14px;text-align:center"><span class="authlink" onclick="App.gotoLogin()">← กลับไปเข้าสู่ระบบ</span></p>`);}

  function saveApi(){const u=document.getElementById('cfgUrl').value.trim();if(!u){toast('กรอก URL');return}state.apiBase=u;localStorage.setItem(API_KEY,u);renderAuth();}
  function pickType(t){authStep.type=t;authStep.role=null;renderAuth();}
  function pickRole(r){authStep.role=r;if(authStep.type==='Others'){const g=document.getElementById('authGenpo');authStep.genpo=g?g.value:'TH';}renderAuth();}
  function resetAuth(){authStep={type:null,role:null,genpo:null,mode:'login'};renderAuth();}
  function gotoRegister(){authStep.mode='register';renderAuth();setTimeout(regTypeChange,0);}
  function gotoLogin(){authStep.mode='login';authStep.type=null;authStep.role=null;renderAuth();}
  function regTypeChange(){const t=document.getElementById('rType').value;const roles=t==='People Center'?['Training Co','DSD Cont','Manager']:['Accounting','Purchasing'];
    document.getElementById('rRole').innerHTML=roles.map(r=>`<option>${r}</option>`).join('');document.getElementById('rGenpoRow').classList.toggle('hide',t!=='Others');}
  async function register(){
    const b={username:document.getElementById('rUser').value.trim(),password:document.getElementById('rPass').value,
      type:document.getElementById('rType').value,role:document.getElementById('rRole').value,
      genpo:document.getElementById('rType').value==='Others'?document.getElementById('rGenpo').value:null};
    if(!b.username||!b.password){toast('กรอกชื่อผู้ใช้และรหัสผ่าน');return}
    try{const res=await api('POST','api/register',b);authStep.mode='login';authStep.type=null;authStep.role=null;
      renderAuth(res.admin?'สร้างบัญชี Admin สำเร็จ — เข้าสู่ระบบได้เลย':'ส่งคำขอแล้ว รอ Admin อนุมัติ',true);
    }catch(e){renderAuth(e.message)}
  }
  async function login(){
    const username=document.getElementById('lUser').value.trim(),password=document.getElementById('lPass').value;
    if(!username||!password){toast('กรอกชื่อผู้ใช้และรหัสผ่าน');return}
    try{const res=await api('POST','api/login',{username,password});
      if(authStep.type==='Others'&&res.profile.genpo&&authStep.genpo&&res.profile.genpo!==authStep.genpo){renderAuth(`บัญชีนี้ผูกกับ ${CO[res.profile.genpo]} ไม่ใช่ ${CO[authStep.genpo]}`);return;}
      state.token=res.token;state.profile=res.profile;localStorage.setItem(TOK_KEY,res.token);localStorage.setItem(PROF_KEY,JSON.stringify(res.profile));
      await enterApp();
    }catch(e){renderAuth(e.message)}
  }
  function logout(msg){state.token='';state.profile=null;localStorage.removeItem(TOK_KEY);localStorage.removeItem(PROF_KEY);
    state.train={};state.dsd={};state.cal={events:[],sha:null};
    document.getElementById('appShell').classList.add('hide');document.getElementById('auth').classList.remove('hide');resetAuth();if(msg)renderAuth(msg);}

  /* ---------- data layer ---------- */
  async function loadData(){
    sync('กำลังโหลด…');const gs=scopeGenpos();state.train={};state.dsd={};
    for(const g of gs){const t=await api('GET','api/data?file=training-'+g);state.train[g]={courses:(t.json&&t.json.courses)||[],sha:t.sha};}
    if(state.profile.allAccess){
      for(const g of gs){const d=await api('GET','api/data?file=dsd-'+g);state.dsd[g]={runs:(d.json&&d.json.runs)||[],sha:d.sha};}
      const c=await api('GET','api/data?file=calendar');state.cal={events:(c.json&&c.json.events)||[],sha:c.sha};
    }
    sync('ซิงค์ล่าสุด '+nowStamp());
  }
  async function reloadGenpo(app,g){const r=await api('GET','api/data?file='+app+'-'+g);
    if(app==='training')state.train[g]={courses:(r.json&&r.json.courses)||[],sha:r.sha};
    else state.dsd[g]={runs:(r.json&&r.json.runs)||[],sha:r.sha};}
  async function saveTrain(g,msg){const s=state.train[g];
    try{const r=await api('PUT','api/data?file=training-'+g,{content:{courses:s.courses},sha:s.sha,msg});s.sha=r.sha;sync('บันทึกแล้ว '+nowStamp());}
    catch(e){if(e.message==='conflict'){toast('มีคนบันทึกก่อน — โหลดใหม่ กรุณาทำซ้ำ');await reloadGenpo('training',g);render();}else{toast('บันทึกไม่สำเร็จ');}throw e;}}
  async function saveDsd(g,msg){const s=state.dsd[g];
    try{const r=await api('PUT','api/data?file=dsd-'+g,{content:{runs:s.runs},sha:s.sha,msg});s.sha=r.sha;sync('บันทึกแล้ว '+nowStamp());}
    catch(e){if(e.message==='conflict'){toast('มีคนบันทึกก่อน — โหลดใหม่ กรุณาทำซ้ำ');await reloadGenpo('dsd',g);render();}else{toast('บันทึกไม่สำเร็จ');}throw e;}}
  async function saveCal(msg){
    try{const r=await api('PUT','api/data?file=calendar',{content:{events:state.cal.events},sha:state.cal.sha,msg});state.cal.sha=r.sha;sync('บันทึกแล้ว '+nowStamp());}
    catch(e){if(e.message==='conflict'){toast('มีคนบันทึกปฏิทินก่อน — โหลดใหม่');const c=await api('GET','api/data?file=calendar');state.cal={events:(c.json&&c.json.events)||[],sha:c.sha};render();}else toast('บันทึกไม่สำเร็จ');throw e;}}

  /* ---------- cross-module linkage helpers ---------- */
  const allCourses=()=>{const o=[];for(const g of Object.keys(state.train))for(const c of(state.train[g].courses||[]))o.push({c,g});return o;};
  const courseByCode=(code,g)=>(state.train[g]?state.train[g].courses:[]).find(c=>c.code===code);
  const dsdByCode=(code,g)=>(state.dsd[g]?state.dsd[g].runs:[]).find(r=>r.code===code);
  function creators(){const s=new Set();allCourses().forEach(({c})=>c.by&&s.add(c.by));for(const g in state.dsd)(state.dsd[g].runs||[]).forEach(r=>r.by&&s.add(r.by));(state.cal.events||[]).forEach(e=>e.by&&s.add(e.by));return [...s].sort();}
  // เมื่อเพิ่มหลักสูตรใน Training → เพิ่มกิจกรรมใน Calendar อัตโนมัติ (เฉพาะผู้ที่โหลดปฏิทิน = People Center)
  async function calFromCourse(c){
    if(!state.profile.allAccess)return;
    if((state.cal.events||[]).some(e=>e.code===c.code))return;
    state.cal.events.push({id:Date.now().toString(36)+'_c',code:c.code,title:c.name,co:c.co,status:'confirmed',
      date:c.start,end:c.end&&c.end!==c.start?c.end:'',time:'',note:'สร้างจาก Training Tracker',by:c.by,
      history:['สร้างจาก Training โดย '+c.by+' '+new Date().toLocaleDateString('en-GB')]});
    try{await saveCal('cal from course '+c.code);}catch(e){}
  }
  // เมื่อ DSD Cont กดยื่น (sent/ok) → อัปเดตขั้นตอน "ยื่น DSD" ใน Training ให้สอดคล้อง
  async function syncDsdToTraining(run,g){
    const c=courseByCode(run.code,g);if(!c)return;
    const submitted=(run.req==='sent'||run.req==='ok');
    if(!!c.steps.dsd!==submitted){c.steps.dsd=submitted;c.stepTs=c.stepTs||{};c.stepBy=c.stepBy||{};
      c.stepTs.dsd=submitted?new Date().toLocaleDateString('en-GB'):null;c.stepBy.dsd=submitted?run.by||state.profile.username:null;
      try{await saveTrain(g,'sync dsd step '+run.code);}catch(e){}}
  }

  const VIEWS=()=>{const p=state.profile;
    if(!p.allAccess)return[['training','Training Tracker']];
    const v=[['training','Training Tracker'],['dsd','DSD Tracker'],['calendar','Calendar']];
    if(p.admin)v.push(['admin','Admin']);return v;};
  function pendingBadge(){return 0;}
  function renderNav(){
    document.getElementById('nav').innerHTML=VIEWS().map(([k,t])=>`<button class="${state.view===k?'on':''}" onclick="App.go('${k}')">${t}</button>`).join('');
    const p=state.profile;
    document.getElementById('whoami').innerHTML=`<b>${esc(p.username)}</b><br>${esc(p.role)}`+(p.allAccess?'':` <span class="lock">🔒 ${CO[p.genpo]}</span>`);
    document.getElementById('hdrLogo').src=LOGO;
  }
  function go(v){state.view=v;renderNav();render();}
  function render(){const el=document.getElementById('app');
    if(state.view==='training')Training.render(el);
    else if(state.view==='dsd')DSD.render(el);
    else if(state.view==='calendar')Calendar.render(el);
    else if(state.view==='admin')Admin.render(el);}
  async function enterApp(){
    document.getElementById('auth').classList.add('hide');document.getElementById('appShell').classList.remove('hide');
    if(!VIEWS().some(v=>v[0]===state.view))state.view=VIEWS()[0][0];
    renderNav();try{await loadData();}catch(e){sync('เชื่อมต่อไม่ได้');toast(e.message)}render();}
  async function boot(){if(state.token&&state.profile){try{await enterApp();return;}catch(e){}}document.getElementById('appShell').classList.add('hide');renderAuth();}

  return {boot,renderAuth,saveApi,pickType,pickRole,resetAuth,gotoRegister,gotoLogin,regTypeChange,register,login,logout,
    go,render,renderNav,loadData,reloadGenpo,saveTrain,saveDsd,saveCal,
    allCourses,courseByCode,dsdByCode,creators,calFromCourse,syncDsdToTraining};
})();

/* ================= Training Tracker ================= */
const Training=(()=>{
  const VTXT={none:'ไม่ต้องเปิด',wait_docs:'รอเอกสารจาก Vendor',review:'พิจารณาเอกสาร',ok:'เสร็จสิ้น'};
  const PRTXT={none:'ไม่ต้องเปิด',wait:'รอเปิด PR',ok:'เปิดแล้ว'};
  const PAYROUNDS=['','ทำจ่ายรอบกลางเดือน','ทำจ่ายรอบปลายเดือน','ทำจ่ายรอบพิเศษ (รอบเงินเดือน)'];
  const CATS=['Public','Inhouse','Other'];
  const STEPS=[{k:'vendor',nm:'เปิด Vendor',who:'Purchasing'},{k:'register',nm:'สมัครอบรม',who:'Training Co'},
    {k:'hbi',nm:'อนุมัติใน HBI',who:'Training Co'},{k:'pr',nm:'เปิด PR',who:'Training Co'},
    {k:'email',nm:'ส่งอีเมลยืนยัน',who:'Training Co'},{k:'payment',nm:'ทำจ่าย',who:'Accounting'},{k:'dsd',nm:'ยื่น DSD',who:'DSD Cont'}];
  const DOCS=[{k:'invoice',nm:'Invoice'},{k:'app',nm:'ใบสมัคร'},{k:'detail',nm:'รายละเอียดหลักสูตร (DSD)'},{k:'payproof',nm:'หลักฐานการชำระเงิน'},{k:'receipt',nm:'ใบเสร็จรับเงิน'}];
  const SIG=`Ms. Nobsamon Thadtapong (Oy) | นบศมน ถัดทะพงษ์ (ออย)
People Center Department
HR Service Excellent (HRSX)
Asian Honda Motor Co., Ltd.
Tel.  (+66) 63-191-0261
E-Mail : nobsatha@honda.th.com`;
  let cofil='ALL', currentG=null, currentId=null, lang='th';

  const vendorDone=c=>c.vendor==='none'||c.vendor==='ok';
  const prDone=c=>(c.pr||'none')!=='wait';
  function findCourse(id){for(const g of Object.keys(state.train)){const c=(state.train[g].courses||[]).find(x=>x.id===id);if(c)return{c,g};}return null;}
  const allCourses=App.allCourses;
  function prevDone(c,k){const o=['vendor','register','hbi','pr','email','payment','dsd'],i=o.indexOf(k);if(i===0)return true;const p=o[i-1];if(p==='vendor')return vendorDone(c);if(p==='pr')return prDone(c);return !!c.steps[p];}
  function lastStatus(c){if(c.steps.dsd)return{t:'เสร็จสิ้น',cl:'ok'};
    for(const s of STEPS){if(s.k==='vendor'){if(!vendorDone(c))return{t:VTXT[c.vendor]||'รอเปิด Vendor',cl:'wait'};continue;}
      if(s.k==='pr'){if(!prDone(c))return{t:'รอเปิด PR',cl:'wait'};continue;}
      if(!c.steps[s.k]){if(s.k==='payment'&&c.payRound)return{t:'รอ'+c.payRound.replace('ทำจ่าย','ทำจ่าย '),cl:'wait'};return{t:'รอ'+s.nm,cl:'wait'};}}
    return{t:'เสร็จสิ้น',cl:'ok'};}
  function isLate(c){const today=new Date().toISOString().slice(0,10),soon=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
    if(!c.steps.email&&c.start&&c.start<=soon&&!c.steps.dsd)return true;if(!c.steps.payment&&c.end&&c.end<today)return true;return false;}
  function nextCutoff(day){const now=new Date();now.setHours(0,0,0,0);let d=new Date(now.getFullYear(),now.getMonth(),day);if(d<now)d=new Date(now.getFullYear(),now.getMonth()+1,day);return d;}
  const fmtDM=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  const daysTo=d=>Math.round((d-new Date().setHours(0,0,0,0))/864e5);
  function payMissing(c){const m=[];if((c.pr||'none')==='wait')m.push('เปิด PR');if(!c.docs.invoice)m.push('Invoice');return m;}
  function cutoffInfo(c){if(c.steps.payment)return null;const miss=payMissing(c);if(!miss.length)return null;
    let day=null;if((c.payRound||'').includes('กลางเดือน'))day=7;else if((c.payRound||'').includes('ปลายเดือน'))day=21;
    const target=day?nextCutoff(day):(daysTo(nextCutoff(7))<=daysTo(nextCutoff(21))?nextCutoff(7):nextCutoff(21));
    return{target,days:daysTo(target),miss,fixed:!!day};}
  function riskScore(c){let r=0;if(isLate(c))r+=100;const i=cutoffInfo(c);if(i)r+=i.days<=0?80:i.days<=3?60:i.days<=7?40:10;if(!c.steps.dsd&&!r)r+=1;return r;}
  const dr=c=>c.start===c.end?fmtDMY(c.start):(fmtDMY(c.start)+' – '+fmtDMY(c.end));

  function render(el){
    const cofilBtns=state.profile.allAccess
      ?`<div class="cofil" id="tCofil"><button data-c="ALL" class="${cofil==='ALL'?'on':''}">ทั้งหมด</button>${GENPOS.map(g=>`<button data-c="${g}" class="${cofil===g?'on':''}">${CO[g]}</button>`).join('')}</div>`
      :`<span class="co ${state.profile.genpo}">${CO[state.profile.genpo]}</span>`;
    let rows=allCourses().filter(({c})=>state.profile.allAccess?(cofil==='ALL'||c.co===cofil):true);
    const lateN=rows.filter(({c})=>isLate(c)).length,cutN=rows.filter(({c})=>{const i=cutoffInfo(c);return i&&i.days<=7;}).length;
    const mode=localStorage.getItem('t_sort')||'date';
    if(mode==='risk')rows.sort((a,b)=>riskScore(b.c)-riskScore(a.c)||(a.c.start||'').localeCompare(b.c.start||''));
    else if(mode==='no')rows.sort((a,b)=>(a.c.no||0)-(b.c.no||0));
    else rows.sort((a,b)=>(a.c.start||'').localeCompare(b.c.start||''));
    el.innerHTML=`
      <div class="toolbar">
        <button class="btn btn-red" onclick="Training.openAdd()">+ เพิ่มรายการ</button>${cofilBtns}
        <select id="tSort" style="width:auto" onchange="localStorage.setItem('t_sort',this.value);App.render()">
          <option value="date" ${mode==='date'?'selected':''}>เรียง: วันอบรม</option>
          <option value="risk" ${mode==='risk'?'selected':''}>เรียง: ความเสี่ยงสูง→ต่ำ</option>
          <option value="no" ${mode==='no'?'selected':''}>เรียง: ลำดับ</option></select>
        <button class="btn btn-ghost" onclick="App.loadData().then(App.render)">รีเฟรช</button>
        <button class="btn btn-ghost" onclick="Training.exportCSV()">Excel</button>
        ${state.profile.allAccess?`<button class="btn btn-ghost" onclick="Import.open('training')">นำเข้าข้อมูล</button>`:''}
      </div>
      ${(lateN||cutN)?`<div class="tiles"><span class="tile alert"><b>${lateN}</b><span>รายการเสี่ยง</span></span><span class="tile wait"><b>${cutN}</b><span>ใกล้ cut off ทำจ่าย</span></span></div>`:''}
      <table><thead><tr><th>Code</th><th>หลักสูตร / สถาบัน</th><th>วันอบรม</th><th>คน</th><th>ขั้นตอน</th><th>สถานะล่าสุด</th></tr></thead><tbody id="tRows"></tbody></table>`;
    if(state.profile.allAccess)el.querySelectorAll('#tCofil button').forEach(b=>b.onclick=()=>{cofil=b.dataset.c;App.render();});
    const tb=el.querySelector('#tRows');
    if(!rows.length){tb.innerHTML='<tr><td colspan="6" style="color:var(--sub);text-align:center;padding:30px">ยังไม่มีรายการ — กด "+ เพิ่มรายการ"</td></tr>';return;}
    tb.innerHTML=rows.map(({c,g})=>{const st=lastStatus(c),late=isLate(c),co=cutoffInfo(c);
      const coChip=co&&co.days<=7?`<br><span class="chip ${co.days<=3?'alert':'wait'}" style="margin-top:3px">cut off ${fmtDM(co.target)} · ขาด ${co.miss.join('+')}</span>`:'';
      const dots=STEPS.map(s=>{let cl;if(s.k==='vendor')cl=vendorDone(c)?'ok':'wait';else if(s.k==='pr')cl=prDone(c)?'ok':'wait';else cl=c.steps[s.k]?'ok':(prevDone(c,s.k)?'wait':'');return`<span class="dot ${cl}" title="${s.nm}"></span>`;}).join('');
      return`<tr class="${late?'late':''}" onclick="Training.openDrawer('${g}','${c.id}')">
        <td><span class="co ${g}">${CO[g]}</span><br><span class="code">${esc(c.code||'')}</span></td>
        <td class="cname">${esc(c.name)} <span class="chip" style="font-size:10px">${esc(c.cat||'')}</span><br><span style="font-size:11.5px;color:var(--sub)">${esc(c.vendorName||'')}</span>${c.by?`<br><span class="by">เพิ่มโดย ${esc(c.by)}</span>`:''}</td>
        <td class="cdate">${dr(c)}</td><td>${c.count||''}</td>
        <td><div class="dots">${dots}</div></td>
        <td><span class="chip ${late?'alert':st.cl}">${late?'⚠ ':''}${st.t}</span>${coChip}</td></tr>`;}).join('');
  }

  function openAdd(){
    const genpoField=state.profile.allAccess?`<div class="frow"><label>บริษัท (Genpo)</label><select id="aCo">${GENPOS.map(g=>`<option value="${g}">${CO[g]}</option>`).join('')}</select></div>`:`<input type="hidden" id="aCo" value="${state.profile.genpo}">`;
    openModal(`<h2><span>เพิ่ม</span>รายการ</h2>${genpoField}
      <div class="frow"><label>ชื่อหลักสูตร</label><input id="aName"></div>
      <div class="frow"><label>สถาบัน / Vendor</label><input id="aVendor"></div>
      <div class="grid2"><div class="frow"><label>วันที่เริ่ม</label>${dateInput('','','aStart')}</div><div class="frow"><label>วันที่สิ้นสุด</label>${dateInput('','','aEnd')}</div></div>
      <div class="grid2"><div class="frow"><label>จำนวนคน</label><input id="aCount" type="number" min="1" value="1"></div>
        <div class="frow"><label>ประเภท</label><select id="aCat">${CATS.map(x=>`<option>${x}</option>`).join('')}</select></div></div>
      <div class="frow"><label>สถานะ Vendor เริ่มต้น</label><select id="aVstat"><option value="none">มี Vendor อยู่แล้ว</option><option value="wait_docs">ต้องขอเปิด Vendor</option></select></div>
      <div class="frow"><label>รายชื่อผู้เข้าอบรม (บรรทัดละคน)</label><textarea id="aPeople" rows="3"></textarea></div>
      <p class="note">ระบบจะสร้าง Training Code ให้อัตโนมัติ และเพิ่มหลักสูตรนี้เข้า Calendar + แจ้งฝั่ง DSD ให้ดึงไปยื่นต่อ</p>
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" onclick="Training.addCourse()">บันทึก</button></div>`);
  }
  async function addCourse(){
    const g=document.getElementById('aCo').value;const name=document.getElementById('aName').value.trim();
    if(!name){toast('กรอกชื่อหลักสูตร');return;}
    const s=state.train[g];const no=Math.max(0,...s.courses.map(c=>c.no||0))+1;const code=g+'-'+String(no).padStart(3,'0');

      if(s.k==='pr'){const opts=Object.entries(PRTXT).map(([v,t])=>`<option value="${v}" ${(c.pr||'none')===v?'selected':''}>${t}</option>`).join('');
        return`<div class="step"><span class="who">${s.who}</span><span class="nm">${s.nm} <span class="ts">(เฉพาะกรุ๊ป/พนง.ญี่ปุ่น)</span></span><select onchange="Training.setPr(this.value)">${opts}</select></div>`+remarkRow(c,'pr');}
      const done=!!c.steps[s.k];const extra=s.k==='email'?`<button class="mini" onclick="event.stopPropagation();Training.openEmail()">สร้างอีเมล</button>`:'';
      const by=(c.stepBy||{})[s.k];const ts=done&&c.stepTs[s.k]?`<span class="ts">${c.stepTs[s.k]}${by?' · '+esc(by):''}</span>`:'';
      const dsdHint=s.k==='dsd'?(linked?` <span class="ts">(ซิงค์กับ DSD: ${esc({none:'ยังไม่ยื่น',sent:'ยื่นแล้ว',ok:'รับรองแล้ว'}[linked.req||'none'])})</span>`:` <span class="ts">(ยังไม่ผูก DSD)</span>`):'';
      let row=`<div class="step"><span class="who">${s.who}</span><span class="nm">${s.nm}${dsdHint}</span>${extra}${ts}<input type="checkbox" ${done?'checked':''} onchange="Training.setStep('${s.k}',this.checked)"></div>`;

        row+=`<div class="step sub"><select style="max-width:230px" onchange="Training.editField('payRound',this.value)">${ropts}</select></div>`;}

      return`<div class="docrow"><span class="who" style="min-width:78px;font-size:11px;color:var(--sub)"></span><span class="nm">${dc.nm}<br><span class="fn ${f?'':'miss'}">${f?esc(f):'ยังไม่มีไฟล์'}</span>${db?`<br><span class="ts">โดย ${esc(db)}</span>`:''}</span>${f?`<button class="mini" onclick="Training.dlFile('${esc(f)}')">ดาวน์โหลด</button>`:''}<button class="mini" onclick="Training.upDoc('${dc.k}')">${f?'แทนที่':'อัปโหลด PDF'}</button></div>`;}).join('');
    const certList=(c.docs.cert||[]);

    const certRow=`<div class="docrow"><span class="who" style="min-width:78px;font-size:11px;color:var(--sub)">Training</span><span class="nm">Certificate <span class="ts">(${certList.length} ไฟล์ · เลือกได้หลายไฟล์)</span>${certFiles}</span><button class="mini" onclick="Training.upDoc('cert')">+ อัปโหลด</button></div>`;
    document.getElementById('drawer').innerHTML=`
      <div class="dhead"><h2><span class="co ${currentG}">${CO[currentG]}</span> <span class="code">${esc(c.code||'')}</span> ${esc(c.name)}</h2><button class="btn btn-ghost" onclick="Training.close()">✕</button></div>
      <div class="dbody">
        <div class="sect"><h3>ข้อมูลหลักสูตร</h3><div class="grid2">

  function safeName(s){return s.replace(/[\\/:*?"<>|#%\s]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);}
  function docLabel(k){return{invoice:'Invoice',app:'ใบสมัคร',detail:'รายละเอียดหลักสูตร',payproof:'หลักฐานการชำระเงิน',receipt:'ใบเสร็จรับเงิน',cert:'Certificate'}[k];}
  function upDoc(k){const inp=document.createElement('input');inp.type='file';inp.accept='application/pdf';if(k==='cert')inp.multiple=true;
    inp.onchange=async()=>{const files=[...inp.files];if(!files.length)return;if(files.some(f=>f.size>20*1024*1024)){toast('ไฟล์ใหญ่เกิน 20MB');return;}
      const c=cur();const g=currentG;toast('กำลังอัปโหลด…');
      try{for(const file of files){const buf=await file.arrayBuffer();let bin='';const by=new Uint8Array(buf);for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));const b64=btoa(bin);
          const base=safeName(file.name.replace(/\.pdf$/i,''));
          const fn=k==='cert'?`${c.code}_Certificate_${base}.pdf`:`${c.code}_${docLabel(k)}.pdf`;
          await api('POST','api/upload',{file:'training-'+g,path:'docs/'+g+'/'+fn,base64:b64});

        await App.saveTrain(g,'doc '+k);toast('อัปโหลดสำเร็จ');App.render();openDrawer(g,c.id);

    const bin=atob(r.base64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=fn;a.click();URL.revokeObjectURL(url);

      <div class="frow"><label>ข้อความ</label><textarea id="emailOut" readonly></textarea></div>
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button><button class="btn btn-red" onclick="Training.copyEmail()">คัดลอกอีเมล</button></div>`);

    const def={th:'หากรับทราบรายละเอียดแล้ว รบกวนตอบกลับอีเมลนี้ด้วยนะคะ',jp:'内容をご確認のうえ、本メールへご返信いただけますようお願いいたします。',en:'Once you have acknowledged the details, please kindly reply to this email.'};

  function genEmail(){const c=cur()||{};const v=id=>document.getElementById(id).value.trim();

    if(lang==='th')t=`เรียน ${to}\n\nขออนุญาตแจ้งยืนยันการจัดอบรม หลักสูตร ${course} ตามรายละเอียด ดังนี้ค่ะ\n\nชื่อหลักสูตร\t${course}\nวันที่อบรม\t${dTH}\nเวลา\t${time} น.\nสถานที่\t${venue}\nผู้เข้าอบรม\t${people}\n\n${rm}\n\nด้วยความเคารพ\nขอบคุณค่ะ\n\n${SIG}`;

/* ================= DSD Tracker ================= */
const DSD=(()=>{
  const LEAD=30, REPORT=60;
  const REQ={none:'ยังไม่ยื่นขอรับรอง',sent:'ยื่นแล้ว รอกรมรับรอง',ok:'รับรองหลักสูตรแล้ว'};
  const STEPS=[{k:'report',nm:'ยื่นรายงานการฝึก'},{k:'dept',nm:'กรมพัฒฯ อนุมัติรายงาน'},{k:'receipt',nm:'ใบเสร็จ'},{k:'cert',nm:'หนังสือรับรอง'}];
  const MTH=['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  let cofil='ALL', bfil='ALL', q='', currentG=null, currentId=null;
  const ISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s:null;
  const today=()=>new Date().toISOString().slice(0,10);
  const daysTo=s=>ISO(s)?Math.round((new Date(s)-new Date(today()))/864e5):null;
  const addD=(s,n)=>{if(!ISO(s))return null;const d=new Date(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
  const endD=r=>ISO(r.dateEnd)||ISO(r.date);
  const isPast=r=>!!endD(r)&&endD(r)<today();
  const fRange=r=>r.dateEnd&&r.dateEnd!==r.date?fmtDMY(r.date)+' – '+fmtDMY(r.dateEnd):fmtDMY(r.date);
  const reqDue=r=>addD(r.date,-LEAD), reportDue=r=>addD(endD(r),REPORT);
  function findRun(id){for(const g in state.dsd){const r=(state.dsd[g].runs||[]).find(x=>x.id_===id);if(r)return{r,g};}return null;}
  function allRuns(){const out=[];for(const g of Object.keys(state.dsd))for(const r of(state.dsd[g].runs||[]))out.push({r,g});return out;}
  const cur=()=>{const f=findRun(currentId);return f?f.r:null;};
  function bucket(r){if((r.req||'none')==='none')return'noreq';if(r.req==='sent')return'waitapv';if(!r.report)return isPast(r)?'noreport':'ready';if(!r.dept)return'waitdept';if(!r.receipt||!r.cert)return'waitdoc';return'done';}
  const BUCKET={noreq:{t:'ยังไม่ยื่นขอรับรอง',cl:'alert'},waitapv:{t:'รอกรมรับรองหลักสูตร',cl:'wait'},ready:{t:'รับรองแล้ว รออบรม',cl:'ok'},noreport:{t:'ค้างยื่นรายงาน',cl:'alert'},waitdept:{t:'รอกรมอนุมัติรายงาน',cl:'wait'},waitdoc:{t:'รอใบเสร็จ/หนังสือรับรอง',cl:'wait'},done:{t:'เสร็จสิ้น',cl:'ok'}};
  function lastStatus(r){const b=bucket(r),o={...BUCKET[b]};
    if(b==='noreq'){const d=daysTo(reqDue(r));if(d!==null&&d<=0)o.t='เลยกำหนดยื่นขอรับรอง';else if(d!==null&&d<=14)o.t=`ยังไม่ยื่น · เหลือ ${d} วัน`;}
    if(b==='waitapv'&&isPast(r)){o.cl='alert';o.t='อบรมแล้วแต่ยังไม่ได้รับรอง';}

  function personStats(runs){const ids=runs.flatMap(r=>(r.people||[]).map(x=>String(x).trim()).filter(Boolean));const counts={};ids.forEach(id=>counts[id]=(counts[id]||0)+1);const unique=Object.keys(counts).length;return {total:ids.length,unique,dup:ids.length-unique,dupIds:Object.keys(counts).filter(id=>counts[id]>1)};}

/* ================= Calendar (Ki fiscal) ================= */
const Calendar=(()=>{
  const STA={confirmed:{t:'ยืนยัน',c:'var(--ok)'},tentative:{t:'ชั่วคราว',c:'var(--wait)'},postponed:{t:'เลื่อน',c:'#B26A00'},cancelled:{t:'ยกเลิก',c:'var(--none)'}};
  const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'],MTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  let cur=new Date(),cofil='ALL',byfil='ALL',editId=null;
  const evs=()=>state.cal.events;
  const kiOf=d=>{const y=d.getFullYear(),m=d.getMonth();return (m>=3?y:y-1)-1923;};
  const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const show=e=>(cofil==='ALL'||e.co===cofil)&&(byfil==='ALL'||e.by===byfil);
  const fD=s=>{if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${+y+543}`;};

  function render(el){
    const y=cur.getFullYear(),m=cur.getMonth(),start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
    const monthEvs=evs().filter(e=>e.date&&e.date.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`&&show(e)).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
    const curKi=kiOf(cur),kis=[];for(let k=curKi-3;k<=curKi+3;k++)kis.push(k);
    const bys=App.creators();
    let cells='';for(let i=0;i<start;i++)cells+='<div class="cal-cell empty"></div>';
    for(let d=1;d<=days;d++){const ds=ymd(new Date(y,m,d));const de=evs().filter(e=>e.date===ds&&show(e));const isToday=ds===ymd(new Date());
      cells+=`<div class="cal-cell${isToday?' today':''}" onclick="Calendar.add('${ds}')"><div class="cal-d">${d}</div>${de.slice(0,3).map(e=>`<div class="cal-ev" style="border-left-color:${STA[e.status].c}" onclick="event.stopPropagation();Calendar.open('${e.id}')"><span class="dotco ${e.co}"></span>${e.time?`<b>${esc(e.time)}</b> `:''}${esc(e.title)}</div>`).join('')}${de.length>3?`<div class="cal-more">+${de.length-3}</div>`:''}</div>`;}
    el.innerHTML=`
      <style>
      .cal-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
      .cal-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px}@media(max-width:860px){.cal-wrap{grid-template-columns:1fr}}
      .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
      .cal-dow{background:#FCFCFC;padding:7px 0;text-align:center;font-size:11px;color:var(--sub);font-weight:500}
      .cal-cell{background:#fff;min-height:92px;padding:4px 5px;cursor:pointer;overflow:hidden}.cal-cell.empty{background:#FAFAFA;cursor:default}.cal-cell:hover{background:#FFF9F9}
      .cal-cell.today{box-shadow:inset 0 0 0 2px var(--red)}
      .cal-d{font-size:12px;color:var(--sub);margin-bottom:3px}
      .cal-ev{font-size:11px;background:#F7F7F7;border-left:3px solid;border-radius:3px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .cal-more{font-size:10.5px;color:var(--sub)}
      .dotco{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}
      .dotco.TH{background:var(--c-TH)}.dotco.HRST{background:var(--c-HRST)}.dotco.EGAS{background:var(--c-EGAS)}
      .agenda{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;max-height:640px;overflow:auto}
      .agenda h4{font-size:12px;color:var(--sub);margin-bottom:8px}
      .ag-item{border-left:3px solid;padding:6px 9px;margin-bottom:7px;background:#FAFAFA;border-radius:0 5px 5px 0;cursor:pointer}
      .ag-item b{font-size:12.5px}.ag-item .m{font-size:11px;color:var(--sub)}
      </style>
      <div class="cal-top">
        <button class="btn btn-ghost" onclick="Calendar.move(-1)">‹</button>
        <div style="font-size:18px;font-weight:600">${MTH[m]} ${y+543}</div>
        <button class="btn btn-ghost" onclick="Calendar.move(1)">›</button>
        <select style="width:auto" onchange="Calendar.jumpKi(+this.value)" title="เลือกปี Ki">${kis.map(k=>`<option value="${k}" ${k===curKi?'selected':''}>${k} Ki (เม.ย.${k+1923+543} – มี.ค.${k+1924+543})</option>`).join('')}</select>
        <button class="btn btn-ghost" onclick="Calendar.today()">วันนี้</button>
        <div class="cofil"><button class="${cofil==='ALL'?'on':''}" onclick="Calendar.fil('ALL')">ทั้งหมด</button>${GENPOS.map(g=>`<button class="${cofil===g?'on':''}" onclick="Calendar.fil('${g}')">${CO[g]}</button>`).join('')}</div>
        <select style="width:auto" onchange="Calendar.byFil(this.value)" title="กรองตามผู้เพิ่ม"><option value="ALL" ${byfil==='ALL'?'selected':''}>ทุกผู้เพิ่ม</option>${bys.map(b=>`<option value="${esc(b)}" ${byfil===b?'selected':''}>${esc(b)}</option>`).join('')}</select>
        <button class="btn btn-ghost" onclick="Calendar.syncTraining()">ซิงค์จาก Training</button>
        <button class="btn btn-red" onclick="Calendar.add('${ymd(new Date())}')">+ เพิ่มกิจกรรม</button>
      </div>
      <div class="cal-wrap">
        <div><div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div></div>
        <div class="agenda"><h4>กิจกรรมเดือนนี้ (${monthEvs.length})</h4>${monthEvs.length?monthEvs.map(e=>`<div class="ag-item" style="border-left-color:${STA[e.status].c}" onclick="Calendar.open('${e.id}')"><b>${esc(e.title)}</b><div class="m"><span class="dotco ${e.co}"></span>${CO[e.co]} · ${fD(e.date)}${e.time?' · '+esc(e.time):''} · ${STA[e.status].t}${e.by?' · โดย '+esc(e.by):''}</div></div>`).join(''):'<div class="note">ไม่มีกิจกรรม</div>'}</div>
      </div>`;
  }
  function move(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);App.render();}
  function today(){cur=new Date();App.render();}
  function jumpKi(k){cur=new Date(k+1923,3,1);App.render();} // เม.ย. ของปี Ki นั้น
  function fil(c){cofil=c;App.render();}
  function byFil(b){byfil=b;App.render();}
  async function syncTraining(){let n=0;for(const {c} of App.allCourses()){if(!c.start)continue;if(evs().some(e=>e.code===c.code))continue;
      evs().push({id:Date.now().toString(36)+(n++),code:c.code,title:c.name,co:c.co,status:'confirmed',date:c.start,end:c.end&&c.end!==c.start?c.end:'',time:'',note:'สร้างจาก Training Tracker',by:c.by,history:['ซิงค์จาก Training โดย '+state.profile.username+' '+new Date().toLocaleDateString('en-GB')]});}
    if(!n){toast('ไม่มีหลักสูตรใหม่ที่ต้องซิงค์');return;}try{await App.saveCal('sync from training');App.render();toast('ซิงค์ '+n+' หลักสูตรเข้า Calendar');}catch(e){}}
  function add(date){editId=null;form({date,co:cofil==='ALL'?'HRST':cofil,status:'confirmed',time:'',end:'',title:'',note:''});}
  function open(id){const e=evs().find(x=>x.id===id);if(!e)return;editId=id;form(e,true);}
  function form(e,isEdit){openModal(`<h2><span>${isEdit?'แก้ไข':'เพิ่ม'}</span>กิจกรรม</h2>
      <div class="frow"><label>ชื่อกิจกรรม</label><input id="ceTitle" value="${esc(e.title||'')}"></div>
      <div class="grid2">
        <div class="frow"><label>บริษัท</label><select id="ceCo">${GENPOS.map(g=>`<option value="${g}" ${e.co===g?'selected':''}>${CO[g]}</option>`).join('')}</select></div>
        <div class="frow"><label>สถานะ</label><select id="ceStatus">${Object.entries(STA).map(([k,v])=>`<option value="${k}" ${e.status===k?'selected':''}>${v.t}</option>`).join('')}</select></div>
        <div class="frow"><label>วันที่</label>${dateInput(e.date,'','ceDate')}</div>
        <div class="frow"><label>ถึงวันที่ (ถ้ามี)</label>${dateInput(e.end,'','ceEnd')}</div>
        <div class="frow"><label>เวลา</label><input id="ceTime" value="${esc(e.time||'')}" placeholder="09:00-16:00"></div></div>
      <div class="frow"><label>หมายเหตุ</label><textarea id="ceNote" rows="2">${esc(e.note||'')}</textarea></div>
      ${isEdit?`<p class="by">${e.by?'เพิ่มโดย '+esc(e.by):''}${e.code?' · Code '+esc(e.code):''}</p>`:''}
      ${isEdit&&e.history&&e.history.length?`<div class="note" style="background:#FAFAFA;border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin:8px 0"><b>ประวัติแก้ไข</b><br>${e.history.slice(-5).map(esc).join('<br>')}</div>`:''}
      <div class="mfoot">${isEdit?`<button class="btn btn-ghost" style="color:var(--alert);margin-right:auto" onclick="Calendar.del()">ลบ</button>`:''}<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" onclick="Calendar.save()">บันทึก</button></div>`);}
  async function save(){const g=id=>document.getElementById(id).value;
    const title=g('ceTitle').trim();if(!title){toast('กรอกชื่อกิจกรรม');return;}
    const date=parseDMY(g('ceDate'));if(!date){toast('วันที่ต้องเป็น dd/mm/yyyy');return;}
    const rec={title,co:g('ceCo'),status:g('ceStatus'),date,end:parseDMY(g('ceEnd')),time:g('ceTime').trim(),note:g('ceNote').trim()};
    const stamp=`${state.profile.username} ${new Date().toLocaleDateString('en-GB')} ${nowStamp()}`;
    if(editId){const e=evs().find(x=>x.id===editId);Object.assign(e,rec);e.history=e.history||[];e.history.push('แก้ไขโดย '+stamp);}
    else evs().push({id:Date.now().toString(36),...rec,by:state.profile.username,history:['สร้างโดย '+stamp]});
    try{await App.saveCal(editId?'edit event':'add event');closeModal();App.render();}catch(e){}}
  async function del(){if(!confirm('ลบกิจกรรมนี้?'))return;state.cal.events=evs().filter(x=>x.id!==editId);try{await App.saveCal('delete event');closeModal();App.render();}catch(e){}}
  return {render,move,today,jumpKi,fil,byFil,syncTraining,add,open,save,del};
})();

/* ================= Admin (จัดการผู้ใช้ + รีเซตรหัส) ================= */
const Admin=(()=>{
  let users=[];
  async function render(el){el.innerHTML=`<div class="toolbar"><button class="btn btn-ghost" onclick="Admin.reload()">รีเฟรช</button><span class="note">อนุมัติ/จัดการผู้ใช้ · รีเซตรหัสผ่าน · เฉพาะ Admin</span></div><div id="admList" class="note">กำลังโหลด…</div>`;await reload();}
  async function reload(){try{const r=await api('GET','api/admin/users');users=r.users||[];draw();}catch(e){const el=document.getElementById('admList');if(el)el.textContent='โหลดไม่สำเร็จ: '+e.message;}}
  function draw(){const wrap=document.getElementById('admList');if(!wrap)return;
    const order={pending:0,active:1,suspended:2,rejected:3};
    const us=[...users].sort((a,b)=>(order[a.status]-order[b.status])||a.username.localeCompare(b.username));
    const pend=us.filter(u=>u.status==='pending').length;
    wrap.innerHTML=(pend?`<div class="note" style="color:var(--wait);margin-bottom:8px">มีคำขอรออนุมัติ ${pend} รายการ</div>`:'')+
      us.map(u=>{const roleSel=`<select id="ar_${esc(u.username)}" style="width:auto;font-size:12px">${(u.type==='Others'?['Accounting','Purchasing']:['Training Co','DSD Cont','Manager']).map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select>`;
        const genSel=u.type==='Others'?`<select id="ag_${esc(u.username)}" style="width:auto;font-size:12px">${GENPOS.map(g=>`<option value="${g}" ${u.genpo===g?'selected':''}>${CO[g]}</option>`).join('')}</select>`:'';
        let actions='';
        if(u.status==='pending')actions=`<button class="mini" style="color:var(--ok);border-color:var(--ok)" onclick="Admin.approve('${esc(u.username)}')">อนุมัติ</button><button class="mini" style="color:var(--alert);border-color:var(--alert)" onclick="Admin.reject('${esc(u.username)}')">ปฏิเสธ</button>`;
        else if(u.status==='active'&&!u.admin)actions=`<button class="mini" onclick="Admin.suspend('${esc(u.username)}')">ระงับ</button>`;
        else if(u.status==='suspended')actions=`<button class="mini" onclick="Admin.suspend('${esc(u.username)}')">คืนสิทธิ์</button>`;
        else if(u.status==='rejected')actions=`<button class="mini" style="color:var(--ok);border-color:var(--ok)" onclick="Admin.approve('${esc(u.username)}')">อนุมัติ</button>`;
        const reset=!u.admin?`<button class="mini" onclick="Admin.reset('${esc(u.username)}')">รีเซตรหัส</button>`:'';
        return`<div class="urow"><div style="flex:1;min-width:180px"><b>${esc(u.username)}</b> ${u.admin?'<span class="chip">Admin</span>':''}<br><span class="note">${esc(u.type)} · ${roleSel} ${genSel}</span></div><span class="tag ${u.status}">${u.status}</span><div style="display:flex;gap:6px;flex-wrap:wrap">${actions}${reset}</div></div>`;
      }).join('');}
  const roleOf=u=>{const s=document.getElementById('ar_'+u);return s?s.value:undefined;};
  const genOf=u=>{const s=document.getElementById('ag_'+u);return s?s.value:undefined;};
  async function approve(u){try{await api('POST','api/admin/approve',{username:u,role:roleOf(u),genpo:genOf(u)});toast('อนุมัติแล้ว');reload();}catch(e){toast(e.message);}}
  async function reject(u){if(!confirm('ปฏิเสธคำขอนี้?'))return;try{await api('POST','api/admin/reject',{username:u});reload();}catch(e){toast(e.message);}}
  async function suspend(u){try{await api('POST','api/admin/suspend',{username:u});reload();}catch(e){toast(e.message);}}
  async function reset(u){const p=prompt('ตั้งรหัสผ่านใหม่ให้ '+u+' (อย่างน้อย 6 ตัว)');if(p===null)return;if(p.length<6){toast('รหัสผ่านอย่างน้อย 6 ตัว');return;}
    try{await api('POST','api/admin/reset',{username:u,newPassword:p});toast('รีเซตรหัสผ่านแล้ว');reload();}catch(e){toast(e.message);}}
  return {render,reload,approve,reject,suspend,reset};
})();

/* ================= Import (นำเข้าข้อมูลเก่า) — เฉพาะ People Center ================= */
const Import=(()=>{
  let app='training',pending=null;
  const pick=(o,keys)=>{for(const k of keys)if(o[k]!==undefined&&o[k]!==''&&o[k]!==null)return o[k];return undefined;};
  function toISO(v){if(!v)return '';v=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
    let m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);if(m){return `${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}
    const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10);}
  function open(a){app=a;pending=null;
    const gsel=app==='calendar'?'':`<div class="frow"><label>นำเข้าไปที่บริษัท (Genpo)</label><select id="imGenpo">${GENPOS.map(g=>`<option value="${g}">${CO[g]}</option>`).join('')}</select></div>`;
    const hint={training:'รับ array ของหลักสูตร หรือ {courses:[...]} — ฟิลด์ที่อ่าน: name/course, vendor, start, end, count, code',
      dsd:'รับ array ของรุ่น หรือ {runs:[...]} — ฟิลด์: course/name, code, date, dateEnd, ppl, id, req/status, people(รหัสพนักงาน)',
      calendar:'รับ array ของกิจกรรม หรือ {events:[...]} — ฟิลด์: title, co, date, end, time, status, note'}[app];
    openModal(`<h2><span>นำเข้า</span>${app==='training'?'Training':app==='dsd'?'DSD':'Calendar'}</h2>
      <p class="note" style="margin-bottom:10px">วางข้อมูล JSON จากระบบเดิม แล้วกด "ตรวจสอบ" เพื่อดูตัวอย่างก่อนนำเข้า วันที่รับได้ทั้ง yyyy-mm-dd และ dd/mm/yyyy</p>
      ${gsel}
      <div class="frow"><label>ข้อมูล JSON</label><textarea id="imJson" rows="8" placeholder='[ { "name":"...", "start":"2026-05-08", "count":10 } ]'></textarea></div>
      <div id="imPrev" class="note"></div>
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-ghost" onclick="Import.check()">ตรวจสอบ</button><button class="btn btn-red" id="imGo" disabled onclick="Import.run()">นำเข้า</button></div>`);}
  function parse(){let raw;try{raw=JSON.parse(document.getElementById('imJson').value);}catch(e){throw new Error('JSON ไม่ถูกต้อง: '+e.message);}
    let arr=Array.isArray(raw)?raw:(raw.courses||raw.runs||raw.events||raw.data||[]);
    if(!Array.isArray(arr)||!arr.length)throw new Error('ไม่พบรายการข้อมูล');
    if(app==='training')return arr.map(o=>({name:pick(o,['name','course','title','courseName'])||'(ไม่มีชื่อ)',
      vendorName:pick(o,['vendorName','vendor','institute','สถาบัน'])||'',start:toISO(pick(o,['start','date','dateStart','startDate'])),
      end:toISO(pick(o,['end','dateEnd','endDate']))||toISO(pick(o,['start','date'])),count:+pick(o,['count','ppl','people','seats','จำนวน'])||1,
      cat:pick(o,['cat','category','ประเภท'])||'Public',code:pick(o,['code','trainingCode'])||''}));
    if(app==='dsd')return arr.map(o=>{let ppl=pick(o,['people','ids','empIds','รหัส']);let people=Array.isArray(ppl)?ppl.map(x=>String(x).trim()).filter(Boolean):(typeof ppl==='string'?ppl.split(/[\n,]/).map(x=>x.trim()).filter(Boolean):[]);
      let req=String(pick(o,['req','status'])||'').toLowerCase();req=/ok|รับรอง|approve|cert/.test(req)?'ok':/sent|ยื่น|submit/.test(req)?'sent':'none';
      const id=pick(o,['id','certId','courseId'])||'';return {course:pick(o,['course','name','title'])||'(ไม่มีชื่อ)',code:pick(o,['code','trainingCode'])||'',
      date:toISO(pick(o,['date','start','dateStart'])),dateEnd:toISO(pick(o,['dateEnd','end'])),ppl:pick(o,['ppl','count','seats'])!==undefined?+pick(o,['ppl','count','seats']):null,
      id:String(id),req:id?'ok':req,people};});
    return arr.map(o=>{let co=String(pick(o,['co','company','genpo'])||'HRST').toUpperCase().replace('-','').replace('HRST','HRST');if(!GENPOS.includes(co))co=co.includes('TH')&&co!=='HRST'?'TH':co.includes('EG')?'EGAS':'HRST';
      let st=String(pick(o,['status'])||'confirmed').toLowerCase();st=['confirmed','tentative','postponed','cancelled'].includes(st)?st:'confirmed';
      return {title:pick(o,['title','name','course'])||'(ไม่มีชื่อ)',co,date:toISO(pick(o,['date','start'])),end:toISO(pick(o,['end','dateEnd'])),time:pick(o,['time'])||'',status:st,note:pick(o,['note','remark'])||''};});}
  function check(){try{pending=parse();const sample=pending.slice(0,5).map(x=>'· '+esc(x.name||x.course||x.title||'')+(x.start||x.date?` (${fmtDMY(x.start||x.date)})`:'')).join('<br>');
    document.getElementById('imPrev').innerHTML=`<div style="background:#F4FAF5;border:1px solid #CBE6D0;border-radius:5px;padding:9px 12px;margin-top:4px"><b>พบ ${pending.length} รายการ</b><br>${sample}${pending.length>5?'<br>…':''}</div>`;
    document.getElementById('imGo').disabled=false;}catch(e){pending=null;document.getElementById('imGo').disabled=true;document.getElementById('imPrev').innerHTML=`<div class="autherr" style="margin-top:4px">${esc(e.message)}</div>`;}}
  async function run(){if(!pending)return;const by=state.profile.username;
    try{
      if(app==='training'){const g=document.getElementById('imGenpo').value;const s=state.train[g];let no=Math.max(0,...s.courses.map(c=>c.no||0));
        pending.forEach(p=>{no++;s.courses.push({id:Date.now().toString(36)+no,no,code:p.code||g+'-'+String(no).padStart(3,'0'),name:p.name,co:g,vendorName:p.vendorName,start:p.start,end:p.end,count:p.count,cat:p.cat,people:'',vendor:'none',pr:'none',by,imported:true,steps:{},stepTs:{},stepBy:{},stepRemark:{},docs:{},docBy:{}});});
        await App.saveTrain(g,'import '+pending.length+' courses');}
      else if(app==='dsd'){const g=document.getElementById('imGenpo').value;const s=state.dsd[g];
        pending.forEach((p,i)=>s.runs.push({id_:Date.now().toString(36)+i,code:p.code,co:g,course:p.course,date:p.date,dateEnd:p.dateEnd,dateText:'',ppl:p.ppl,id:p.id,req:p.req,reqDate:'',report:false,dept:false,receipt:false,cert:false,remark:'',people:p.people,by,imported:true}));
        await App.saveDsd(g,'import '+pending.length+' runs');}
      else {pending.forEach((p,i)=>state.cal.events.push({id:Date.now().toString(36)+i,title:p.title,co:p.co,date:p.date,end:p.end,time:p.time,status:p.status,note:p.note,by,history:['นำเข้าโดย '+by]}));
        await App.saveCal('import '+pending.length+' events');}
      closeModal();App.render();toast('นำเข้า '+pending.length+' รายการแล้ว');
    }catch(e){toast('นำเข้าไม่สำเร็จ: '+e.message);}}
  return {open,check,run};
})();

/* ================= seed (ว่าง — ข้อมูลเดิมนำเข้าผ่านปุ่ม "นำเข้าข้อมูล") ================= */
const SEED=[], CAL_SEED=[];

/* ================= modal helpers ================= */
function openModal(html){let m=document.getElementById('modal');if(!m){m=document.createElement('div');m.id='modal';m.className='modal';m.onclick=e=>{if(e.target===m)closeModal();};document.body.appendChild(m);}m.innerHTML=`<div class="mcard">${html}</div>`;m.classList.add('open');}
function closeModal(){const m=document.getElementById('modal');if(m)m.classList.remove('open');}

/* ================= boot ================= */
App.boot();
</script>
