/* =====================================================================
   8) CALENDAR ฝั่ง Training — grid รายเดือน อิงปีงบประมาณ Ki (เม.ย.–มี.ค.)
   ===================================================================== */
const DOW_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
/* สัดส่วนการอบรมต่อ Genpo ในเดือน (ไม่นับที่ยกเลิก) */
function genpoShare(evs){const c={};evs.forEach(e=>{if(e.status==='cancelled')return;c[e.co]=(c[e.co]||0)+1;});
  return GENPOS.filter(g=>c[g]).map(g=>({label:CO[g],value:c[g],color:gcolor(g),cls:g,text:c[g]})).sort((a,b)=>b.value-a.value);}
function calGrid(y,m,evsOf,cellClick,evClick,colorOf){const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),t=ymd(new Date());
  let cells='';for(let i=0;i<start;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){const ds=ymd(new Date(y,m,d)),de=evsOf(ds);
    cells+=`<div class="cal-cell${ds===t?' today':''}" onclick="${cellClick}('${ds}')"><div class="cal-d">${d}</div>${de.slice(0,3).map(e=>`<div class="cal-ev ${e.status==='cancelled'?'cancelled':''}" style="border-left-color:${colorOf(e)}" onclick="event.stopPropagation();${evClick}('${e.id}')" title="${esc(e.title)}"><span class="dotco ${e.co}"></span>${e.time?`<b>${esc(e.time)}</b> `:''}${esc(e.title)}</div>`).join('')}${de.length>3?`<div class="cal-more">+${de.length-3} more</div>`:''}</div>`;}
  const tail=(7-(start+days)%7)%7;for(let i=0;i<tail;i++)cells+='<div class="cal-cell empty"></div>';
  return `<div class="cal-grid">${DOW_EN.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;}
const inRange=(e,ds)=>e.date===ds||(e.end&&e.date<ds&&ds<=e.end);

const Calendar=(()=>{
  const STA={confirmed:{t:'Confirmed',c:'var(--ok)'},tentative:{t:'Temporary',c:'var(--wait)'},postponed:{t:'Postpone',c:'#8E5A00'},cancelled:{t:'Cancelled',c:'var(--none)'}};
  let cur=new Date(),cofil='ALL',byfil='ALL',editId=null;
  const evs=()=>state.cal.events;
  const kiOf=d=>{const y=d.getFullYear(),m=d.getMonth();return (m>=3?y:y-1)-1923;};
  const kiStartYear=k=>k+1923;
  const show=e=>(cofil==='ALL'||e.co===cofil)&&(byfil==='ALL'||e.by===byfil);
  const sta=e=>STA[e.status]||STA.confirmed;
  function render(el){
    const y=cur.getFullYear(),m=cur.getMonth(),key=`${y}-${String(m+1).padStart(2,'0')}`;
    const monthAll=evs().filter(e=>e.date&&e.date.slice(0,7)===key&&(byfil==='ALL'||e.by===byfil));
    const monthEvs=monthAll.filter(show).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
    const curKi=kiOf(cur),kis=[];for(let k=curKi-3;k<=curKi+3;k++)kis.push(k);
    const share=genpoShare(monthAll);
    el.innerHTML=`
      <div class="cal-top">
        <button class="btn btn-ghost" onclick="Calendar.move(-1)" aria-label="เดือนก่อน">‹</button>
        <div class="cal-title">${MONTH[m]} ${y}</div>
        <button class="btn btn-ghost" onclick="Calendar.move(1)" aria-label="เดือนถัดไป">›</button>
        <button class="btn btn-ghost" onclick="Calendar.today()">Today</button>
        <select onchange="Calendar.jumpKi(+this.value)" title="ปีงบประมาณ Ki">${kis.map(k=>`<option value="${k}" ${k===curKi?'selected':''}>${k} Ki (Apr ${kiStartYear(k)} – Mar ${kiStartYear(k)+1})</option>`).join('')}</select>
        <select onchange="Calendar.fil(this.value)">${genpoOptions(cofil,{all:true})}</select>
        <select onchange="Calendar.byFil(this.value)" title="กรองตามผู้เพิ่ม"><option value="ALL">ทุกผู้เพิ่ม</option>${App.creators().map(b=>`<option value="${esc(b)}" ${byfil===b?'selected':''}>${esc(b)}</option>`).join('')}</select>
        <span style="flex:1"></span>
        <button class="btn btn-red" onclick="Calendar.add('${ymd(new Date())}')">+ เพิ่มกิจกรรม</button>
      </div>
      <div class="cal-wrap">
        <div>${calGrid(y,m,ds=>evs().filter(e=>inRange(e,ds)&&show(e)),'Calendar.add','Calendar.open',e=>sta(e).c)}
          <div class="note" style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap">${Object.values(STA).map(s=>`<span><span class="dotco" style="background:${s.c}"></span>${s.t}</span>`).join('')}</div></div>
        <div class="side">
          <div class="panel"><h4>สัดส่วนการอบรมตาม Genpo · ${MON[m]} ${y}</h4>${hbars(share)}</div>
          <div class="panel agenda"><h4>กิจกรรมเดือนนี้ (${monthEvs.length})</h4>${monthEvs.length?monthEvs.map(e=>`<div class="ag-item" style="border-left-color:${sta(e).c}" onclick="Calendar.open('${e.id}')"><b>${esc(e.title)}</b><div class="m"><span class="co ${e.co}">${CO[e.co]||e.co}</span> ${fmtDMY(e.date)}${e.end?' – '+fmtDMY(e.end):''}${e.time?' · '+esc(e.time):''} · ${sta(e).t}</div></div>`).join(''):'<div class="note">ยังไม่มีกิจกรรมในเดือนนี้</div>'}</div>
        </div>
      </div>`;}
  function move(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);App.render();}
  function today(){cur=new Date();App.render();}
  function jumpKi(k){cur=new Date(kiStartYear(k),3,1);App.render();}
  function fil(c){cofil=c;App.render();}
  function byFil(b){byfil=b;App.render();}
  function add(date){editId=null;form({date,co:cofil==='ALL'?'HRST':cofil,status:'confirmed',time:'',end:'',title:'',note:''});}
  function open(id){const e=evs().find(x=>x.id===id);if(!e)return;editId=id;form(e,true);}
  function form(e,isEdit){openModal(`<h2>${isEdit?'แก้ไขกิจกรรม':'เพิ่มกิจกรรม'}</h2>
      <div class="frow"><label>ชื่อกิจกรรม</label><input id="ceTitle" value="${esc(e.title||'')}"></div>
      <div class="grid2">
        <div class="frow"><label>Genpo</label><select id="ceCo">${genpoOptions(e.co)}</select></div>
        <div class="frow"><label>สถานะ</label><select id="ceStatus">${Object.entries(STA).map(([k,v])=>`<option value="${k}" ${e.status===k?'selected':''}>${v.t}</option>`).join('')}</select></div>
        <div class="frow"><label>วันที่</label>${dateInput(e.date,'','ceDate')}</div>
        <div class="frow"><label>ถึงวันที่ (ถ้ามี)</label>${dateInput(e.end,'','ceEnd')}</div>
        <div class="frow"><label>เวลา</label><input id="ceTime" value="${esc(e.time||'')}" placeholder="09:00-16:00"></div></div>
      <div class="frow"><label>หมายเหตุ</label><textarea id="ceNote" rows="2">${esc(e.note||'')}</textarea></div>
      ${isEdit?`<p class="by">${e.by?'เพิ่มโดย '+esc(e.by):''}${e.code?' · Code '+esc(e.code)+' (ชื่อ/วันที่อัปเดตตาม Training)':''}</p>`:''}
      ${isEdit&&e.history&&e.history.length?`<div class="sumbox"><b>ประวัติแก้ไข</b><br>${e.history.slice(-5).map(esc).join('<br>')}</div>`:''}
      <div class="mfoot">${isEdit?`<button class="btn btn-ghost" style="color:var(--alert);margin-right:auto" onclick="Calendar.del()">ลบ</button>`:''}<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" onclick="Calendar.save()">บันทึก</button></div>`);}
  async function save(){const v=id=>$(id).value;const title=v('ceTitle').trim();if(!title){toast('กรอกชื่อกิจกรรม');return;}
    const date=parseDMY(v('ceDate'));if(!date){toast('วันที่ต้องเป็น dd/mm/yyyy');return;}
    const rec={title,co:v('ceCo'),status:v('ceStatus'),date,end:parseDMY(v('ceEnd')),time:v('ceTime').trim(),note:v('ceNote').trim()};
    const stamp=`${state.profile.username} ${todayDMY()} ${nowStamp()}`;
    if(editId){const e=evs().find(x=>x.id===editId);Object.assign(e,rec);(e.history=e.history||[]).push('แก้ไขโดย '+stamp);}
    else evs().push({id:Date.now().toString(36),...rec,by:state.profile.username,history:['สร้างโดย '+stamp]});
    try{await App.saveCal(editId?'edit event':'add event');closeModal();App.render();}catch(e){}}
  async function del(){if(!confirm('ลบกิจกรรมนี้?'))return;const e=evs().find(x=>x.id===editId);
    if(e&&e.code){state.cal.skip=state.cal.skip||[];if(!state.cal.skip.includes(e.code))state.cal.skip.push(e.code);}
    state.cal.events=evs().filter(x=>x.id!==editId);try{await App.saveCal('delete event');closeModal();App.render();}catch(err){}}
  return {render,move,today,jumpKi,fil,byFil,add,open,save,del};
})();

/* =====================================================================
   9) ADMIN — จัดการผู้ใช้ (English)
   ===================================================================== */
const Admin=(()=>{
  let users=[],q='';
  const ST={pending:'Pending',active:'Active',suspended:'Restricted',rejected:'Declined'};
  async function render(el){el.innerHTML=`<div class="pagehead"><h2>User management</h2><span class="note">Approve new accounts, change role or Genpo, restrict access and reset passwords.</span></div>
    <div class="toolbar"><input type="search" placeholder="Search username" style="width:220px" oninput="Admin.search(this.value)"><button class="btn btn-ghost" onclick="Admin.reload()">Refresh</button></div>
    <div id="admList" class="panel note">Loading…</div>`;await reload();}
  async function reload(){try{const r=await api('GET','api/admin/users');users=r.users||[];draw();}catch(e){const el=$('admList');if(el)el.textContent='Could not load users: '+e.message;}}
  function search(v){q=v.trim().toLowerCase();draw();}
  function draw(){const wrap=$('admList');if(!wrap)return;const order={pending:0,active:1,suspended:2,rejected:3};
    const us=users.filter(u=>!q||u.username.toLowerCase().includes(q)).sort((a,b)=>(order[a.status]-order[b.status])||a.username.localeCompare(b.username));
    const pend=us.filter(u=>u.status==='pending').length;const id=u=>esc(u.username);
    wrap.className='panel';
    wrap.innerHTML=(pend?`<div class="note" style="color:var(--wait);margin-bottom:6px">${pend} request(s) waiting for approval</div>`:'')+(us.length?us.map(u=>{const d=deptOf(u);
      const roles=[...d.roles];if(u.role&&!roles.includes(u.role))roles.push(u.role);
      const roleSel=`<select id="ar_${id(u)}" style="width:auto;font-size:12.5px;padding:4px 8px">${roles.map(r=>`<option ${u.role===r?'selected':''}>${esc(r)}</option>`).join('')}</select>`;
      const genSel=!d.allAccess?`<select id="ag_${id(u)}" style="width:auto;font-size:12.5px;padding:4px 8px">${GENPOS.map(g=>`<option value="${g}" ${u.genpo===g?'selected':''}>${CO[g]}</option>`).join('')}</select>`:'';
      let act='';
      if(u.status==='pending')act=`<button class="mini good" onclick="Admin.approve('${id(u)}')">Approve</button><button class="mini danger" onclick="Admin.reject('${id(u)}')">Decline</button>`;
      else if(u.status==='active'&&!u.admin)act=`<button class="mini good" onclick="Admin.approve('${id(u)}')">Save role</button><button class="mini" onclick="Admin.suspend('${id(u)}')">Restrict</button>`;
      else if(u.status==='suspended')act=`<button class="mini" onclick="Admin.suspend('${id(u)}')">Restore access</button>`;
      else if(u.status==='rejected')act=`<button class="mini good" onclick="Admin.approve('${id(u)}')">Approve</button>`;
      const reset=!u.admin?`<button class="mini" onclick="Admin.reset('${id(u)}')">Reset password</button>`:'';
      return`<div class="urow"><div style="flex:1;min-width:200px"><b>${esc(u.username)}</b> ${u.admin?'<span class="chip">Admin</span>':''}<br><span class="note">${esc(u.type||'')} · ${roleSel} ${genSel}</span></div><span class="tag ${u.status}">${ST[u.status]||u.status}</span><div style="display:flex;gap:6px;flex-wrap:wrap">${act}${reset}</div></div>`;}).join(''):'<p class="note">No users found.</p>');}
  const roleOf=u=>{const s=$('ar_'+u);return s?s.value:undefined;}, genOf=u=>{const s=$('ag_'+u);return s?s.value:undefined;};
  async function approve(u){try{await api('POST','api/admin/approve',{username:u,role:roleOf(u),genpo:genOf(u)});toast('Approved '+u);reload();}catch(e){toast(e.message);}}
  async function reject(u){if(!confirm('Decline this request?'))return;try{await api('POST','api/admin/reject',{username:u});toast('Declined '+u);reload();}catch(e){toast(e.message);}}
  async function suspend(u){try{await api('POST','api/admin/suspend',{username:u});toast('Access updated for '+u);reload();}catch(e){toast(e.message);}}
  async function reset(u){const p=prompt('New password for '+u+' (at least 6 characters)');if(p===null)return;if(p.length<6){toast('Password must be at least 6 characters');return;}
    try{await api('POST','api/admin/reset',{username:u,newPassword:p});toast('Password reset for '+u);reload();}catch(e){toast(e.message);}}
  return {render,reload,search,approve,reject,suspend,reset};
})();

/* =====================================================================
   10) DASHBOARD — ภาพรวม Training / DSD
   ===================================================================== */
const Dashboard=(()=>{
  let cofil='ALL';
  function render(el){
    const ts=App.allCourses().filter(({g})=>cofil==='ALL'||g===cofil);
    const ds=[];for(const g of Object.keys(state.dsd)){if(cofil!=='ALL'&&g!==cofil)continue;for(const r of(state.dsd[g].runs||[]))ds.push({r,g});}
    let tD=0,tP=0,tL=0,tCut=0;
    ts.forEach(({c,g})=>{if(c.steps.dsd)tD++;else if(Training.isLate(c,g))tL++;else tP++;const i=cutoffInfo(c,g);if(i&&i.days<=7)tCut++;});
    const bc={noreq:0,waitapv:0,ready:0,noreport:0,waitdept:0,waitdoc:0,done:0};ds.forEach(({r})=>bc[DSD.bucket(r)]++);
    const newN=ds.filter(({r})=>r.isNew).length;
    const concerns=[];
    ts.forEach(({c,g})=>{if(Training.isLate(c,g))concerns.push({sev:3,g,kind:'Training',code:c.code,name:c.name,detail:'Overdue, or training is soon but not yet confirmed',date:c.start});
      else{const i=cutoffInfo(c,g);if(i&&i.days<=7)concerns.push({sev:2,g,kind:'Training',code:c.code,name:c.name,detail:`Payment cut-off ${fmtDM(i.target)} · missing ${i.miss.join(' + ')}`,date:c.start});}});
    ds.forEach(({r,g})=>{const b=DSD.bucket(r);
      if(b==='noreport'){const d=daysUntil(DSD.reportDue(r));concerns.push({sev:3,g,kind:'DSD',code:r.code,name:r.course,detail:d<0?`Report overdue by ${-d} day(s)`:`Report due in ${d} day(s)`,date:r.date});}
      else if(b==='noreq'){const d=r.date?daysUntil(DSD.reqDue(r)):null;concerns.push({sev:d!==null&&d<=0?3:2,g,kind:'DSD',code:r.code,name:r.course,detail:d===null?'Not yet submitted for certification':d<=0?'Certification request overdue':`Not yet submitted · ${d} day(s) left`,date:r.date});}});
    concerns.sort((a,b)=>b.sev-a.sev||(a.date||'9999').localeCompare(b.date||'9999'));
    const byG={};ts.forEach(({g})=>byG[g]=(byG[g]||0)+1);
    el.innerHTML=`<div class="dash">
      <div class="dash-top"><div><div class="dash-title">Training overview</div><div class="dash-sub">Training &amp; DSD · ${cofil==='ALL'?'All Genpo':CO[cofil]}</div></div>
        <select onchange="Dashboard.setCo(this.value)">${genpoOptions(cofil,{all:true})}</select></div>
      <div class="kpis">
        <div class="kpi"><b>${ts.length}</b><span>Courses tracked</span></div>
        <div class="kpi ok"><b>${tD}</b><span>Completed (all steps)</span></div>
        <div class="kpi alert"><b>${tL}</b><span>At risk / overdue</span></div>
        <div class="kpi wait"><b>${tCut}</b><span>Near payment cut-off</span></div>
        <div class="kpi alert"><b>${bc.noreq}</b><span>DSD not yet submitted</span>${newN?`<small>${newN} new from Training</small>`:''}</div>
        <div class="kpi alert"><b>${bc.noreport}</b><span>DSD report overdue</span></div>
      </div>
      <div class="dgrid">
        ${chartCard('Training progress','By course status',[{label:'Completed',value:tD,color:C_OK},{label:'In progress',value:tP,color:C_PROG},{label:'At risk / overdue',value:tL,color:C_ALERT}],{centerLabel:'Courses'})}
        ${chartCard('DSD status','Certified · in progress · needs action',[{label:'Certified / completed',value:bc.ready+bc.done,color:C_OK},{label:'In progress',value:bc.waitapv+bc.waitdept+bc.waitdoc,color:C_WAIT},{label:'Not certified / report overdue',value:bc.noreq+bc.noreport,color:C_ALERT}],{centerLabel:'Batches'})}
        <div class="dcard"><div class="dcard-h"><h3>Courses by Genpo</h3><span class="dcard-s">Share of all tracked courses</span></div>${hbars(GENPOS.filter(g=>byG[g]).map(g=>({label:CO[g],value:byG[g],color:gcolor(g),cls:g})).sort((a,b)=>b.value-a.value))}</div>
      </div>
      <div class="concern"><div class="concern-h"><h3>Items needing attention</h3><span class="cnt">${concerns.length} item(s)</span></div>
        ${concerns.length?concerns.slice(0,15).map(c=>`<div class="crow s${c.sev}"><span class="sevdot"></span><span class="ck2">${c.kind}</span><span class="co ${c.g}">${CO[c.g]}</span>
          <div class="cnm"><b>${esc(c.code||'')} ${esc(c.name)}</b><div class="cd">${esc(c.detail)}</div></div><span class="cdt">${c.date?fmtDMY(c.date):'—'}</span></div>`).join('')+(concerns.length>15?`<div class="crow" style="justify-content:center;color:var(--sub)">and ${concerns.length-15} more</div>`:'')
        :'<div class="concern-empty">✓ Nothing urgent — everything is on schedule.</div>'}</div></div>`;}
  function setCo(v){cofil=v;App.render();}
  return {render,setCo};
})();

      <div class="grid3"><div class="frow"><label>Start date</label>${dateInput('','','hStart')}</div><div class="frow"><label>Expire date</label>${dateInput('','','hExp')}</div><div class="frow"><label>Base budget</label><input id="hBud" type="number" min="0"></div></div>

      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" onclick="Housing.add()">บันทึก</button></div>`);}
  async function add(){const g=$('hCo').value;const s=state.housing[g];if(!s){toast('ยังโหลดข้อมูล '+CO[g]+' ไม่ได้');return;}
    const h={id:Date.now().toString(36),no:$('hNo').value.trim()||String(s.contracts.length+1),name:$('hName').value.trim(),status:'Stay in Thailand',start:parseDMY($('hStart').value),expire:parseDMY($('hExp').value),
      apartment:$('hApt').value.trim(),contractNo:$('hCno').value.trim(),baseBudget:num($('hBud').value),co:g,by:state.profile.username,updated:todayISO()};

  const inp=(f,v,type='text')=>`<input ${type==='n'?'type="number" step="0.01"':''} value="${esc(v??'')}" onchange="Housing.edit('${f}',this.value,'${type}')">`;
  function openDetail(g,id){currentG=g;currentId=id;const h=cur();if(!h)return;const L=state.housing[g].contracts;const latest=housingLatest(L);const s=stat(h,g,latest);
    const hist=L.filter(x=>housingKey(x)===housingKey(h)).sort((a,b)=>(b.start||'').localeCompare(a.start||''));
    const f=(k,l,t='t')=>`<div class="frow"><label>${l}</label>${t==='d'?dateInput(h[k],`Housing.editDate('${k}',this.value)`):inp(k,h[k],t)}</div>`;

    openDrawer(`<div class="dhead"><h2><span class="co ${g}">${CO[g]}</span> <span class="code">No. ${esc(h.no||'')}</span> ${esc(housingLabel(h))}</h2><button class="btn btn-ghost" onclick="closeDrawer()" aria-label="ปิด">✕</button></div>
      <div class="dbody">
        <div class="statbox ${s.cl}"><b>${esc(s.label)}</b>${latest.has(h)?` <span class="note">· แจ้งเตือนล่วงหน้า ${cfg(g).aptNotice} วัน</span>`:''}</div>
        <div class="sect"><h3>ผู้พัก</h3><div class="grid2">${f('name','Japanese Expatriates Name')}${f('status','Status')}${f('deptCode','Dept. Code')}${f('no','No.')}</div></div>
        <div class="sect"><h3>ที่พัก</h3>${f('apartment','Apartment name (Room number)')}${f('address','Apartment address')}
          <div class="grid2">${f('propertyType','Type of property')}${f('agency','Agency name / Contact')}${f('landlord','Landlord / Lessor')}</div></div>
        <div class="sect"><h3>สัญญา</h3><div class="grid2">${f('contractNo','Contract number')}${f('start','Start date','d')}${f('expire','Expire date','d')}${f('updated','Updated','d')}</div>
          <div class="frow"><label>Movement of original contract</label><select onchange="Housing.edit('movement',this.value,'t')">${[...new Set([...(h.movement?[h.movement]:[]),...MOVEMENTS])].map(m=>`<option ${h.movement===m?'selected':''}>${esc(m)}</option>`).join('')}<option value="" ${!h.movement?'selected':''}>— ยังไม่ระบุ —</option></select></div>
          ${f('renewDetail','Details of contract renew')}${f('remark','Remark / Notice')}</div>
        <div class="sect"><h3>ค่าเช่า (บาท/เดือน)</h3><div class="grid2">${f('baseBudget','Base budget','n')}${f('room','① Room rental','n')}${f('furniture','② Furniture rental','n')}${f('appliance','③ Electric appliance rental','n')}${f('service','④ Service charge','n')}${f('vat','VAT 7%','n')}${f('wht5','W/H 5%','n')}${f('wht3','W/H 3%','n')}</div>
          <div class="sumbox">Rental fee <b>${money(h.rentalFee)}</b> · Net payment <b style="color:var(--red)">${money(h.netPayment)}</b>${over?` · <span class="chip alert">เกิน Budget ${money(num(h.rentalFee)-num(h.baseBudget))}</span>`:''}
            <div style="margin-top:6px"><button class="mini" onclick="Housing.calc(true)">คำนวณ VAT 7% + ยอดรวมใหม่</button> <button class="mini" onclick="Housing.calc(false)">รวมยอดโดยไม่มี VAT</button></div></div>
          <div class="grid2" style="margin-top:10px">${f('payToApt','Pay to APT','n')}${f('netPaidExVat','Net paid (− VAT)','n')}${f('expatIncome','駐在者の収入','n')}${f('cheque','Amount cheque','n')}</div></div>
        ${hist.length>1?`<div class="sect"><h3>ประวัติสัญญาของคนนี้ (${hist.length})</h3>${hist.map(x=>`<div class="docrow" style="cursor:pointer" onclick="Housing.openDrawer('${g}','${x.id}')"><span class="nm"><span class="code">No. ${esc(x.no)}</span> ${esc(x.apartment||'')}<br><span class="ts">${fmtDMY(x.start)} – ${fmtDMY(x.expire)} · ${money0(x.netPayment)} บาท</span></span>${x===h?'<span class="chip info">กำลังดู</span>':''}</div>`).join('')}</div>`:''}
        <div class="sect"><button class="mini" onclick="Housing.renew()">+ ต่อสัญญา (สร้าง No. ถัดไป)</button> <button class="mini danger" onclick="Housing.del()">ลบสัญญานี้</button></div>
        ${h.by?`<p class="by">เพิ่มโดย ${esc(h.by)}</p>`:''}
      </div>`);}
  function recompute(h){h.rentalFee=num(h.room)+num(h.furniture)+num(h.appliance)+num(h.service);h.netPayment=h.rentalFee+num(h.vat)-num(h.wht5)-num(h.wht3);h.payToApt=h.netPayment;h.netPaidExVat=h.rentalFee;}
  async function saveCur(msg){try{await App.saveKind('housing',currentG,msg);await App.autoLink();App.render();openDetail(currentG,currentId);}catch(e){}}
  async function edit(f,v,t){const h=cur();h[f]=t==='n'?num(v):v.trim();if(['room','furniture','appliance','service','vat','wht5','wht3'].includes(f))recompute(h);h.updated=todayISO();await saveCur('edit '+f);}
  async function editDate(f,dmy){const iso=dmy?parseDMY(dmy):'';if(dmy&&!iso){toast('วันที่ต้องเป็น dd/mm/yyyy');openDetail(currentG,currentId);return;}const h=cur();h[f]=iso;if(f!=='updated')h.updated=todayISO();await saveCur('edit '+f);}
  async function calc(withVat){const h=cur();const base=num(h.room)+num(h.furniture)+num(h.appliance)+num(h.service);h.vat=withVat?Math.round(base*7)/100:0;recompute(h);await saveCur('recalc');}
  async function renew(){const h=cur(),g=currentG,L=state.housing[g].contracts;const base=String(h.no).split('.')[0];
    const subs=L.filter(x=>housingKey(x)===housingKey(h)).map(x=>+(String(x.no).split('.')[1]||0));const nx=base+'.'+(Math.max(0,...subs)+1);
    const start=addDays(h.expire,1)||'',end=start?addDays(addDays(start,-1).replace(/^(\d{4})/,y=>String(+y+1)),0):'';
    const n={...h,id:Date.now().toString(36),no:nx,start,expire:end,movement:'Waiting for draft',contractNo:'',remark:'',updated:todayISO(),by:state.profile.username};
    L.push(n);try{await App.saveKind('housing',g,'renew '+nx);await App.autoLink();App.render();openDetail(g,n.id);toast('สร้างสัญญา No. '+nx+' แล้ว — ตรวจวันที่และค่าเช่า');}catch(e){}}
  async function del(){if(!confirm('ลบสัญญานี้?'))return;const s=state.housing[currentG];s.contracts=s.contracts.filter(x=>x.id!==currentId);try{await App.saveKind('housing',currentG,'delete');closeDrawer();App.render();}catch(e){}}
  function exportExcel(){const rs=rows().sort((a,b)=>String(a.h.no).localeCompare(String(b.h.no),undefined,{numeric:true}));
    xlsxExport('housing_'+dstamp()+'.xlsx',['Genpo',...HOUSING_FIELDS.map(f=>f[1]),'สถานะ'],rs.map(({h,g,s})=>[CO[g],...HOUSING_FIELDS.map(([k,,t])=>t==='d'?fmtDMY(h[k]):h[k]??''),s.label]));}
  return {render,setCo,setV,search,openAdd,add,openDrawer:openDetail,edit,editDate,calc,renew,del,exportExcel};
})();

  function setCo(v){cofil=v;App.render();}
  function setK(k){kfil=k;App.render();}
  function openAdd(){openModal(`<h2>เพิ่มรายการ Outboarding</h2>
    <div class="grid2"><div class="frow"><label>Genpo</label><select id="rsCo">${genpoOptions(cofil==='ALL'?'HRST':cofil)}</select></div>
      <div class="frow"><label>ประเภท</label><select id="rsKind"><option value="resignation">ลาออก</option><option value="retirement">เกษียณอายุ</option></select></div></div>
    <div class="frow"><label>ชื่อ</label><input id="rsName"></div>
    <div class="grid2"><div class="frow"><label>ตำแหน่ง</label><input id="rsPos"></div><div class="frow"><label>วันที่มีผล</label>${dateInput('','','rsDate')}</div></div>
    <div class="frow"><label>หมายเหตุ</label><textarea id="rsRemark" rows="2"></textarea></div>
    <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" onclick="Resign.addItem()">บันทึก</button></div>`);}

          <div class="kpis" style="margin:0;grid-template-columns:repeat(3,1fr)"><div class="kpi" style="padding:10px 12px"><b style="font-size:22px">${R.filter(({it})=>it.kind==='resignation').length}</b><span>Resignations</span></div>

        ${overB.map(x=>`<div class="crow s2"><span class="sevdot"></span><span class="co ${x.g}">${CO[x.g]}</span><div class="cnm"><b>${esc(housingLabel(x.h))}</b><div class="cd">${esc(x.h.apartment||'')}</div></div><span class="cdt">Rent ${money0(x.h.rentalFee)} / budget ${money0(x.h.baseBudget)} (+${money0(num(x.h.rentalFee)-num(x.h.baseBudget))})</span></div>`).join('')}</div>`:''}
      <div class="concern"><div class="concern-h"><h3>Items needing attention</h3><span class="cnt">${concerns.length} item(s)</span></div>
        ${concerns.length?concerns.slice(0,15).map(c=>`<div class="crow s${c.sev}"><span class="sevdot"></span><span class="ck2">${c.k}</span><span class="co ${c.g}">${CO[c.g]}</span><div class="cnm"><b>${esc(c.name)}</b><div class="cd">${esc(c.detail)}</div></div><span class="cdt">${fmtDMY(c.date)||'—'}</span></div>`).join('')
        :'<div class="concern-empty">✓ Nothing urgent — all contracts and permits are in date.</div>'}</div></div>`;}

/* =====================================================================
   OTHER · ACCOUNTING — เห็นเฉพาะรายการทำจ่ายของหลักสูตรใน Genpo ที่รับผิดชอบ
   ===================================================================== */
const Accounting=(()=>{
  let fil='open',q='',cofil='ALL',currentG=null,currentId=null;
  function find(id){for(const g of Object.keys(state.train)){const c=(state.train[g].courses||[]).find(x=>x.id===id);if(c)return{c,g};}return null;}
  const cur=()=>{const f=find(currentId);return f?f.c:null;};
  const vendorChip=c=>c.vendor==='ok'?'<span class="chip ok">Vendor พร้อม</span>':c.vendor==='none'||!c.vendor?'<span class="chip">มี Vendor แล้ว</span>':'<span class="chip wait">รอเปิด Vendor</span>';
  function render(el){
    let rows=App.allCourses().filter(({g})=>cofil==='ALL'||g===cofil);
    const notices=rows.filter(({c})=>c.vendorNotify&&!c.vendorAck);
    const open=rows.filter(({c})=>!c.steps.payment),paid=rows.filter(({c})=>c.steps.payment);
    const soon=open.filter(({c,g})=>{const i=cutoffInfo(c,g);return i&&i.days<=7;}).length;
    const openAmt=open.reduce((a,{c})=>a+invCalc(c).net,0);
    rows=fil==='open'?open:fil==='paid'?paid:rows;
    if(q){const qq=q.toLowerCase();rows=rows.filter(({c})=>(c.name+' '+(c.code||'')+' '+(c.invoiceNo||'')+' '+(c.vendorName||'')).toLowerCase().includes(qq));}
    rows.sort((a,b)=>(a.c.start||'9999').localeCompare(b.c.start||'9999'));
    el.innerHTML=`<div class="pagehead"><h2>Accounting · รายการทำจ่ายค่าอบรม</h2><span class="note">${state.profile.allAccess?'ทุก Genpo':CO[state.profile.genpo]}</span></div>
      ${notices.length?`<div class="banner"><b>Vendor เปิดในระบบแล้ว (${notices.length})</b> — Purchasing แจ้งว่าพร้อมทำจ่าย
        ${notices.map(({c,g})=>`<div class="row"><span class="co ${g}">${CO[g]}</span><span class="code">${esc(c.code)}</span><span style="flex:1">${esc(c.name)} · ${esc(c.vendorName||'')}</span><span class="cdate">${esc(c.vendorReadyAt||'')}</span><button class="mini good" onclick="Accounting.ack('${g}','${c.id}')">รับทราบ</button></div>`).join('')}</div>`:''}
      <div class="toolbar">
        ${state.profile.allAccess?`<select onchange="Accounting.setCo(this.value)">${genpoOptions(cofil,{all:true})}</select>`:''}
        <div class="cofil">${[['open','รอทำจ่าย'],['paid','จ่ายแล้ว'],['all','ทั้งหมด']].map(([k,t])=>`<button class="${fil===k?'on':''}" onclick="Accounting.setF('${k}')">${t}</button>`).join('')}</div>
        <input type="search" id="acq" placeholder="ค้นหา หลักสูตร / Invoice / Vendor" value="${esc(q)}" style="width:240px" oninput="Accounting.search(this.value)">
        <span style="flex:1"></span><button class="btn btn-ghost" onclick="Accounting.exportExcel()">Export Excel</button></div>
      <div class="tiles"><span class="tile wait"><b>${open.length}</b><span>รอทำจ่าย</span></span><span class="tile alert"><b>${soon}</b><span>ใกล้ cut off (≤7 วัน)</span></span>
        <span class="tile"><b>${money0(openAmt)}</b><span>ยอดรอจ่ายสุทธิ (บาท)</span></span><span class="tile ok"><b>${paid.length}</b><span>จ่ายแล้ว</span></span></div>
      <div class="tblwrap"><table><thead><tr><th>Code</th><th>หลักสูตร / Vendor</th><th>วันอบรม</th><th>ผู้เรียน</th><th>รอบทำจ่าย</th><th>Invoice</th><th class="num">ยอดสุทธิ</th><th>สถานะ</th></tr></thead><tbody>
      ${rows.length?rows.map(({c,g})=>{const v=invCalc(c),i=cutoffInfo(c,g),n=peopleArr(c).length;
        return`<tr class="clk" onclick="Accounting.openDrawer('${g}','${c.id}')"><td><span class="co ${g}">${CO[g]}</span><br><span class="code">${esc(c.code||'')}</span></td>
          <td class="cname">${esc(c.name)}<br><span style="font-size:var(--fs-xs);color:var(--sub)">${esc(c.vendorName||'')}</span> ${vendorChip(c)}</td>
          <td class="cdate">${courseRange(c)}</td><td title="${esc(peopleArr(c).join(', '))}">${n||c.count||''} คน</td>
          <td style="font-size:var(--fs-sm)">${esc((c.payRound||'—').replace('ทำจ่าย',''))}${i&&i.days<=7?`<br><span class="chip ${i.days<=3?'alert':'wait'}">cut off ${fmtDM(i.target)}</span>`:''}</td>
          <td style="font-size:var(--fs-sm)">${esc(c.invoiceNo||'')}${c.docs&&c.docs.invoice?' 📄':''}${c.invoiceDue?`<br><span class="by">ครบกำหนด ${fmtDMY(c.invoiceDue)}</span>`:''}</td>
          <td class="num">${v.price?money(v.net):'—'}</td>
          <td>${c.steps.payment?`<span class="chip ok">จ่ายแล้ว</span><br><span class="by">${esc(c.stepTs.payment||'')}</span>`:'<span class="chip wait">รอทำจ่าย</span>'}</td></tr>`;}).join(''):`<tr><td colspan="8" class="empty">ไม่มีรายการในมุมมองนี้</td></tr>`}</tbody></table></div>`;}
  function setF(f){fil=f;App.render();}
  function setCo(v){cofil=v;App.render();}
  function search(v){q=v;App.render();const i=$('acq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
  async function ack(g,id){const c=state.train[g].courses.find(x=>x.id===id);c.vendorAck=true;c.vendorAckBy=state.profile.username+' '+todayDMY();try{await App.saveTrain(g,'vendor ack');App.renderNav();App.render();}catch(e){}}
  function openDetail(g,id){currentG=g;currentId=id;const c=cur();if(!c)return;const v=invCalc(c);
    const doc=k=>{const f=(c.docs||{})[k];return`<div class="docrow"><span class="nm">${DOC_LABEL[k]}<br><span class="fn ${f?'':'miss'}">${f?esc(f):'ยังไม่มีไฟล์'}</span></span>${f?`<button class="mini" onclick="downloadDoc('${g}','${esc(f)}')">ดาวน์โหลด</button>`:''}${k!=='invoice'?`<button class="mini" onclick="Accounting.upDoc('${k}')">${f?'แทนที่':'อัปโหลด PDF'}</button>`:''}</div>`;};
    openDrawer(`<div class="dhead"><h2><span class="co ${g}">${CO[g]}</span> <span class="code">${esc(c.code||'')}</span> ${esc(c.name)}</h2><button class="btn btn-ghost" onclick="closeDrawer()" aria-label="ปิด">✕</button></div>
      <div class="dbody">
        <div class="sect"><h3>หลักสูตร</h3><dl class="kv"><dt>สถาบัน / Vendor</dt><dd>${esc(c.vendorName||'—')} ${vendorChip(c)}</dd><dt>วันอบรม</dt><dd>${courseRange(c)||'—'}</dd><dt>ประเภท</dt><dd>${esc(c.cat||'')}</dd>
          <dt>ผู้เรียน (${peopleArr(c).length||c.count||0})</dt><dd>${peopleArr(c).map(esc).join(', ')||'—'}</dd></dl></div>
        <div class="sect"><h3>การทำจ่าย</h3>
          <div class="step"><span class="nm"><b>ทำจ่ายเรียบร้อย</b>${c.steps.payment?` <span class="ts">${esc(c.stepTs.payment||'')} · ${esc((c.stepBy||{}).payment||'')}</span>`:''}</span><input type="checkbox" class="ck" aria-label="ทำจ่ายเรียบร้อย" ${c.steps.payment?'checked':''} onchange="Accounting.setPaid(this.checked)"></div>
          <div class="frow" style="margin-top:10px"><label>รอบทำจ่าย</label><select onchange="Accounting.edit('payRound',this.value)">${Training.PAYROUNDS.map(r=>`<option value="${r}" ${c.payRound===r?'selected':''}>${r||'— เลือกรอบทำจ่าย —'}</option>`).join('')}</select></div>
          <div class="grid2"><div class="frow"><label>ราคา/หัว ก่อน VAT</label><input type="number" step="0.01" value="${c.price??''}" onchange="Accounting.edit('price',+this.value||0)"></div>
            <div class="frow"><label>เลขที่ Invoice</label><input value="${esc(c.invoiceNo||'')}" onchange="Accounting.edit('invoiceNo',this.value)"></div>
            <div class="frow"><label>VAT</label><select onchange="Accounting.edit('vatOn',this.value==='1')"><option value="1" ${c.vatOn!==false?'selected':''}>มี VAT 7%</option><option value="0" ${c.vatOn===false?'selected':''}>ยกเว้น VAT</option></select></div>
            <div class="frow"><label>หัก ณ ที่จ่าย</label><select onchange="Accounting.edit('whtPct',+this.value)"><option value="0" ${!c.whtPct?'selected':''}>ไม่หัก</option><option value="3" ${c.whtPct===3?'selected':''}>3%</option></select></div>
            <div class="frow"><label>ครบกำหนดชำระ</label>${dateInput(c.invoiceDue,"Accounting.editDate('invoiceDue',this.value)")}</div></div>
          <div class="sumbox">${v.price?`${money(v.price)} × ${v.n} = <b>${money(v.sub)}</b>${v.vat?` + VAT ${money(v.vat)}`:''}${v.wht?` − หัก ณ ที่จ่าย ${money(v.wht)}`:''} → สุทธิ <b style="color:var(--red)">${money(v.net)}</b> บาท`:'ยังไม่มีราคา'}</div>
          <div class="frow" style="margin-top:10px"><label>หมายเหตุฝ่ายบัญชี</label><textarea rows="2" onchange="Accounting.edit('acctRemark',this.value)">${esc(c.acctRemark||'')}</textarea></div></div>
        <div class="sect"><h3>เอกสาร</h3>${doc('invoice')}${doc('payproof')}${doc('receipt')}</div></div>`);}
  async function saveCur(msg){try{await App.saveTrain(currentG,msg);App.render();openDetail(currentG,currentId);}catch(e){}}
  async function setPaid(v){const c=cur();c.steps.payment=v;c.stepTs=c.stepTs||{};c.stepBy=c.stepBy||{};c.stepTs.payment=v?todayDMY():null;c.stepBy.payment=v?state.profile.username:null;await saveCur('payment '+v);}
  async function edit(f,v){cur()[f]=v;await saveCur('acct edit '+f);}
  async function editDate(f,dmy){const iso=dmy?parseDMY(dmy):'';if(dmy&&!iso){toast('วันที่ต้องเป็น dd/mm/yyyy');openDetail(currentG,currentId);return;}await edit(f,iso);}
  async function upDoc(k){const c=cur(),g=currentG;try{if(await uploadCourseDoc(g,c,k)){await App.saveTrain(g,'doc '+k);toast('อัปโหลดสำเร็จ');App.render();openDetail(g,c.id);}}catch(e){toast('อัปโหลดไม่สำเร็จ: '+e.message);}}
  function exportExcel(){const rows=App.allCourses().filter(({g})=>cofil==='ALL'||g===cofil).map(({c,g})=>{const v=invCalc(c);return[CO[g],c.code,c.name,c.vendorName||'',fmtDMY(c.start),fmtDMY(c.end),peopleArr(c).join('; '),c.payRound||'',c.invoiceNo||'',fmtDMY(c.invoiceDue),v.sub,v.vat,v.wht,v.net,c.steps.payment?'จ่ายแล้ว':'รอทำจ่าย',(c.stepTs||{}).payment||''];});
    xlsxExport('accounting_'+dstamp()+'.xlsx',['Genpo','Code','หลักสูตร','Vendor','เริ่ม','สิ้นสุด','ผู้เรียน','รอบทำจ่าย','Invoice','ครบกำหนด','ก่อน VAT','VAT','หัก ณ ที่จ่าย','สุทธิ','สถานะ','วันที่จ่าย'],rows);}
  return {render,setF,setCo,search,ack,openDrawer:openDetail,setPaid,edit,editDate,upDoc,exportExcel};
})();

/* =====================================================================
   OTHER · PURCHASING — ติดตามการเปิด Vendor → เสร็จแล้วแจ้งบัญชีอัตโนมัติ
   ===================================================================== */
const Purchasing=(()=>{
  const VENDOR_DOCS=['แบบฟอร์มขอเปิด Vendor','หนังสือรับรองบริษัท','ภ.พ.20','สำเนาหน้าบัญชีธนาคาร','สำเนาบัตรผู้มีอำนาจลงนาม'];
  const ST={wait_docs:{t:'รอเอกสารจาก Vendor',cl:'wait'},review:{t:'พิจารณาเอกสาร',cl:'info'},ok:{t:'เปิดในระบบแล้ว',cl:'ok'}};
  let fil='open',cofil='ALL',currentG=null,currentId=null;
  function find(id){for(const g of Object.keys(state.train)){const c=(state.train[g].courses||[]).find(x=>x.id===id);if(c)return{c,g};}return null;}
  const cur=()=>{const f=find(currentId);return f?f.c:null;};
  const needs=c=>['wait_docs','review','ok'].includes(c.vendor)&&!(c.vendor==='ok'&&!c.vendorReq&&!c.vendorReadyAt);
  function render(el){
    const all=App.allCourses().filter(({c,g})=>(cofil==='ALL'||g===cofil)&&needs(c));
    const open=all.filter(({c})=>c.vendor!=='ok'),done=all.filter(({c})=>c.vendor==='ok');
    const rows=(fil==='open'?open:fil==='done'?done:all).sort((a,b)=>(a.c.start||'9999').localeCompare(b.c.start||'9999'));
    el.innerHTML=`<div class="pagehead"><h2>Purchasing · ติดตามการเปิด Vendor</h2><span class="note">${state.profile.allAccess?'ทุก Genpo':CO[state.profile.genpo]}</span></div>
      <div class="toolbar">${state.profile.allAccess?`<select onchange="Purchasing.setCo(this.value)">${genpoOptions(cofil,{all:true})}</select>`:''}
        <div class="cofil">${[['open','กำลังดำเนินการ'],['done','เสร็จแล้ว'],['all','ทั้งหมด']].map(([k,t])=>`<button class="${fil===k?'on':''}" onclick="Purchasing.setF('${k}')">${t}</button>`).join('')}</div></div>
      <div class="tiles"><span class="tile wait"><b>${open.filter(({c})=>c.vendor==='wait_docs').length}</b><span>รอเอกสาร</span></span><span class="tile info"><b>${open.filter(({c})=>c.vendor==='review').length}</b><span>พิจารณาเอกสาร</span></span><span class="tile ok"><b>${done.length}</b><span>เปิดแล้ว แจ้งบัญชีแล้ว</span></span></div>
      <div class="tblwrap"><table><thead><tr><th>Code</th><th>Vendor / หลักสูตร</th><th>วันอบรม</th><th>เอกสาร</th><th>สถานะ</th><th>บัญชี</th></tr></thead><tbody>
      ${rows.length?rows.map(({c,g})=>{const d=c.vendorDocs||{},n=VENDOR_DOCS.filter(x=>d[x]).length,s=ST[c.vendor]||ST.wait_docs;const dd=daysUntil(c.start);
        return`<tr class="clk ${c.vendor!=='ok'&&dd!==null&&dd<=14?'late':''}" onclick="Purchasing.openDrawer('${g}','${c.id}')"><td><span class="co ${g}">${CO[g]}</span><br><span class="code">${esc(c.code||'')}</span></td>
          <td class="cname"><b style="font-weight:600">${esc(c.vendorName||'(ยังไม่ระบุ Vendor)')}</b><br><span style="font-size:var(--fs-sm);color:var(--sub)">${esc(c.name)}</span></td>
          <td class="cdate">${courseRange(c)}${c.vendor!=='ok'&&dd!==null&&dd<=14&&dd>=0?`<br><span class="chip alert">อีก ${dd} วันอบรม</span>`:''}</td>
          <td>${n}/${VENDOR_DOCS.length}</td><td><span class="chip ${s.cl}">${s.t}</span></td>
          <td>${c.vendor==='ok'?(c.vendorAck?'<span class="chip ok">รับทราบแล้ว</span>':'<span class="chip info">แจ้งแล้ว</span>'):'—'}</td></tr>`;}).join(''):`<tr><td colspan="6" class="empty">ไม่มีคำขอเปิด Vendor ในมุมมองนี้</td></tr>`}</tbody></table></div>`;}
  function setF(f){fil=f;App.render();}
  function setCo(v){cofil=v;App.render();}
  function openDetail(g,id){currentG=g;currentId=id;const c=cur();if(!c)return;const d=c.vendorDocs||{};const all=VENDOR_DOCS.every(x=>d[x]);
    openDrawer(`<div class="dhead"><h2><span class="co ${g}">${CO[g]}</span> ${esc(c.vendorName||'Vendor ใหม่')}</h2><button class="btn btn-ghost" onclick="closeDrawer()" aria-label="ปิด">✕</button></div>
      <div class="dbody">
        <div class="sect"><h3>คำขอ</h3><dl class="kv"><dt>หลักสูตร</dt><dd><span class="code">${esc(c.code||'')}</span> ${esc(c.name)}</dd><dt>วันอบรม</dt><dd>${courseRange(c)||'—'}</dd><dt>ขอโดย</dt><dd>${esc(c.by||'')}</dd></dl>
          <div class="frow" style="margin-top:10px"><label>ชื่อ Vendor</label><input value="${esc(c.vendorName||'')}" onchange="Purchasing.edit('vendorName',this.value)"></div></div>
        <div class="sect"><h3>เอกสารเปิด Vendor</h3>${VENDOR_DOCS.map((x,i)=>`<div class="step"><span class="nm">${esc(x)}</span>${d[x]?`<span class="ts">${esc(d[x])}</span>`:''}<input type="checkbox" class="ck" aria-label="${esc(x)}" ${d[x]?'checked':''} onchange="Purchasing.setDoc(${i},this.checked)"></div>`).join('')}</div>
        <div class="sect"><h3>สถานะ</h3><select onchange="Purchasing.setSt(this.value)">${Object.entries(ST).filter(([k])=>k!=='ok'||c.vendor==='ok').map(([k,v])=>`<option value="${k}" ${c.vendor===k?'selected':''}>${v.t}</option>`).join('')}</select>
          <div class="frow" style="margin-top:10px"><label>หมายเหตุ</label><textarea rows="2" onchange="Purchasing.edit('vendorRemark',this.value)">${esc(c.vendorRemark||'')}</textarea></div>
          ${c.vendor==='ok'?`<div class="statbox ok">เปิด Vendor เสร็จ ${esc(c.vendorReadyAt||'')} · ${c.vendorAck?'บัญชีรับทราบแล้ว ('+esc(c.vendorAckBy||'')+')':'แจ้งบัญชีแล้ว รอรับทราบ'}</div>`
            :`<button class="btn btn-red" style="width:100%;justify-content:center;margin-top:4px" ${all?'':'data-tip="ติ๊กเอกสารให้ครบก่อน หรือกดยืนยันเพื่อข้าม"'} onclick="Purchasing.complete()">เสร็จสิ้น — แจ้งบัญชีว่ามี Vendor ในระบบแล้ว</button>`}</div></div>`);}
  async function saveCur(msg){try{await App.saveTrain(currentG,msg);App.renderNav();App.render();openDetail(currentG,currentId);}catch(e){}}
  async function edit(f,v){cur()[f]=v;await saveCur('purch edit '+f);}
  async function setDoc(i,v){const c=cur();c.vendorDocs=c.vendorDocs||{};c.vendorDocs[VENDOR_DOCS[i]]=v?todayDMY():null;await saveCur('vendor doc');}
  async function setSt(v){const c=cur();c.vendor=v;c.vendorReq=true;c.vendorBy=state.profile.username;await saveCur('vendor '+v);}
  async function complete(){const c=cur();const d=c.vendorDocs||{};if(!VENDOR_DOCS.every(x=>d[x])&&!confirm('เอกสารยังไม่ครบ — ยืนยันว่าเปิด Vendor ในระบบแล้ว?'))return;
    Object.assign(c,{vendor:'ok',vendorReq:true,vendorReadyAt:todayDMY(),vendorBy:state.profile.username,vendorNotify:true,vendorAck:false});await saveCur('vendor ready');toast('แจ้งบัญชีแล้ว');}
  return {render,setF,setCo,openDrawer:openDetail,edit,setDoc,setSt,complete};
})();

/* =====================================================================
   OTHER · SAFETY — บันทึกการอบรมด้าน Safety (ไม่เห็นรายการอื่น)
   ===================================================================== */
const Safety=(()=>{
  const TYPES=['Mandatory (กฎหมาย)','Refresher','จป. / Safety Officer','Fire drill / ดับเพลิง','First aid','Forklift / เครื่องจักร','Other'];
  let cofil='ALL',q='',currentG=null,currentId=null;
  function find(id){for(const g of Object.keys(state.safety)){const r=(state.safety[g].records||[]).find(x=>x.id===id);if(r)return{r,g};}return null;}
  const cur=()=>{const f=find(currentId);return f?f.r:null;};
  const all=()=>{const o=[];for(const g of Object.keys(state.safety)){if(cofil!=='ALL'&&g!==cofil)continue;(state.safety[g].records||[]).forEach(r=>o.push({r,g}));}return o;};
  const kiNow=()=>{const d=new Date();return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;};
  function render(el){let rows=all();const fy=kiNow(),inFy=rows.filter(({r})=>r.date&&r.date>=`${fy}-04-01`&&r.date<=`${fy+1}-03-31`);
    if(q){const qq=q.toLowerCase();rows=rows.filter(({r})=>(r.title+' '+(r.trainer||'')+' '+(r.people||[]).join(' ')).toLowerCase().includes(qq));}
    rows.sort((a,b)=>(b.r.date||'').localeCompare(a.r.date||''));
    el.innerHTML=`<div class="pagehead"><h2>Safety training records</h2><span class="note">${state.profile.allAccess?'ทุก Genpo':CO[state.profile.genpo]}</span></div>
      <div class="toolbar"><button class="btn btn-red" onclick="Safety.openAdd()">+ บันทึกการอบรม</button>
        ${state.profile.allAccess?`<select onchange="Safety.setCo(this.value)">${genpoOptions(cofil,{all:true})}</select>`:''}
        <input type="search" id="sq" placeholder="ค้นหา หลักสูตร / วิทยากร / ชื่อผู้เรียน" value="${esc(q)}" style="width:250px" oninput="Safety.search(this.value)">
        <span style="flex:1"></span><button class="btn btn-ghost" onclick="Safety.exportExcel()">Export Excel</button></div>
      <div class="tiles"><span class="tile"><b>${inFy.length}</b><span>ครั้ง (ปีงบ Apr ${fy} – Mar ${fy+1})</span></span>
        <span class="tile"><b>${inFy.reduce((a,{r})=>a+(r.people||[]).length,0)}</b><span>คน·ครั้ง</span></span>
        <span class="tile"><b>${inFy.reduce((a,{r})=>a+(+r.hours||0)*((r.people||[]).length||1),0)}</b><span>ชั่วโมงอบรมรวม</span></span></div>
      <div class="tblwrap"><table><thead><tr><th>Genpo</th><th>หลักสูตร</th><th>ประเภท</th><th>วันที่</th><th class="num">ชม.</th><th>วิทยากร</th><th class="num">ผู้เรียน</th></tr></thead><tbody>
      ${rows.length?rows.map(({r,g})=>`<tr class="clk" onclick="Safety.openDrawer('${g}','${r.id}')"><td><span class="co ${g}">${CO[g]}</span></td><td class="cname">${esc(r.title)}${r.by?`<br><span class="by">บันทึกโดย ${esc(r.by)}</span>`:''}</td>
        <td><span class="chip">${esc(r.type||'')}</span></td><td class="cdate">${fmtDMY(r.date)}${r.end&&r.end!==r.date?' – '+fmtDMY(r.end):''}</td><td class="num">${r.hours||''}</td><td>${esc(r.trainer||'')}</td><td class="num">${(r.people||[]).length}</td></tr>`).join('')
        :`<tr><td colspan="7" class="empty">ยังไม่มีบันทึก — กด "+ บันทึกการอบรม"</td></tr>`}</tbody></table></div>`;}
  function setCo(v){cofil=v;App.render();}
  function search(v){q=v;App.render();const i=$('sq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
  const form=(r,g,isEdit)=>`
      ${state.profile.allAccess&&!isEdit?`<div class="frow"><label>Genpo</label><select id="sfCo">${genpoOptions(g)}</select></div>`:`<input type="hidden" id="sfCo" value="${g}">`}
      <div class="frow"><label>ชื่อหลักสูตร</label><input id="sfTitle" value="${esc(r.title||'')}"></div>
      <div class="grid2"><div class="frow"><label>ประเภท</label><select id="sfType">${[...new Set([...TYPES,...(r.type?[r.type]:[])])].map(t=>`<option ${r.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
        <div class="frow"><label>วิทยากร / ผู้จัด</label><input id="sfTrainer" value="${esc(r.trainer||'')}"></div></div>
      <div class="grid3"><div class="frow"><label>วันที่</label>${dateInput(r.date,'','sfDate')}</div><div class="frow"><label>ถึงวันที่ (ถ้ามี)</label>${dateInput(r.end,'','sfEnd')}</div><div class="frow"><label>ชั่วโมง/คน</label><input id="sfHours" type="number" min="0" step="0.5" value="${r.hours??''}"></div></div>
      <div class="frow"><label>รายชื่อผู้เข้าอบรม (บรรทัดละ 1 คน)</label><textarea id="sfPeople" rows="5">${esc((r.people||[]).join('\n'))}</textarea></div>
      <div class="frow"><label>หมายเหตุ</label><textarea id="sfRemark" rows="2">${esc(r.remark||'')}</textarea></div>`;
  function openAdd(){const g=state.profile.allAccess?(cofil==='ALL'?'HRST':cofil):state.profile.genpo;editId=null;
    openModal(`<h2>บันทึกการอบรม Safety</h2>${form({},g,false)}<div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" onclick="Safety.save()">บันทึก</button></div>`);}
  let editId=null;
  function openDetail(g,id){currentG=g;currentId=id;editId=id;const r=cur();if(!r)return;
    openModal(`<h2><span class="co ${g}">${CO[g]}</span> แก้ไขบันทึก</h2>${form(r,g,true)}<div class="mfoot"><button class="btn btn-ghost" style="color:var(--alert);margin-right:auto" onclick="Safety.del()">ลบ</button><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" onclick="Safety.save()">บันทึก</button></div>`);}
  async function save(){const g=$('sfCo').value,title=$('sfTitle').value.trim();if(!title){toast('กรอกชื่อหลักสูตร');return;}
    const date=parseDMY($('sfDate').value);if(!date){toast('วันที่ต้องเป็น dd/mm/yyyy');return;}
    const s=state.safety[g];if(!s){toast('ยังโหลดข้อมูล '+CO[g]+' ไม่ได้');return;}
    const rec={title,type:$('sfType').value,trainer:$('sfTrainer').value.trim(),date,end:parseDMY($('sfEnd').value),hours:+$('sfHours').value||0,
      people:$('sfPeople').value.split('\n').map(x=>x.trim()).filter(Boolean),remark:$('sfRemark').value.trim()};
    if(editId)Object.assign(cur(),rec);else s.records.push({id:Date.now().toString(36),...rec,co:g,by:state.profile.username});
    try{await App.saveKind('safety',g,editId?'edit safety':'add safety');closeModal();App.render();toast('บันทึกแล้ว');}catch(e){}}
  async function del(){if(!confirm('ลบบันทึกนี้?'))return;const s=state.safety[currentG];s.records=s.records.filter(x=>x.id!==currentId);try{await App.saveKind('safety',currentG,'delete');closeModal();App.render();}catch(e){}}
  function exportExcel(){xlsxExport('safety_'+dstamp()+'.xlsx',['Genpo','หลักสูตร','ประเภท','วันที่','ถึง','ชั่วโมง','วิทยากร','จำนวนผู้เรียน','รายชื่อ','หมายเหตุ','บันทึกโดย'],
    all().map(({r,g})=>[CO[g],r.title,r.type,fmtDMY(r.date),fmtDMY(r.end),r.hours,r.trainer,(r.people||[]).length,(r.people||[]).join('; '),r.remark||'',r.by||'']));}
  return {render,setCo,search,openAdd,openDrawer:openDetail,save,del,exportExcel};
})();

/* =====================================================================
   ⚙ SETTINGS — ผู้รับผิดชอบแต่ละ Genpo ตั้งค่าการแจ้งเตือนเองได้
   ===================================================================== */
const Settings=(()=>{
  const F={
    trainWarn:{t:'เตือนหลักสูตรที่ยังไม่ส่งอีเมลยืนยัน',d:'ขึ้นสถานะเสี่ยงเมื่อใกล้วันอบรมแต่ยังไม่ส่ง Information Email',u:'วันก่อนอบรม',min:1,max:60},
    dsdLead:{t:'ยื่นขอรับรองหลักสูตร DSD ล่วงหน้า',d:'กำหนดยื่นขอรับรองก่อนวันอบรม',u:'วัน',min:1,max:120},
    dsdReport:{t:'ยื่นรายงาน DSD หลังอบรม',d:'ครบกำหนดยื่นรายงานการฝึกหลังวันอบรมวันสุดท้าย',u:'วัน',min:1,max:180},
    payMid:{t:'ตัดรอบทำจ่ายกลางเดือน',d:'วันที่ของเดือนที่ต้องส่งเอกสารครบสำหรับรอบกลางเดือน',u:'วันที่',min:1,max:28},
    payEnd:{t:'ตัดรอบทำจ่ายปลายเดือน',d:'วันที่ของเดือนที่ต้องส่งเอกสารครบสำหรับรอบปลายเดือน',u:'วันที่',min:1,max:31},
    visaNotice:{t:'แจ้งเตือน Visa / Work Permit ใกล้หมดอายุ',d:'เริ่มขึ้นสีส้มในตารางและ Dashboard',u:'วันล่วงหน้า',min:7,max:365},
    aptNotice:{t:'แจ้งเตือนสัญญาที่พักใกล้หมด',d:'เริ่มขึ้นสีส้มในหน้า Housing และลงปฏิทิน',u:'วันล่วงหน้า',min:7,max:365}};
  const GROUPS={training:{t:'Training & DSD',h:'ใช้ในหน้า Training, DSD และ Dashboard',k:['trainWarn','dsdLead','dsdReport']},
    pay:{t:'รอบทำจ่าย',h:'ใช้คำนวณ cut off ในหน้า Training และ Accounting',k:['payMid','payEnd']},
    vwp:{t:'Visa & ที่พัก',h:'ใช้ในหน้า Visa & Work Permit, Housing และ Dashboard',k:['visaNotice','aptNotice']}};
  let g=null,draft={};
  function groupsFor(){const p=state.profile;if(p.admin)return['training','pay','vwp'];if(p.deptNav==='TR')return['training','pay'];if(p.deptNav==='VWP')return['vwp'];if(roleIs('Accounting'))return['pay'];return[];}
  const editable=()=>scopeGenpos();
  function render(el){const gs=editable();if(!g||!gs.includes(g))g=gs.includes('HRST')?'HRST':gs[0];
    const saved=cfg(g),val=k=>draft[k]??saved[k];const grp=groupsFor();
    el.innerHTML=`<div class="set-wrap"><div class="pagehead"><h2>ตั้งค่าการแจ้งเตือน</h2><span class="note">ค่าที่ตั้งจะใช้กับ Genpo ที่เลือกเท่านั้น</span></div>
      ${gs.length>1?`<div class="set-g" role="tablist">${gs.map(x=>`<button class="${x===g?'on':''}" onclick="Settings.pick('${x}')"><span class="dotco ${x}"></span>${CO[x]}</button>`).join('')}</div>`:''}
      ${grp.length?grp.map(k=>{const G=GROUPS[k];return`<div class="set-card"><h3>${G.t}</h3><div class="hint">${G.h}</div>${G.k.map(f=>{const d=F[f],ch=draft[f]!==undefined&&draft[f]!==saved[f];
        return`<div class="set-row ${ch?'changed':''}"><div class="t"><b>${d.t}</b><span>${d.d} · ค่าเริ่มต้น ${DEF_SET[f]}</span></div>
          <div class="stepper"><button type="button" aria-label="ลด" onclick="Settings.bump('${f}',-1)">−</button><input type="number" id="set_${f}" min="${d.min}" max="${d.max}" value="${val(f)}" onchange="Settings.setV('${f}',this.value)"><span class="u">${d.u}</span><button type="button" aria-label="เพิ่ม" onclick="Settings.bump('${f}',1)">+</button></div></div>`;}).join('')}</div>`;}).join('')
        :'<div class="panel note">ตำแหน่งนี้ยังไม่มีค่าที่ต้องตั้ง</div>'}
      ${grp.length?`<div class="set-foot"><span class="note" style="margin-right:auto">${Object.keys(draft).length?'มีการเปลี่ยนแปลงที่ยังไม่บันทึก':''}</span>
        <button class="btn btn-ghost" onclick="Settings.reset()">คืนค่าเริ่มต้น</button><button class="btn btn-ghost" onclick="Settings.cancel()" ${Object.keys(draft).length?'':'disabled'}>ยกเลิก</button>
        <button class="btn btn-red" onclick="Settings.save()" ${Object.keys(draft).length?'':'disabled'}>บันทึกการตั้งค่า ${CO[g]}</button></div>`:''}</div>`;}
  function pick(x){if(Object.keys(draft).length&&!confirm('ยังไม่ได้บันทึก — เปลี่ยน Genpo และทิ้งการแก้ไข?'))return;g=x;draft={};App.render();}
  function clamp(f,v){const d=F[f];v=Math.round(+v||0);return Math.min(d.max,Math.max(d.min,v));}
  function setV(f,v){draft[f]=clamp(f,v);if(draft[f]===cfg(g)[f])delete draft[f];App.render();}
  function bump(f,n){setV(f,(draft[f]??cfg(g)[f])+n);}
  function cancel(){draft={};App.render();}
  function reset(){const keys=groupsFor().flatMap(k=>GROUPS[k].k);keys.forEach(f=>{if(cfg(g)[f]!==DEF_SET[f])draft[f]=DEF_SET[f];else delete draft[f];});App.render();}
  async function save(){state.settings.genpos=state.settings.genpos||{};const next={...(state.settings.genpos[g]||{}),...draft,updatedBy:state.profile.username,updatedAt:todayDMY()};
    const prev=state.settings.genpos[g];state.settings.genpos[g]=next;
    try{await App.saveSettings('settings '+g);draft={};toast('บันทึกการตั้งค่า '+CO[g]+' แล้ว');App.render();}catch(e){state.settings.genpos[g]=prev;}}
  return {render,pick,setV,bump,cancel,reset,save};
})();

/* =====================================================================
   IMPORT — Excel/CSV/JSON (รวมทะเบียนที่พักตามไฟล์ตัวอย่าง)
   ===================================================================== */
const Import=(()=>{
  let app='training',pending=null;
  const pick=(o,keys)=>{for(const k of keys)if(o[k]!==undefined&&o[k]!==''&&o[k]!==null)return o[k];return undefined;};
  const nk=s=>String(s).toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{N}]/gu,'');
  function normCo(v,fallback){const s=String(v||'').toUpperCase().trim().replace(/\s/g,'');
    for(const g of GENPOS)if(s===g||s===CO[g].toUpperCase()||s.startsWith(g+'-')||s.startsWith(g+'M'))return g;
    if(s.includes('HRS'))return 'HRST';if(s.includes('EG'))return 'EGAS';return fallback||'HRST';}
  const APP_TXT={training:'Training',dsd:'DSD',vwp:'Visa & Work Permit',resign:'Outboarding',housing:'Housing (ทะเบียนที่พัก)'};
  /* หัวคอลัมน์ทะเบียนที่พัก → field (เทียบแบบตัดช่องว่าง/สัญลักษณ์) */
  const HMAP=[['japaneseexpatriatesname','name'],['status','status'],['startdate','start'],['expiredate','expire'],['apartmentname','apartment'],['apartmentaddress','address'],
    ['basebudget','baseBudget'],['agencyname','agency'],['typeofproperty','propertyType'],['movement','movement'],['detailsofcontractrenew','renewDetail'],['deptcode','deptCode'],
    ['contractnumber','contractNo'],['updated','updated'],['remark','remark'],['nameoflandlord','landlord'],['rentalfee','rentalFee'],['netpayment','netPayment'],['roomrental','room'],
    ['furniturerental','furniture'],['electricappliance','appliance'],['servicecharge','service'],['vat7','vat'],['wh5','wht5'],['wh3','wht3'],['paytoapt','payToApt'],['netpaidvat','netPaidExVat'],
    ['駐在者の収入','expatIncome'],['amountcheque','cheque']];
  function housingRow(o){const r={};for(const [k,v] of Object.entries(o)){const n=nk(k);if(n==='no'){r.no=String(v).trim();continue;}
      const m=HMAP.find(([p])=>n.includes(p));if(m&&r[m[1]]===undefined)r[m[1]]=v;}
    const f=Object.fromEntries(HOUSING_FIELDS.map(x=>[x[0],x[2]]));
    for(const k in r){if(f[k]==='n')r[k]=num(r[k]);else if(f[k]==='d')r[k]=toISO(r[k]);else r[k]=String(r[k]??'').trim();}
    return r;}
  function open(a){app=a;pending=null;
    const hint={training:'คอลัมน์ที่อ่าน: name/course, vendor, start, end, count, code',dsd:'คอลัมน์: course, code, date, dateEnd, ppl, id, req, people',
      vwp:'คอลัมน์: name, type, relatedTo, position, visaExpiry, remark',resign:'คอลัมน์: name, kind (resignation/retirement), position, date, remark',
      housing:'อ่านหัวคอลัมน์ตามไฟล์ทะเบียนที่พัก (No., Japanese Expatriates Name, Start Date, Expire Date, RENTAL FEE, …) · Genpo แยกจากเลขสัญญาให้อัตโนมัติ เช่น HATC-M1020192 → HATC'}[app];
    openModal(`<h2>Import ${APP_TXT[app]}</h2>
      <div class="frow"><label>${app==='housing'?'Genpo สำรอง (ใช้เมื่อแยกจากเลขสัญญาไม่ได้)':'นำเข้าไปที่ Genpo'}</label><select id="imGenpo">${genpoOptions(app==='housing'?'HATC':'HRST')}</select></div>
      <div class="frow"><label>ไฟล์ Excel (.xlsx/.xls) หรือ CSV</label><input type="file" id="imFile" accept=".xlsx,.xls,.csv" onchange="Import.fromFile(this.files[0])"></div>
      <p class="note" style="margin-bottom:8px">${hint} · วันที่รับได้ทั้ง dd/mm/yyyy, 1/Sep/2025 และ yyyy-mm-dd</p>
      <details><summary class="note" style="cursor:pointer">หรือวางข้อมูล JSON</summary><textarea id="imJson" rows="6" style="margin-top:6px"></textarea></details>
      <div id="imPrev" class="note" style="margin-top:8px"></div>
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-ghost" onclick="Import.check()">ตรวจสอบ</button><button class="btn btn-red" id="imGo" disabled onclick="Import.run()">นำเข้า</button></div>`);}
  function fromFile(file){if(!file)return;if(!window.XLSX){toast('โหลดไลบรารีอ่าน Excel ไม่ได้ (ต้องต่ออินเทอร์เน็ต) — วาง JSON แทน');return;}
    const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});$('imJson').value=JSON.stringify(rows);check();}catch(err){toast('อ่านไฟล์ไม่สำเร็จ: '+err.message);}};
    rd.readAsArrayBuffer(file);}
  function parse(){let raw;try{raw=JSON.parse($('imJson').value);}catch(e){throw new Error('ข้อมูลไม่ถูกต้อง: '+e.message);}
    let arr=Array.isArray(raw)?raw:(raw.courses||raw.runs||raw.people||raw.items||raw.contracts||raw.data||[]);
    if(!Array.isArray(arr)||!arr.length)throw new Error('ไม่พบรายการในไฟล์');
    if(app==='training')return arr.map(o=>({name:pick(o,['name','course','title','courseName'])||'(ไม่มีชื่อ)',vendorName:pick(o,['vendorName','vendor','institute','สถาบัน'])||'',
      start:toISO(pick(o,['start','date','dateStart','startDate'])),end:toISO(pick(o,['end','dateEnd','endDate']))||toISO(pick(o,['start','date'])),count:+pick(o,['count','ppl','seats','จำนวน'])||1,
      cat:pick(o,['cat','category','ประเภท'])||'Public',code:pick(o,['code','trainingCode'])||''}));
    if(app==='dsd')return arr.map(o=>{const ppl=pick(o,['people','ids','empIds','รหัส']);const people=Array.isArray(ppl)?ppl.map(x=>String(x).trim()).filter(Boolean):(typeof ppl==='string'?ppl.split(/[\n,;]/).map(x=>x.trim()).filter(Boolean):[]);
      let req=String(pick(o,['req','status'])||'').toLowerCase();req=/ok|รับรอง|approve|cert/.test(req)?'ok':/sent|ยื่น|submit/.test(req)?'sent':'none';const id=String(pick(o,['id','certId','courseId'])||'');
      return{course:pick(o,['course','name','title'])||'(ไม่มีชื่อ)',code:pick(o,['code','trainingCode'])||'',date:toISO(pick(o,['date','start'])),dateEnd:toISO(pick(o,['dateEnd','end'])),ppl:pick(o,['ppl','count','seats'])!==undefined?+pick(o,['ppl','count','seats']):null,id,req:id?'ok':req,people};});
    if(app==='vwp')return arr.map(o=>{let et=String(pick(o,['empType','type','ประเภท'])||'employee').toLowerCase();et=/family|ครอบครัว|dependent/.test(et)?'family':'employee';
      return{name:pick(o,['name','ชื่อ','fullName'])||'(ไม่มีชื่อ)',empType:et,relatedTo:pick(o,['relatedTo','familyOf'])||'',position:pick(o,['position','ตำแหน่ง'])||'',
        visaNo:pick(o,['visaNo','visaNumber'])||'',visaExpiry:toISO(pick(o,['visaExpiry','visa','workPermitExpiry'])),remark:pick(o,['remark','note','หมายเหตุ'])||''};});
    if(app==='resign')return arr.map(o=>{let k=String(pick(o,['kind','type','ประเภท'])||'resignation').toLowerCase();k=/retire|เกษียณ/.test(k)?'retirement':'resignation';
      return{name:pick(o,['name','ชื่อ'])||'(ไม่มีชื่อ)',kind:k,position:pick(o,['position','ตำแหน่ง'])||'',date:toISO(pick(o,['date','effectiveDate','วันที่'])),remark:pick(o,['remark','note'])||''};});
    if(app==='housing'){const fb=$('imGenpo').value;return arr.map(housingRow).filter(r=>r.no||r.apartment||r.contractNo).map(r=>({...r,co:normCo(r.contractNo||r.deptCode,normCo(r.deptCode,fb))}));}
    return [];}
  function check(){try{pending=parse();
    const lbl=x=>app==='housing'?`No. ${esc(x.no)} · ${esc(x.apartment||'')} · <span class="co ${x.co}">${CO[x.co]}</span> · ${fmtDMY(x.start)} – ${fmtDMY(x.expire)} · ${money0(x.netPayment)} บาท`:esc(x.name||x.course||'')+(x.start||x.date||x.visaExpiry?` (${fmtDMY(x.start||x.date||x.visaExpiry)})`:'');
    $('imPrev').innerHTML=`<div class="statbox ok"><b>พบ ${pending.length} รายการ</b><br>${pending.slice(0,6).map(x=>'· '+lbl(x)).join('<br>')}${pending.length>6?'<br>…':''}</div>`;$('imGo').disabled=false;}
    catch(e){pending=null;$('imGo').disabled=true;$('imPrev').innerHTML=`<div class="autherr">${esc(e.message)}</div>`;}}
  async function run(){if(!pending)return;const by=state.profile.username,g=$('imGenpo').value;const uid=i=>Date.now().toString(36)+i+Math.random().toString(36).slice(2,5);
    try{
      if(app==='housing'){const touched=new Set();for(const [i,p] of pending.entries()){const s=state.housing[p.co];if(!s){toast('ยังโหลดข้อมูล '+CO[p.co]+' ไม่ได้ — ข้ามรายการนี้');continue;}
          const ex=s.contracts.find(x=>(p.contractNo&&x.contractNo===p.contractNo&&x.no===p.no)||(!p.contractNo&&x.no===p.no&&x.apartment===p.apartment));
          if(ex)Object.assign(ex,p);else s.contracts.push({id:uid(i),...p,by,imported:true});touched.add(p.co);}
        for(const x of touched)await App.saveKind('housing',x,'import housing');}
      else{const kind={training:'train',dsd:'dsd',vwp:'vwp',resign:'resign'}[app],s=state[kind][g];if(!s){toast('ยังโหลดข้อมูล '+CO[g]+' ไม่ได้');return;}
        if(app==='training'){let no=Math.max(0,...s.courses.map(c=>c.no||0));pending.forEach((p,i)=>{no++;s.courses.push({id:uid(i),no,code:p.code||g+'-'+String(no).padStart(3,'0'),name:p.name,co:g,vendorName:p.vendorName,start:p.start,end:p.end,count:p.count,cat:p.cat,people:[],vendor:'none',pr:'none',by,imported:true,steps:{},stepTs:{},stepBy:{},stepRemark:{},docs:{},docBy:{}});});}
        if(app==='dsd')pending.forEach((p,i)=>s.runs.push({id_:uid(i),...p,co:g,dateText:'',reqDate:'',report:false,dept:false,receipt:false,cert:false,remark:'',by,imported:true,source:'manual'}));
        if(app==='vwp'){let no=Math.max(0,...s.people.map(x=>x.no||0));pending.forEach((p,i)=>{no++;s.people.push({id:uid(i),no,...p,co:g,visaRemark:'',by,imported:true});});}
        if(app==='resign'){let no=Math.max(0,...s.items.map(x=>x.no||0));pending.forEach((p,i)=>{no++;s.items.push({id:uid(i),no,...p,co:g,by,imported:true});});}
        await App.saveKind(kind,g,'import '+pending.length);}
      closeModal();await App.autoLink();App.render();toast('นำเข้า '+pending.length+' รายการแล้ว');
    }catch(e){toast('นำเข้าไม่สำเร็จ: '+e.message);}}
  return {open,fromFile,check,run};
})();

/* ================= boot ================= */
App.boot();
</script>
</body>
</html>
