<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People Center Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =====================================================================
   1) DESIGN TOKENS — แก้ตรงนี้เพื่อเปลี่ยนสี ฟอนต์ ขนาด ทั้งแอป
   ฟอนต์: ใช้ FC Home ถ้าเครื่องติดตั้งไว้ ถ้าไม่มีจะใช้ Anuphan (Google Fonts) แทน
   ===================================================================== */
:root{
  --font:'FC Home','FCHome','FC Home Regular','Anuphan',system-ui,sans-serif;
  --fs:14px; --fs-sm:12.5px; --fs-xs:11.5px; --fs-h:18px; --fs-brand:21px; --fs-kpi:28px;
  --red:#CC0000; --red-dark:#A30000; --ink:#1A1A1A; --sub:#666A70;
  --line:#E3E3E6; --line2:#F0F0F2; --bg:#F6F6F7; --card:#FFFFFF;
  --ok:#1E8E3E; --wait:#B26A00; --none:#9AA0A6; --alert:#D93025; --info:#1565C0;
  --radius:6px;
  /* สีประจำ Genpo (9 บริษัท) */
  --c-TH:#1F3A5F; --c-HRST:#CC0000; --c-EGAS:#3F6F68; --c-HAC-AO:#6A4C93; --c-APM:#B86E00;
  --c-HLCT:#1B7F9E; --c-HATC:#8C2F39; --c-HRAP:#4E7D2B; --c-ASH:#5B6770;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:var(--fs);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:var(--fs-sm);color:inherit}
input,select,textarea{font-family:inherit;font-size:var(--fs);border:1px solid var(--line);border-radius:5px;padding:8px 10px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
label{font-size:var(--fs-sm);color:var(--sub);display:block;margin-bottom:4px}
.btn{padding:8px 15px;border-radius:5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-dark)}
.btn-ghost{border:1px solid var(--line);background:#fff}.btn-ghost:hover{border-color:var(--sub)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:var(--fs-xs);padding:2px 9px;border-radius:10px;background:#EFEFF1;color:var(--sub);white-space:nowrap}
.chip.ok{background:#E6F4EA;color:var(--ok)}.chip.wait{background:#FFF3E0;color:var(--wait)}
.chip.alert{background:#FDE7E7;color:var(--alert)}.chip.info{background:#E7F0FB;color:var(--info)}
.code{display:inline-block;font-size:var(--fs-xs);font-weight:500;padding:1px 7px;border-radius:4px;background:#F0F0F2;color:#444;letter-spacing:.02em}
/* Genpo badge + dot: สีมาจาก --c-<Genpo> */
.co,.dotco{--gc:var(--sub)}
.co.TH,.dotco.TH{--gc:var(--c-TH)}.co.HRST,.dotco.HRST{--gc:var(--c-HRST)}.co.EGAS,.dotco.EGAS{--gc:var(--c-EGAS)}
.co.HAC-AO,.dotco.HAC-AO{--gc:var(--c-HAC-AO)}.co.APM,.dotco.APM{--gc:var(--c-APM)}.co.HLCT,.dotco.HLCT{--gc:var(--c-HLCT)}
.co.HATC,.dotco.HATC{--gc:var(--c-HATC)}.co.HRAP,.dotco.HRAP{--gc:var(--c-HRAP)}.co.ASH,.dotco.ASH{--gc:var(--c-ASH)}
.co{display:inline-block;font-size:var(--fs-xs);font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap;color:var(--gc);background:color-mix(in srgb,var(--gc) 11%,#fff)}
.dotco{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;background:var(--gc)}
.by{font-size:var(--fs-xs);color:var(--none)}
.note{font-size:var(--fs-sm);color:var(--sub);line-height:1.6}
.hide{display:none!important}

/* tooltip: เอาเมาส์วางแล้วเห็นคำอธิบาย */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:400;line-height:1.5;padding:7px 11px;border-radius:6px;width:max-content;max-width:250px;white-space:normal;text-align:left;z-index:80;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}

[data-tip].tip-down:hover::after{bottom:auto;top:calc(100% + 8px);left:auto;right:0;transform:none}
/* ---- chip box รายชื่อผู้เข้าอบรม ---- */
.chipbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff;min-height:42px}
.chipbox:focus-within{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
.chip.person{display:inline-flex;align-items:center;gap:4px;background:#E7EEF7;color:var(--c-TH);padding:3px 4px 3px 10px;font-size:var(--fs-sm)}
.chip.person .cplbl{cursor:pointer}.chip.person .cplbl:hover{text-decoration:underline}
.chipx{opacity:.55;font-size:15px;line-height:1;padding:1px 5px}.chipx:hover{opacity:1}
.chipbox input{border:none;outline:none;flex:1;min-width:150px;padding:4px 2px;background:transparent}
.chiphint{font-size:var(--fs-xs);color:var(--sub);margin-top:4px}

/* ---- วงกลมติ๊กถูก (checklist) ---- */
input[type=checkbox].ck{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid #C9CBD0;background:#fff;cursor:pointer;position:relative;flex-shrink:0;padding:0;transition:background .15s,border-color .15s}
input[type=checkbox].ck:hover{border-color:var(--ok)}
input[type=checkbox].ck:checked{background:var(--ok);border-color:var(--ok)}
input[type=checkbox].ck:checked::after{content:'';position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
input[type=checkbox].ck:focus{outline:2px solid var(--red);outline-offset:2px}

/* ================= Login ================= */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#fff 0,#fff 38%,var(--bg) 38%)}
.authcard{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:10px;width:min(400px,100%);padding:30px 30px 24px;box-shadow:0 12px 40px rgba(0,0,0,.07)}
.authlogo{height:22px;display:block;margin-bottom:14px}
.authcard h1{font-size:24px;font-weight:700;letter-spacing:-.2px;margin-bottom:20px;white-space:nowrap}
.frow{margin-bottom:14px}
.pick{display:grid;gap:9px}
.pickbtn{border:1px solid var(--line);border-radius:8px;padding:13px 16px;text-align:left;background:#fff;font-size:15px;font-weight:500;display:flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.pickbtn:hover{border-color:var(--red);background:#FFF8F8}
.pickbtn::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red);opacity:.0;transition:opacity .15s}
.pickbtn:hover::before{opacity:1}
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbtn{border:1px solid var(--line);border-radius:8px;padding:12px 6px;background:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px}
.gbtn:hover{border-color:var(--red);background:#FFF8F8}
.authlink{color:var(--red);font-size:var(--fs-sm);cursor:pointer}
.authlink:hover{text-decoration:underline}
.authfoot{margin-top:18px;display:flex;justify-content:space-between;gap:10px}
.autherr{background:#FDE7E7;color:var(--alert);font-size:var(--fs-sm);padding:9px 12px;border-radius:5px;margin-bottom:14px}
.authok{background:#E6F4EA;color:var(--ok);font-size:var(--fs-sm);padding:9px 12px;border-radius:5px;margin-bottom:14px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.crumbs span{font-size:var(--fs-xs);background:#F2F2F4;border-radius:10px;padding:2px 10px;color:var(--ink);font-weight:500}

/* ================= Header ================= */
header{background:var(--card);border-bottom:2px solid var(--red);padding:0 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;height:60px}
header .brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
header .brand img{height:18px;width:auto;display:block}
header .brand .bar{width:1px;height:26px;background:var(--line)}
header .brand .nm{font-size:var(--fs-brand);font-weight:700;letter-spacing:-.3px;white-space:nowrap;line-height:1}
.nav{display:flex;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:0 12px;font-size:var(--fs);font-weight:500;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-2px;position:relative;white-space:nowrap}
.nav button.on{color:var(--red);border-bottom-color:var(--red);font-weight:600}
.nav button:hover{color:var(--ink)}
.nav .badge{position:absolute;top:10px;right:2px;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}
.hdr-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.whoami{font-size:var(--fs-xs);color:var(--sub);text-align:right;line-height:1.35}
.whoami b{color:var(--ink);font-weight:600;font-size:var(--fs-sm)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.iconbtn:hover,.iconbtn.on{border-color:var(--red);color:var(--red)}
.wssel{width:auto;font-size:var(--fs-sm);padding:6px 8px;font-weight:600}
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.syncline{display:flex;justify-content:flex-end;margin-bottom:6px;min-height:18px}
#syncState{font-size:var(--fs-xs);color:var(--sub)}
.pagehead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h2{font-size:var(--fs-h);font-weight:700;letter-spacing:-.2px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar select,.toolbar input[type=search]{width:auto}
.cofil{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.cofil button{padding:8px 13px;color:var(--sub)}.cofil button.on{background:var(--red);color:#fff}

/* ================= Tables ================= */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th{font-size:var(--fs-xs);font-weight:600;color:var(--sub);text-align:left;padding:10px;border-bottom:1px solid var(--line);background:#FBFBFC;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover{background:#FFF7F7}
tbody tr.late{box-shadow:inset 3px 0 0 var(--alert)}
tbody tr.isnew{box-shadow:inset 3px 0 0 var(--info);background:#F5F9FF}
.newtag{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--info);border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px}
.cname{max-width:320px}.cdate{white-space:nowrap;font-size:var(--fs-sm);color:var(--sub)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mrow td{background:#FBFBFC;font-size:var(--fs-xs);font-weight:600;color:var(--sub);letter-spacing:.03em;cursor:default}
.empty{color:var(--sub);text-align:center;padding:34px!important}
.dots{display:flex;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;background:#E9E9EB;border:1px solid #DADADD}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.wait{background:#FFD9A0;border-color:var(--wait)}
.dot.hot{background:var(--alert);border-color:var(--alert)}

.tiles{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:9px 15px;text-align:left;min-width:108px;line-height:1.35}
.tile b{display:block;font-size:21px;font-weight:600}.tile span{display:block;font-size:var(--fs-xs);color:var(--sub)}
button.tile:hover{border-color:var(--sub)}.tile.on{border-color:var(--red);box-shadow:inset 0 -2px 0 var(--red)}
.tile.alert b{color:var(--alert)}.tile.wait b{color:var(--wait)}.tile.ok b{color:var(--ok)}.tile.info b{color:var(--info)}

.banner{background:#F3F8FF;border:1px solid #CFE0F7;border-left:3px solid var(--info);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.banner>b{color:var(--info)}
.banner .row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed #D6E4F5;flex-wrap:wrap}
.banner .row:first-of-type{border-top:none}

/* ================= Drawer / Modal ================= */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}#ov.open{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--card);z-index:21;transform:translateX(100%);transition:transform .2s;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.12)}
#drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
.dhead{padding:16px 20px;border-bottom:2px solid var(--red);display:flex;align-items:flex-start;gap:10px;position:sticky;top:0;background:var(--card);z-index:2}
.dhead h2{font-size:var(--fs-h);font-weight:600;flex:1;line-height:1.4}
.dbody{padding:16px 20px 40px}
.sect{margin-bottom:22px}.sect h3{font-size:var(--fs-sm);font-weight:600;color:var(--red);margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.step{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:none}.step .who{font-size:var(--fs-xs);color:var(--sub);min-width:84px}.step .nm{flex:1}
.step select{width:auto}.step .ts{font-size:var(--fs-xs);color:var(--sub)}
.step.sub{padding:4px 0 7px 94px;border-bottom:none}
.reqbox,.statbox{border:1px solid var(--line);border-left-width:3px;border-radius:5px;padding:10px 12px;background:#FAFAFA;margin-bottom:10px}
.reqbox.none,.statbox.alert{border-left-color:var(--alert);background:#FEF6F6}.reqbox.sent,.statbox.wait{border-left-color:var(--wait);background:#FFFAF2}
.reqbox.ok,.statbox.ok{border-left-color:var(--ok);background:#F4FAF5}.statbox.none{border-left-color:var(--none)}
.reqline{display:flex;align-items:center;gap:9px}.reqdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.reqbox.none .reqdot{background:var(--alert)}.reqbox.sent .reqdot{background:var(--wait)}.reqbox.ok .reqdot{background:var(--ok)}
.mini{font-size:var(--fs-xs);padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:#fff;white-space:nowrap}.mini:hover{border-color:var(--red);color:var(--red)}
.mini.danger{color:var(--alert);border-color:var(--alert)}.mini.good{color:var(--ok);border-color:var(--ok)}
.docrow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.docrow:last-child{border-bottom:none}
.docrow .nm{flex:1}.fn{font-size:var(--fs-xs);color:var(--ok);word-break:break-all}.fn.miss{color:var(--none)}
.fileitem{display:flex;align-items:center;gap:6px;padding:2px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:var(--fs)}.kv dt{color:var(--sub);font-size:var(--fs-sm)}
.sumbox{background:#FAFAFA;border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin-top:4px;font-size:var(--fs-sm)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:30;overflow-y:auto;padding:30px 12px}
.modal.open{display:flex}
.mcard{background:#fff;border-radius:10px;width:min(660px,100%);padding:22px 24px}
.mcard h2{font-size:var(--fs-h);font-weight:600;margin-bottom:16px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.tabs{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;width:fit-content;margin-bottom:12px}
.tabs button{padding:6px 16px;background:#fff}.tabs button.on{background:var(--red);color:#fff}
#emailOut{font-size:13px;height:300px;white-space:pre-wrap}
.urow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}.urow:last-child{border-bottom:none}
.tag{font-size:var(--fs-xs);padding:2px 9px;border-radius:10px;font-weight:600}
.tag.pending{background:#FFF3E0;color:var(--wait)}.tag.active{background:#E6F4EA;color:var(--ok)}.tag.rejected{background:#FDE7E7;color:var(--alert)}.tag.suspended{background:#EFEFEF;color:var(--sub)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:6px;font-size:var(--fs-sm);display:none;z-index:90;max-width:90vw}

/* ================= Calendar ================= */
.cal-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-top select{width:auto}
.cal-title{font-size:var(--fs-h);font-weight:700;min-width:170px;text-align:center}
.cal-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px}@media(max-width:900px){.cal-wrap{grid-template-columns:1fr}}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-dow{background:#FBFBFC;padding:7px 0;text-align:center;font-size:var(--fs-xs);color:var(--sub);font-weight:600}
.cal-cell{background:#fff;min-height:96px;padding:4px 5px;cursor:pointer;overflow:hidden}.cal-cell.empty{background:#FAFAFA;cursor:default}.cal-cell:hover{background:#FFF9F9}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--red)}
.cal-d{font-size:var(--fs-xs);color:var(--sub);margin-bottom:3px}
.cal-ev{font-size:11.5px;background:#F6F6F7;border-left:3px solid;border-radius:3px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev.cancelled{text-decoration:line-through;opacity:.6}
.cal-more{font-size:var(--fs-xs);color:var(--sub)}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.panel h4{font-size:var(--fs-sm);font-weight:600;margin-bottom:8px}
.agenda{max-height:520px;overflow:auto}
.ag-item{border-left:3px solid;padding:6px 9px;margin-bottom:7px;background:#FAFAFA;border-radius:0 5px 5px 0;cursor:pointer}
.ag-item b{font-size:var(--fs-sm);font-weight:600}.ag-item .m{font-size:var(--fs-xs);color:var(--sub)}
.hbar{display:grid;grid-template-columns:62px 1fr 42px;gap:8px;align-items:center;font-size:var(--fs-xs);margin-bottom:6px}
.hbar .trk{height:8px;background:#F0F0F2;border-radius:4px;overflow:hidden}.hbar .fil{height:100%;border-radius:4px}
.hbar .pc{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}

/* ================= Dashboards ================= */
.dash .dash-top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.dash .dash-title{font-size:24px;font-weight:700;letter-spacing:-.4px}
.dash .dash-sub{font-size:var(--fs-sm);color:var(--sub)}
.dash .dash-top select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:var(--fs-kpi);font-weight:700;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi.ok b{color:var(--ok)}.kpi.wait b{color:var(--wait)}.kpi.alert b{color:var(--alert)}
.kpi span{display:block;font-size:var(--fs-sm);color:var(--sub);margin-top:4px;line-height:1.35}
.kpi small{display:block;font-size:var(--fs-xs);color:var(--none);margin-top:2px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;margin-bottom:16px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.dcard-h{margin-bottom:12px}.dcard-h h3{font-size:15px;font-weight:600}
.dcard-s{font-size:var(--fs-xs);color:var(--sub)}
.dcard-b{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media(max-width:420px){.dcard-b{grid-template-columns:1fr;justify-items:center}.dl{width:100%}}
.dchart{display:flex;justify-content:center}
.dl{display:flex;flex-direction:column;gap:8px}
.dl-row{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm)}
.dl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dl-lb{flex:1;color:#3C3C43}.dl-vl{font-weight:700;min-width:26px;text-align:right}
.dl-pc{color:var(--sub);min-width:36px;text-align:right;font-size:var(--fs-xs)}
.concern{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.concern-h{padding:14px 18px 10px;display:flex;align-items:center;gap:8px}
.concern-h h3{font-size:16px;font-weight:700;flex:1}.concern-h .cnt{font-size:var(--fs-sm);color:var(--sub)}
.crow{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line2)}
.crow .sevdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.crow.s3 .sevdot{background:var(--alert)}.crow.s2 .sevdot{background:var(--wait)}
.crow .ck2{font-size:var(--fs-xs);font-weight:600;padding:3px 9px;border-radius:6px;flex-shrink:0;background:#F0F0F2}
.crow .cnm{flex:1;min-width:0}.crow .cnm b{font-weight:600}
.crow .cnm .cd{font-size:var(--fs-sm);color:var(--sub)}
.crow .cdt{font-size:var(--fs-sm);color:var(--sub);white-space:nowrap}
.concern-empty{padding:30px;text-align:center;color:var(--ok);font-weight:600}

/* ================= Settings ================= */
.set-wrap{max-width:820px}
.set-g{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.set-g button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;font-weight:600;font-size:var(--fs-sm);display:inline-flex;align-items:center}
.set-g button.on{border-color:var(--red);background:#FFF5F5;color:var(--red)}
.set-card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.set-card h3{font-size:15px;font-weight:600;padding:14px 18px 4px}
.set-card .hint{font-size:var(--fs-sm);color:var(--sub);padding:0 18px 8px}
.set-row{display:flex;align-items:center;gap:16px;padding:12px 18px;border-top:1px solid var(--line2)}
.set-row .t{flex:1}.set-row .t b{font-weight:500;display:block}.set-row .t span{font-size:var(--fs-sm);color:var(--sub)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.stepper button{width:36px;height:36px;font-size:18px;color:var(--sub)}.stepper button:hover{background:#F5F5F6;color:var(--ink)}
.stepper input{width:58px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;font-weight:600;padding:7px 4px}
.stepper .u{min-width:96px;padding:0 10px;font-size:var(--fs-sm);color:var(--sub)}
.set-row.changed{background:#FFFBF2}
.set-foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:6px}
</style>

const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const isISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
function addDays(iso,n){if(!isISO(iso))return null;const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function daysUntil(iso){if(!isISO(iso))return null;return Math.round((new Date(iso+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/864e5);}

function fmtDMY(iso){if(!isISO(iso))return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`;}
function parseDMY(s){s=(s||'').trim();const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);if(!m)return '';const d=+m[1],mo=+m[2],y=+m[3];if(mo<1||mo>12||d<1||d>31)return '';return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function dmask(el){let v=el.value.replace(/\D/g,'').slice(0,8);let o=v.slice(0,2);if(v.length>2)o+='/'+v.slice(2,4);if(v.length>4)o+='/'+v.slice(4,8);el.value=o;}
function dateInput(iso,handler,id){return `<input type="text" inputmode="numeric" placeholder="dd/mm/yyyy" ${id?`id="${id}"`:''} value="${fmtDMY(iso)}" oninput="dmask(this)"${handler?` onchange="${handler}"`:''}>`;}
/* อ่านวันที่จากไฟล์นำเข้า: ISO, dd/mm/yyyy, d/Mon/yyyy, Excel serial */
function toISO(v){if(v===undefined||v===null||v==='')return '';
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?'':d.toISOString().slice(0,10);}
  v=String(v).trim();if(isISO(v))return v;
  let m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);if(m)return `${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
  m=/^(\d{1,2})[\/\-\s]([A-Za-z]{3})[A-Za-z]*[\/\-\s](\d{2,4})$/.exec(v);
  if(m){const mi=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi>=0){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(mi+1).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}}
  const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10);}
const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v??'').replace(/[,\s฿]/g,''));return isNaN(n)?0:n;};
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:0});

/* ---- สถานะวันหมดอายุ (จำนวนวันแจ้งเตือนมาจากตั้งค่าของ Genpo) ---- */
function expiryStatus(dateIso,notice=60,en=false){
  const days=daysUntil(dateIso);
  if(days===null)return{cl:'none',label:en?'No data':'ไม่มีข้อมูล',days:null};
  if(days<0)return{cl:'alert',label:en?`Overdue ${-days} day(s)`:`เลยกำหนด ${-days} วัน`,days};
  if(days<=notice)return{cl:'wait',label:en?`${days} day(s) left`:`เหลือ ${days} วัน`,days};
  return{cl:'ok',label:en?`${days} days left`:`ปกติ (เหลือ ${days} วัน)`,days};}

/* ---- กราฟวงกลม / แท่ง (SVG ล้วน) ---- */
const C_OK='#2E9E4F', C_WAIT='#F29B1D', C_ALERT='#E5483B', C_NONE='#B4B6BB', C_PROG='#2F6FD6', C_RED='#CC0000';
function donut(segs,{size=150,stroke=26,centerNum,centerLabel='Items'}={}){
  const r=(size-stroke)/2,cx=size/2,cy=size/2,C=2*Math.PI*r;
  const active=segs.filter(s=>s.value>0),total=active.reduce((a,s)=>a+s.value,0);
  if(!total)return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="No data"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EDEDEF" stroke-width="${stroke}"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="12" fill="${C_NONE}">No data yet</text></svg>`;
  let off=0,arcs='';
  for(const s of active){const len=s.value/total*C;
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${s.color}" stroke-width="${stroke}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(s.label)}: ${s.value}</title></circle>`;off+=len;}
  const n=centerNum!==undefined?centerNum:total;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img">${arcs}
    <text x="${cx}" y="${cy-6}" text-anchor="middle" dominant-baseline="central" font-size="${String(n).length>5?19:String(n).length>3?23:28}" font-weight="700" fill="#1A1A1A">${esc(String(n))}</text>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="11" fill="#666A70">${esc(centerLabel)}</text></svg>`;}
function legend(segs,fmt){const total=segs.reduce((a,s)=>a+s.value,0)||1;
  return `<div class="dl">${segs.map(s=>`<div class="dl-row"><span class="dl-dot" style="background:${s.color}"></span><span class="dl-lb">${esc(s.label)}</span><b class="dl-vl">${fmt?fmt(s.value):s.value}</b><span class="dl-pc">${Math.round(s.value/total*100)}%</span></div>`).join('')}</div>`;}
function chartCard(title,sub,segs,opt={}){
  return `<div class="dcard"><div class="dcard-h"><h3>${esc(title)}</h3>${sub?`<span class="dcard-s">${esc(sub)}</span>`:''}</div>
    <div class="dcard-b"><div class="dchart">${donut(segs,opt)}</div>${legend(segs,opt.fmt)}</div></div>`;}
/* แท่งแนวนอน: rows=[{label,value,color,text}] */
function hbars(rows,{pct=true}={}){const total=rows.reduce((a,r)=>a+r.value,0),max=Math.max(1,...rows.map(r=>r.value));
  if(!total)return '<div class="note">ยังไม่มีข้อมูล</div>';
  return rows.map(r=>`<div class="hbar" title="${esc(r.label)}: ${r.text??r.value}"><span><span class="dotco ${r.cls||''}" style="${r.cls?'':'background:'+r.color}"></span>${esc(r.label)}</span><div class="trk"><div class="fil" style="width:${(r.value/(pct?total:max)*100).toFixed(1)}%;background:${r.color}"></div></div><span class="pc">${pct?Math.round(r.value/total*100)+'%':(r.text??r.value)}</span></div>`).join('');}

/* ---- Excel export (SheetJS; ถ้าโหลดไลบรารีไม่ได้จะเป็น CSV) ---- */
function xlsxExport(filename,headers,rows){
  if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data');XLSX.writeFile(wb,filename);}
  else{const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
    const blob=new Blob(['\uFEFF'+headers.map(q).join(',')+'\n'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename.replace(/\.xlsx$/,'.csv');a.click();URL.revokeObjectURL(a.href);}
  toast('ส่งออกแล้ว');}

/* ---- API ---- */
async function api(method,ep,body){
  const r=await fetch(state.apiBase.replace(/\/+$/,'')+'/'+ep,{method,
    headers:{'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})},
    body:body?JSON.stringify(body):undefined});
  if(r.status===401){App.logout('เซสชันหมดอายุ — เข้าสู่ระบบใหม่');throw new Error('unauthorized')}
  if(r.status===409)throw new Error('conflict');
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;}
/* โหลดไฟล์ทีละไฟล์ — ถ้า Worker ยังไม่รองรับไฟล์นั้น (เช่น Genpo ใหม่) จะไม่ทำให้ทั้งแอปล่ม */
async function getFile(name){try{return await api('GET','api/data?file='+encodeURIComponent(name));}
  catch(e){if(e.message==='unauthorized')throw e;state.missing.add(name);return{json:null,sha:null};}}

/* ---- เอกสาร PDF ของหลักสูตร ---- */
function pickPdf(multiple){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='application/pdf';i.multiple=!!multiple;i.onchange=()=>res([...i.files]);i.click();});}
async function uploadPdf(g,file,fn){if(file.size>20*1024*1024)throw new Error('ไฟล์ใหญ่เกิน 20MB');
  const by=new Uint8Array(await file.arrayBuffer());let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));
  await api('POST','api/upload',{file:'training-'+g,path:'docs/'+g+'/'+fn,base64:btoa(bin)});}
async function downloadDoc(g,fn){toast('กำลังดาวน์โหลด…');try{const r=await api('GET','api/file?path='+encodeURIComponent('docs/'+g+'/'+fn));
  const bin=atob(r.base64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=fn;a.click();URL.revokeObjectURL(url);
}catch(e){toast('ดาวน์โหลดไม่สำเร็จ');}}
const DOC_LABEL={invoice:'Invoice',app:'ใบสมัคร',detail:'รายละเอียดหลักสูตร',payproof:'หลักฐานการชำระเงิน',receipt:'ใบเสร็จรับเงิน',cert:'Certificate'};
const safeName=s=>s.replace(/[\\/:*?"<>|#%\s]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
async function uploadCourseDoc(g,c,k){const files=await pickPdf(k==='cert');if(!files.length)return false;toast('กำลังอัปโหลด…');
  for(const f of files){const base=safeName(f.name.replace(/\.pdf$/i,''));
    const fn=k==='cert'?`${c.code}_Certificate_${base}.pdf`:`${c.code}_${DOC_LABEL[k]}.pdf`;
    await uploadPdf(g,f,fn);
    c.docs=c.docs||{};if(k==='cert'){c.docs.cert=c.docs.cert||[];if(!c.docs.cert.includes(fn))c.docs.cert.push(fn);}else c.docs[k]=fn;}
  c.docBy=c.docBy||{};c.docBy[k]=state.profile.username+' '+todayDMY();return true;}

/* ---- ค่าใช้จ่ายหลักสูตร (Invoice / VAT / WHT) ---- */
function invCalc(c){const price=+c.price||0,n=c.count||1,sub=price*n,vat=c.vatOn!==false?sub*0.07:0,wht=sub*(+c.whtPct||0)/100;return{price,n,sub,vat,wht,net:sub+vat-wht};}
/* รอบทำจ่าย → วันตัดรอบ (มาจากตั้งค่าของ Genpo) */
function nextCutoff(day){const now=new Date();now.setHours(0,0,0,0);let d=new Date(now.getFullYear(),now.getMonth(),day);if(d<now)d=new Date(now.getFullYear(),now.getMonth()+1,day);return d;}
const daysToD=d=>Math.round((d-new Date().setHours(0,0,0,0))/864e5);
const fmtDM=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
function payMissing(c){const m=[];if((c.pr||'none')==='wait')m.push('PR');if(!(c.docs&&c.docs.invoice))m.push('Invoice');return m;}
function cutoffInfo(c,g){if(c.steps&&c.steps.payment)return null;const miss=payMissing(c);if(!miss.length)return null;const s=cfg(g||c.co);
  let day=null;if((c.payRound||'').includes('กลางเดือน'))day=s.payMid;else if((c.payRound||'').includes('ปลายเดือน'))day=s.payEnd;
  const target=day?nextCutoff(day):(daysToD(nextCutoff(s.payMid))<=daysToD(nextCutoff(s.payEnd))?nextCutoff(s.payMid):nextCutoff(s.payEnd));
  return{target,days:daysToD(target),miss,fixed:!!day};}
const peopleArr=c=>Array.isArray(c.people)?c.people:(typeof c.people==='string'?c.people.split('\n').map(s=>s.trim()).filter(Boolean):[]);
const courseRange=c=>!c.end||c.start===c.end?fmtDMY(c.start):(fmtDMY(c.start)+' – '+fmtDMY(c.end));

/* ---- ที่พัก: จัดกลุ่มสัญญาต่ออายุ/ย้ายห้อง (No. 1, 1.1, 1.2 = คนเดียวกัน) ---- */
const housingKey=c=>String(c.no||'').split('.')[0].trim()+'|'+(c.name||'').trim().toLowerCase();
function housingLatest(list){const best={};
  for(const c of list){const k=housingKey(c);const b=best[k];if(!b||(c.start||'')>(b.start||'')||((c.start||'')===(b.start||'')&&String(c.no)>String(b.no)))best[k]=c;}
  return new Set(Object.values(best));}
const housingLabel=c=>c.name||('Expat No. '+String(c.no||'').split('.')[0]);

/* =====================================================================
   2) LOGIN / REGISTER   +   3) APP SHELL   +   4) DATA LAYER (ซิงค์อัตโนมัติ)
   ===================================================================== */
const App=(()=>{
  let A={type:null,genpo:null,role:null,mode:'login'};
  const tip=t=>t?` data-tip="${esc(t)}"`:'';
  const shell=inner=>`<div class="authcard"><img class="authlogo" src="${LOGO}" alt="Honda"><h1>People Center Hub</h1>${inner}</div>`;
  function renderAuth(msg,ok){
    const el=$('auth');
    if(!state.apiBase){el.innerHTML=configScreen();return;}
    const err=msg?`<div class="${ok?'authok':'autherr'}">${esc(msg)}</div>`:'';
    if(A.mode==='register'){el.innerHTML=registerScreen(err);regTypeChange();return;}
    if(!A.type)el.innerHTML=typeScreen(err);
    else if(A.type==='Other'&&!A.genpo)el.innerHTML=genpoScreen(err);
    else if(!A.role)el.innerHTML=roleScreen(err);
    else{el.innerHTML=loginScreen(err);const u=$('lUser');if(u)u.focus();}
  }
  function crumbs(){const p=[A.type,A.genpo?CO[A.genpo]:null,A.role].filter(Boolean);return p.length?`<div class="crumbs">${p.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:'';}
  const backLink=`<span class="authlink" onclick="App.back()">← ย้อนกลับ</span>`;
  function configScreen(){return shell(`<div class="frow"><label${tip('ตั้งครั้งเดียวต่อเครื่อง — token ของ GitHub เก็บที่ Worker ไม่ได้อยู่ในเครื่องนี้')}>Worker API URL ⓘ</label>
    <input id="cfgUrl" placeholder="https://xxx.workers.dev" value="${esc(state.apiBase)}"></div>
    <button class="btn btn-red" style="width:100%;justify-content:center" onclick="App.saveApi()">บันทึก</button>`);}
  function typeScreen(err){return shell(`${err}
    <div class="pick">${DEPT_LIST.map((t,i)=>`<button class="pickbtn"${tip(DEPTS[t].tip)} onclick="App.pickType(${i})">${esc(t)}</button>`).join('')}</div>
    <div class="authfoot"><span></span><span class="authlink" onclick="App.gotoRegister()">ลงทะเบียนผู้ใช้ใหม่</span></div>`);}
  function genpoScreen(err){return shell(`${err}${crumbs()}
    <div class="gpick">${GENPOS.map(g=>`<button class="gbtn" onclick="App.pickGenpo('${g}')"><span class="dotco ${g}"></span>${CO[g]}</button>`).join('')}</div>
    <div class="authfoot">${backLink}</div>`);}
  function roleScreen(err){const roles=DEPTS[A.type].roles;
    return shell(`${err}${crumbs()}
      <div class="pick">${roles.map((r,i)=>`<button class="pickbtn"${tip(ROLE_TIP[r])} onclick="App.pickRole(${i})">${esc(r)}</button>`).join('')}</div>
      <div class="authfoot">${backLink}</div>`);}
  function loginScreen(err){return shell(`${err}${crumbs()}
    <div class="frow"><label>ชื่อผู้ใช้</label><input id="lUser" autocomplete="username"></div>
    <div class="frow"><label>รหัสผ่าน</label><input id="lPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')App.login()"></div>
    <button class="btn btn-red" style="width:100%;justify-content:center;padding:10px" onclick="App.login()">เข้าสู่ระบบ</button>
    <div class="authfoot">${backLink}</div>`);}
  function registerScreen(err){return shell(`${err}
    <div class="frow"><label>ชื่อผู้ใช้</label><input id="rUser" autocomplete="off"></div>
    <div class="frow"><label${tip('อย่างน้อย 6 ตัวอักษร')}>รหัสผ่าน ⓘ</label><input id="rPass" type="password" autocomplete="new-password"></div>
    <div class="frow"><label>กลุ่มผู้ใช้</label><select id="rType" onchange="App.regTypeChange()">${DEPT_LIST.map((t,i)=>`<option value="${i}">${esc(t)}</option>`).join('')}</select></div>
    <div class="frow hide" id="rGenpoRow"><label>Genpo</label><select id="rGenpo">${GENPOS.map(g=>`<option value="${g}">${CO[g]}</option>`).join('')}</select></div>
    <div class="frow"><label>ตำแหน่ง</label><select id="rRole"></select></div>
    <button class="btn btn-red" style="width:100%;justify-content:center;padding:10px"${tip('ต้องรอ Admin อนุมัติก่อนเข้าใช้งาน')} onclick="App.register()">ส่งคำขอลงทะเบียน</button>
    <div class="authfoot"><span class="authlink" onclick="App.gotoLogin()">← กลับไปเข้าสู่ระบบ</span></div>`);}
  function saveApi(){let u=$('cfgUrl').value.trim();if(!u){toast('กรอก URL');return}if(!/^https?:\/\//i.test(u))u='https://'+u;state.apiBase=u;localStorage.setItem(API_KEY,u);renderAuth();}
  function pickType(i){A.type=DEPT_LIST[i];A.genpo=null;A.role=null;renderAuth();}
  function pickGenpo(g){A.genpo=g;renderAuth();}
  function pickRole(i){A.role=DEPTS[A.type].roles[i];renderAuth();}
  function back(){if(A.role){A.role=null;}else if(A.genpo){A.genpo=null;}else A.type=null;renderAuth();}
  function resetAuth(){A={type:null,genpo:null,role:null,mode:'login'};renderAuth();}
  function gotoRegister(){A.mode='register';renderAuth();}
  function gotoLogin(){A={type:null,genpo:null,role:null,mode:'login'};renderAuth();}
  function regTypeChange(){const t=DEPT_LIST[+$('rType').value];$('rRole').innerHTML=DEPTS[t].roles.map(r=>`<option>${esc(r)}</option>`).join('');$('rGenpoRow').classList.toggle('hide',t!=='Other');}
  async function register(){const t=DEPT_LIST[+$('rType').value];
    const b={username:$('rUser').value.trim(),password:$('rPass').value,type:t,role:$('rRole').value,genpo:t==='Other'?$('rGenpo').value:null};

    try{const res=await api('POST','api/register',b);A={type:null,genpo:null,role:null,mode:'login'};

  async function login(){
    const username=$('lUser').value.trim(),password=$('lPass').value;
    if(!username||!password){toast('กรอกชื่อผู้ใช้และรหัสผ่าน');return}
    try{const res=await api('POST','api/login',{username,password});const p=res.profile;
      if(!p.admin){
        if(deptOf(p).nav!==DEPTS[A.type].nav){renderAuth(`บัญชีนี้อยู่กลุ่ม ${p.type} — กรุณาเลือกกลุ่มให้ตรง`);return;}

        if(A.type==='Other'&&p.role&&p.role!==A.role){renderAuth(`บัญชีนี้เป็นตำแหน่ง ${p.role}`);return;}
      }
      state.token=res.token;state.profile=applyDept(p);localStorage.setItem(TOK_KEY,res.token);localStorage.setItem(PROF_KEY,JSON.stringify(state.profile));
      await enterApp();
    }catch(e){renderAuth(e.message)}}
  function logout(msg){clearInterval(pollT);state.token='';state.profile=null;localStorage.removeItem(TOK_KEY);localStorage.removeItem(PROF_KEY);
    for(const k of ['train','dsd','vwp','resign','housing','safety'])state[k]={};
    state.cal={events:[],skip:[],sha:null};state.vwpcal={events:[],skip:[],sha:null};

  /* ---------- 4) DATA LAYER ----------
     ตอนนี้ยังเก็บผ่าน Worker → GitHub (ย้ายไป Server ภายในบริษัทภายหลังได้ โดยแก้แค่ api()/getFile())
     ไฟล์: training-<G>, dsd-<G>, calendar, vwp-<G>, resign-<G>, housing-<G>, calendar-vwp, safety-<G>, settings */
  const FILES={train:['training-','courses'],dsd:['dsd-','runs'],vwp:['vwp-','people'],resign:['resign-','items'],housing:['housing-','contracts'],safety:['safety-','records']};
  async function loadKind(kind,gs){const[pre,key]=FILES[kind];
    await Promise.all(gs.map(async g=>{const r=await getFile(pre+g);state[kind][g]={[key]:(r.json&&r.json[key])||[],skip:(r.json&&r.json.skip)||[],sha:r.sha};}));}
  async function loadCal(which){const r=await getFile(which==='cal'?'calendar':'calendar-vwp');state[which]={events:(r.json&&r.json.events)||[],skip:(r.json&&r.json.skip)||[],sha:r.sha};}
  async function loadSettings(){const r=await getFile('settings');state.settings=(r.json&&r.json.genpos)?r.json:{genpos:{}};state.settingsSha=r.sha;}
  function sides(){const p=state.profile;if(p.admin)return{tr:true,vwp:true,oth:true};return{tr:p.deptNav==='TR',vwp:p.deptNav==='VWP',oth:p.deptNav==='OTH'};}
  async function loadData(silent){
    if(!silent)sync('กำลังโหลด…');
    const next={train:{},dsd:{},vwp:{},resign:{},housing:{},safety:{}};Object.assign(state,next);state.missing=new Set();
    const p=state.profile,gs=scopeGenpos(),s=sides(),jobs=[loadSettings()];
    if(s.tr)jobs.push(loadKind('train',gs),loadKind('dsd',gs),loadCal('cal'));

    sync((state.missing.size?`⚠ ยังโหลดไม่ได้ ${state.missing.size} ไฟล์ (ตรวจสิทธิ์ไฟล์บน Worker) · `:'')+'ซิงค์ล่าสุด '+nowStamp());
  }
  async function reloadKind(kind,g){await loadKind(kind,[g]);}
  async function saveKind(kind,g,msg){const s=state[kind][g];const[pre,key]=FILES[kind];

    catch(e){if(e.message==='conflict'){toast('มีคนบันทึกก่อน — โหลดข้อมูลล่าสุดแล้ว กรุณาทำซ้ำ');await reloadKind(kind,g);render();}else toast('บันทึกไม่สำเร็จ: '+e.message);throw e;}}
  async function saveCalendar(which,msg){const c=state[which];const name=which==='cal'?'calendar':'calendar-vwp';

  async function saveSettings(msg){
    try{const r=await api('PUT','api/data?file=settings',{content:state.settings,sha:state.settingsSha,msg});state.settingsSha=r.sha;sync('บันทึกแล้ว '+nowStamp());}
    catch(e){if(e.message==='conflict'){toast('มีคนแก้ตั้งค่าก่อน — โหลดใหม่แล้ว กรุณาทำซ้ำ');await loadSettings();render();}else toast('บันทึกไม่สำเร็จ: '+e.message);throw e;}}
  const saveTrain=(g,m)=>saveKind('train',g,m), saveDsd=(g,m)=>saveKind('dsd',g,m);
  const saveCal=m=>saveCalendar('cal',m), saveVwpCal=m=>saveCalendar('vwpcal',m);

  const flat=(kind,key)=>{const o=[];for(const g of Object.keys(state[kind]))for(const x of(state[kind][g][key]||[]))o.push({x,g});return o;};

  const courseByCode=(code,g)=>(state.train[g]?state.train[g].courses:[]).find(c=>c.code===code);

  function creators(){const s=new Set();allCourses().forEach(({c})=>c.by&&s.add(c.by));(state.cal.events||[]).forEach(e=>e.by&&s.add(e.by));return[...s].sort();}
  const loaded=name=>!state.missing.has(name);
  const runFromCourse=(c,g)=>({id_:Date.now().toString(36)+Math.random().toString(36).slice(2,6),code:c.code,co:g,course:c.name,date:c.start||'',dateEnd:c.end||'',dateText:'',
    ppl:c.count||null,id:'',req:'none',reqDate:'',report:false,dept:false,receipt:false,cert:false,remark:'',people:[],by:c.by||state.profile.username,source:'training',isNew:true,createdAt:todayDMY()});
  const evFromCourse=c=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),code:c.code,src:'training',title:c.name,co:c.co,status:'confirmed',
    date:c.start,end:c.end&&c.end!==c.start?c.end:'',time:'',note:'จาก Training Tracker',by:c.by,history:['สร้างอัตโนมัติจาก Training '+todayDMY()]});

  /* ซิงค์อัตโนมัติ: Training → DSD (ขึ้นสถานะ NEW) → Calendar และ Visa/Housing/Outboarding → Calendar ฝั่ง VWP
     ไม่ต้องกดซิงค์เอง — ทำทุกครั้งที่โหลด/บันทึก และทุก 90 วินาที */
  async function autoLink(){const s=sides();
    if(s.tr&&state.cal){const dirty=new Set();let calDirty=false;
      for(const {c,g} of allCourses()){if(!c.code)continue;const D=state.dsd[g];
        if(D&&loaded('dsd-'+g)&&!D.runs.some(r=>r.code===c.code)&&!(D.skip||[]).includes(c.code)){D.runs.push(runFromCourse(c,g));dirty.add(g);}
        if(c.start&&loaded('calendar')&&!(state.cal.skip||[]).includes(c.code)&&!state.cal.events.some(e=>e.code===c.code)){state.cal.events.push(evFromCourse(c));calDirty=true;}}
      for(const g of dirty){try{await saveDsd(g,'auto-link from training');}catch(e){}}
      if(calDirty){try{await saveCal('auto-link from training');}catch(e){}}}
    if(s.vwp&&loaded('calendar-vwp')){const ev=state.vwpcal.events,skip=state.vwpcal.skip||[];let dirty=false;
      const up=(kind,refId,date,title,co,by)=>{const key=refId+':'+kind;if(skip.includes(key))return;let e=ev.find(x=>x.refId===refId&&x.kind===kind);
        if(!date){return;}
        if(e){if(e.date!==date||e.title!==title){e.date=date;e.title=title;dirty=true;}return;}
        ev.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind,refId,title,co,date,note:'',by,history:['สร้างอัตโนมัติ '+todayDMY()]});dirty=true;};
      allVwp().forEach(({p,g})=>{up('visa',p.id,p.visaExpiry,'Visa/WP expiry: '+p.name,g,p.by);});
      allResignItems().forEach(({it,g})=>up(it.kind,it.id,it.date,(it.kind==='retirement'?'Retirement: ':'Resignation: ')+it.name,g,it.by));
      for(const g of Object.keys(state.housing)){const L=state.housing[g].contracts||[];const latest=housingLatest(L);
        L.forEach(h=>{if(latest.has(h))up('housing',h.id,h.expire,'Housing contract ends: '+housingLabel(h),g,h.by);});}
      /* สัญญาเก่าที่ต่ออายุ/ย้ายแล้ว ไม่ต้องเตือนในปฏิทิน */
      const hAll=new Set(),hLatest=new Set();for(const g of Object.keys(state.housing)){const L=state.housing[g].contracts||[];const lt=housingLatest(L);L.forEach(h=>{hAll.add(h.id);if(lt.has(h))hLatest.add(h.id);});}
      const before=ev.length;state.vwpcal.events=ev.filter(e=>!(e.kind==='housing'&&hAll.has(e.refId)&&!hLatest.has(e.refId)));if(state.vwpcal.events.length!==before)dirty=true;

  }
  /* แก้หลักสูตรใน Training → อัปเดตรุ่นใน DSD และกิจกรรมในปฏิทินให้ตรงกันทันที */
  async function propagateCourse(c,g){if(!state.dsd[g])return;
    const r=dsdByCode(c.code,g);if(r&&r.source==='training'){let ch=false;
      if(r.course!==c.name){r.course=c.name;ch=true;}if((r.date||'')!==(c.start||'')){r.date=c.start||'';ch=true;}
      if((r.dateEnd||'')!==(c.end||'')){r.dateEnd=c.end||'';ch=true;}if(ch){try{await saveDsd(g,'sync from training '+c.code);}catch(e){}}}
    const e=(state.cal.events||[]).find(x=>x.code===c.code);if(e){const end=c.end&&c.end!==c.start?c.end:'';
      if(e.title!==c.name||e.date!==c.start||(e.end||'')!==end){e.title=c.name;e.date=c.start;e.end=end;(e.history=e.history||[]).push('อัปเดตตาม Training '+todayDMY());try{await saveCal('sync from training '+c.code);}catch(err){}}}

  async function syncDsdToTraining(run,g){const c=courseByCode(run.code,g);if(!c)return;

  /* ---------- 3) NAV ---------- */
  const WS={TR:[['dashboard','Dashboard'],['training','Training'],['dsd','DSD'],['calendar','Calendar']],

  const WS_TXT={TR:'Training',VWP:'Visa & WP',OTH:'Other',ADM:'Admin'};
  function VIEWS(){const p=state.profile;
    if(p.admin)return WS[state.ws]||WS.TR;
    if(p.deptNav==='TR')return WS.TR;if(p.deptNav==='VWP')return WS.VWP;
    if(roleIs('Purchasing'))return[['purchasing','Vendor Tracker']];

    return[['accounting','Accounting']];}
  function badge(v){
    if(v==='dsd'){let n=0;for(const g in state.dsd)n+=(state.dsd[g].runs||[]).filter(r=>r.isNew).length;return n;}
    if(v==='accounting')return allCourses().filter(({c})=>c.vendorNotify&&!c.vendorAck).length;

  function renderNav(){const p=state.profile;
    $('nav').innerHTML=VIEWS().map(([k,t])=>{const b=badge(k);return`<button class="${state.view===k?'on':''}" onclick="App.go('${k}')">${t}${b?`<span class="badge">${b}</span>`:''}</button>`;}).join('');
    $('wsBox').innerHTML=p.admin?`<select class="wssel" onchange="App.setWs(this.value)" title="เลือกพื้นที่ทำงาน">${Object.keys(WS).map(k=>`<option value="${k}" ${state.ws===k?'selected':''}>${WS_TXT[k]}</option>`).join('')}</select>`:'';
    $('whoami').innerHTML=`<b>${esc(p.username)}</b><br>${esc(p.role||'')}${p.allAccess?'':` · <span class="co ${esc(p.genpo)}">${esc(CO[p.genpo]||p.genpo)}</span>`}`;

  function renderNavBadges(){if(!state.profile)return;document.querySelectorAll('#nav button').forEach((b,i)=>{const v=VIEWS()[i];if(!v)return;const n=badge(v[0]);let s=b.querySelector('.badge');
    if(n){if(!s){s=document.createElement('span');s.className='badge';b.appendChild(s);}s.textContent=n;}else if(s)s.remove();});}
  let pollT=null;
  function startPoll(){clearInterval(pollT);pollT=setInterval(async()=>{
    if(document.hidden||!state.profile)return;if(document.querySelector('.modal.open')||$('drawer').classList.contains('open'))return;

  return {boot,renderAuth,saveApi,pickType,pickGenpo,pickRole,back,resetAuth,gotoRegister,gotoLogin,regTypeChange,register,login,logout,
    go,setWs,render,renderNav,loadData,saveKind,saveTrain,saveDsd,saveCal,saveVwpCal,saveCalendar,saveSettings,loadSettings,

})();
/* =====================================================================
   6) TRAINING TRACKER — ตาราง 1 แถว/หลักสูตร คลิกแถว → drawer ขวา
   ===================================================================== */
const Training=(()=>{
  const VTXT={none:'ไม่ต้องเปิด / มีแล้ว',wait_docs:'รอเอกสารจาก Vendor',review:'พิจารณาเอกสาร',ok:'เสร็จสิ้น'};

  /* ขั้นตอนอนุมัติ 7 ขั้น (key เดิม เพื่อให้ข้อมูลเก่ายังใช้ได้) */
  const STEPS=[{k:'vendor',nm:'Vendor Registration',who:'Purchasing'},{k:'register',nm:'Course Registration',who:'Training'},
    {k:'hbi',nm:'Approval System',who:'Training'},{k:'pr',nm:'PR',who:'Training'},

  const DOCS=[{k:'invoice',nm:'Invoice'},{k:'app',nm:'ใบสมัคร'},{k:'detail',nm:'รายละเอียดหลักสูตร (DSD)'},{k:'payproof',nm:'หลักฐานการชำระเงิน'},{k:'receipt',nm:'ใบเสร็จรับเงิน'}];
  /* ประเภทหลักสูตร: Coaching / Certificate มีเฉพาะ HRS-T */
  function catsFor(g,cur){const a=['Public','Inhouse – Center','Inhouse – Function Support'];if(g==='HRST')a.push('Coaching','Certificate');if(cur&&!a.includes(cur))a.push(cur);return a;}
  let cofil='ALL', currentG=null, currentId=null, lang='th', q='';

  const vendorDone=c=>c.vendor==='none'||c.vendor==='ok';

  function findCourse(id){for(const g of Object.keys(state.train)){const c=(state.train[g].courses||[]).find(x=>x.id===id);if(c)return{c,g};}return null;}

  function prevDone(c,k){const o=STEPS.map(s=>s.k),i=o.indexOf(k);if(i===0)return true;const p=o[i-1];if(p==='vendor')return vendorDone(c);if(p==='pr')return prDone(c);return !!c.steps[p];}

  function renderChips(boxId,inpId,cntId,arr,rm,click,onkey){const box=$(boxId);if(!box)return;const was=$(inpId),keep=(was||{}).value||'',had=!!was&&document.activeElement===was;

    const c=$(cntId);if(c)c.textContent=arr.length;const i=$(inpId);if(i&&(had||boxId==='aPeopleBox'&&arr.length))i.focus();}
  const renderAddPeople=()=>renderChips('aPeopleBox','aPeopleInput','aPeopleCount',addPeople,'Training.removeAddPerson',false,'Training.addPersonKey');

  function chipView(el){openPersonSearch(el.closest('.chip').dataset.name);}
  function allNames(){const s=new Set();App.allCourses().forEach(({c})=>peopleArr(c).forEach(p=>s.add(p)));return[...s].sort((a,b)=>a.localeCompare(b,'th'));}
  function openPersonSearch(prefill){
    openModal(`<h2>ประวัติการอบรมรายบุคคล</h2>
      <div class="frow"><label>ชื่อพนักงาน</label><input id="prName" list="prList" value="${esc(prefill||'')}" oninput="Training.prSearch()" placeholder="พิมพ์หรือเลือกชื่อ"></div>
      <datalist id="prList">${allNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div id="prResult"></div>
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button></div>`);if(prefill)prSearch();}
  function prSearch(){const nm=(($('prName')||{}).value||'').trim(),el=$('prResult');if(!el)return;if(!nm){el.innerHTML='';return;}

  function render(el){
    let rows=scoped();

    const mode=localStorage.getItem('t_sort')||'date';
    if(mode==='risk')rows.sort((a,b)=>riskScore(b.c,b.g)-riskScore(a.c,a.g)||(a.c.start||'').localeCompare(b.c.start||''));
    else if(mode==='no')rows.sort((a,b)=>(a.c.no||0)-(b.c.no||0));
    else rows.sort((a,b)=>(a.c.start||'').localeCompare(b.c.start||''));
    el.innerHTML=`
      <div class="toolbar">
        <button class="btn btn-red" onclick="Training.openAdd()">+ เพิ่มหลักสูตร</button>
        <select onchange="Training.setCo(this.value)">${genpoOptions(cofil,{all:true})}</select>
        <input type="search" id="tq" placeholder="ค้นหา หลักสูตร / Code / ชื่อผู้เรียน" value="${esc(q)}" style="width:240px" oninput="Training.search(this.value)">
        <select onchange="localStorage.setItem('t_sort',this.value);App.render()">
          <option value="date" ${mode==='date'?'selected':''}>เรียง: วันอบรม</option><option value="risk" ${mode==='risk'?'selected':''}>เรียง: ความเสี่ยงสูง→ต่ำ</option><option value="no" ${mode==='no'?'selected':''}>เรียง: ลำดับ</option></select>
        <span style="flex:1"></span>
        <button class="btn btn-ghost" onclick="Training.openPersonSearch()">ประวัติรายบุคคล</button>
        <button class="btn btn-ghost" onclick="Training.exportExcel()">Export Excel</button>
        <button class="btn btn-ghost" onclick="Import.open('training')">Import Excel</button>
      </div>
      ${(lateN||cutN)?`<div class="tiles"><span class="tile alert"><b>${lateN}</b><span>รายการเสี่ยง</span></span><span class="tile wait"><b>${cutN}</b><span>ใกล้ cut off ทำจ่าย</span></span></div>`:''}
      <div class="tblwrap"><table><thead><tr><th>Code</th><th>หลักสูตร / สถาบัน</th><th>วันอบรม</th><th>คน</th><th>ขั้นตอน</th><th>สถานะล่าสุด</th></tr></thead><tbody id="tRows"></tbody></table></div>`;
    const tb=el.querySelector('#tRows');
    if(!rows.length){tb.innerHTML=`<tr><td colspan="6" class="empty">ยังไม่มีหลักสูตร — กด "+ เพิ่มหลักสูตร" เพื่อเริ่ม</td></tr>`;return;}
    tb.innerHTML=rows.map(({c,g})=>{const st=lastStatus(c),late=isLate(c,g),co=cutoffInfo(c,g);
      const coChip=co&&co.days<=7?`<br><span class="chip ${co.days<=3?'alert':'wait'}" style="margin-top:3px">cut off ${fmtDM(co.target)} · ขาด ${co.miss.join(' + ')}</span>`:'';
      const dots=STEPS.map(s=>{let cl;if(s.k==='vendor')cl=vendorDone(c)?'ok':'wait';else if(s.k==='pr')cl=prDone(c)?'ok':'wait';else cl=c.steps[s.k]?'ok':(prevDone(c,s.k)?'wait':'');return`<span class="dot ${cl}" title="${s.nm}"></span>`;}).join('');
      const pn=peopleArr(c).length;
      return`<tr class="clk ${late?'late':''}" onclick="Training.openDrawer('${g}','${c.id}')">
        <td><span class="co ${g}">${CO[g]}</span><br><span class="code">${esc(c.code||'')}</span></td>
        <td class="cname">${esc(c.name)} <span class="chip" style="font-size:10.5px">${esc(c.cat||'')}</span><br><span style="font-size:var(--fs-xs);color:var(--sub)">${esc(c.vendorName||'')}</span>${c.by?`<br><span class="by">เพิ่มโดย ${esc(c.by)}</span>`:''}</td>
        <td class="cdate">${courseRange(c)}</td><td>${c.count||''}${pn?`<br><span style="font-size:var(--fs-xs);color:var(--sub)">${pn} รายชื่อ</span>`:''}</td>
        <td><div class="dots">${dots}</div></td>

  async function addCourse(){const g=$('aCo').value,name=$('aName').value.trim();if(!name){toast('กรอกชื่อหลักสูตร');return;}

      createdAt:todayDMY(),steps:{},stepTs:{},stepBy:{},stepRemark:{},docs:{},docBy:{}};
    s.courses.push(c);

    const stepRows=STEPS.map(s=>{
      if(s.k==='vendor')return`<div class="step"><span class="who">${s.who}</span><span class="nm">${s.nm}${c.vendorReadyAt?` <span class="ts">(เสร็จ ${esc(c.vendorReadyAt)})</span>`:''}</span><select onchange="Training.setVendor(this.value)">${Object.entries(VTXT).map(([v,t])=>`<option value="${v}" ${c.vendor===v?'selected':''}>${t}</option>`).join('')}</select></div>`+remark('vendor');
      if(s.k==='pr')return`<div class="step"><span class="who">${s.who}</span><span class="nm">${s.nm} <span class="ts">(เฉพาะกรุ๊ป/พนง.ญี่ปุ่น)</span></span><select onchange="Training.setPr(this.value)">${Object.entries(PRTXT).map(([v,t])=>`<option value="${v}" ${(c.pr||'none')===v?'selected':''}>${t}</option>`).join('')}</select></div>`+remark('pr');
      const done=!!c.steps[s.k],by=(c.stepBy||{})[s.k];
      const extra=s.k==='email'?`<button class="mini" onclick="Training.openEmail()">สร้างอีเมล</button>`:'';
      const ts=done&&c.stepTs[s.k]?`<span class="ts">${esc(c.stepTs[s.k])}${by?' · '+esc(by):''}</span>`:'';
      const hint=s.k==='dsd'?` <span class="ts">(${linked?'DSD: '+esc({none:'ยังไม่ยื่น',sent:'ยื่นแล้ว',ok:'รับรองแล้ว'}[linked.req||'none']):'ยังไม่ผูก DSD'})</span>`:'';
      let row=`<div class="step"><span class="who">${s.who}</span><span class="nm">${s.nm}${hint}</span>${extra}${ts}<input type="checkbox" class="ck" aria-label="${s.nm}" ${done?'checked':''} onchange="Training.setStep('${s.k}',this.checked)"></div>`;
      if(s.k==='payment')row+=`<div class="step sub"><select style="max-width:260px" onchange="Training.editField('payRound',this.value)">${PAYROUNDS.map(r=>`<option value="${r}" ${c.payRound===r?'selected':''}>${r||'— เลือกรอบทำจ่าย —'}</option>`).join('')}</select></div>`;
      return row+remark(s.k);}).join('');
    const docRows=DOCS.map(dc=>{const f=(c.docs||{})[dc.k],db=(c.docBy||{})[dc.k];
      return`<div class="docrow"><span class="nm">${dc.nm}<br><span class="fn ${f?'':'miss'}">${f?esc(f):'ยังไม่มีไฟล์'}</span>${db?`<br><span class="ts">โดย ${esc(db)}</span>`:''}</span>${f?`<button class="mini" onclick="downloadDoc('${g}','${esc(f)}')">ดาวน์โหลด</button>`:''}<button class="mini" onclick="Training.upDoc('${dc.k}')">${f?'แทนที่':'อัปโหลด PDF'}</button></div>`;}).join('');
    const certs=(c.docs||{}).cert||[];
    const certRow=`<div class="docrow"><span class="nm">Certificate <span class="ts">(${certs.length} ไฟล์)</span>${certs.length?certs.map(fn=>`<div class="fileitem"><span class="fn" style="flex:1">${esc(fn)}</span><button class="mini" onclick="downloadDoc('${g}','${esc(fn)}')">โหลด</button><button class="mini danger" onclick="Training.delCert('${esc(fn)}')">ลบ</button></div>`).join(''):'<br><span class="fn miss">ยังไม่มีไฟล์</span>'}</span><button class="mini" onclick="Training.upDoc('cert')">+ อัปโหลด</button></div>`;
    openDrawer(`
      <div class="dhead"><h2><span class="co ${g}">${CO[g]}</span> <span class="code">${esc(c.code||'')}</span> ${esc(c.name)}</h2><button class="btn btn-ghost" onclick="closeDrawer()" aria-label="ปิด">✕</button></div>
      <div class="dbody">
        <div class="sect"><h3>ข้อมูลหลักสูตร</h3>
          <div class="frow"><label>ชื่อหลักสูตร</label><input value="${esc(c.name)}" onchange="Training.editField('name',this.value.trim())"></div>
          <div class="grid2">
          <div class="frow"><label>Training Code</label><input value="${esc(c.code||'')}" onchange="Training.editField('code',this.value.trim())"></div>
          <div class="frow"><label>สถาบัน / Vendor</label><input value="${esc(c.vendorName||'')}" onchange="Training.editField('vendorName',this.value)"></div>
          <div class="frow"><label>ประเภท</label><select onchange="Training.editField('cat',this.value)">${catsFor(g,c.cat).map(x=>`<option ${c.cat===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
          <div class="frow"><label>จำนวนที่นั่ง</label><input type="number" value="${c.count||1}" onchange="Training.editField('count',+this.value)"></div>
          <div class="frow"><label>วันที่เริ่ม</label>${dateInput(c.start,"Training.editDate('start',this.value)")}</div>
          <div class="frow"><label>วันที่สิ้นสุด</label>${dateInput(c.end,"Training.editDate('end',this.value)")}</div></div>
          <div class="frow"><label>ผู้เข้าอบรม (<span id="cPeopleCount">0</span> คน)</label><div class="chipbox" id="cPeopleBox"></div>
            <div class="chiphint">คลิกชื่อเพื่อดูประวัติการอบรมของคนนั้น</div></div>
          ${c.by?`<p class="by">เพิ่มโดย ${esc(c.by)}${c.createdAt?' · '+esc(c.createdAt):''}</p>`:''}</div>
        <div class="sect"><h3>ขั้นตอน</h3>${stepRows}</div>
        <div class="sect"><h3>Invoice / ค่าใช้จ่าย</h3><div class="grid2">
          <div class="frow"><label>ราคา/หัว ก่อน VAT</label><input id="ivPrice" type="number" min="0" step="0.01" value="${c.price??''}" oninput="Training.calcInv()" onchange="Training.editField('price',+this.value||0)"></div>

          <div class="frow"><label>หัก ณ ที่จ่าย</label><select id="ivWht" onchange="Training.editField('whtPct',+this.value)"><option value="0" ${!c.whtPct?'selected':''}>ไม่หัก</option><option value="3" ${c.whtPct===3?'selected':''}>3%</option></select></div>
          <div class="frow"><label>ครบกำหนดชำระ</label>${dateInput(c.invoiceDue,"Training.editDate('invoiceDue',this.value)")}</div></div>
          <div id="invSum" class="sumbox"></div></div>
        <div class="sect"><h3>เอกสาร PDF</h3>${docRows}${certRow}</div>
        <div class="sect"><button class="mini danger" onclick="Training.delCourse()">ลบหลักสูตรนี้</button></div>
      </div>`);

  function calcInv(){const c=cur(),el=$('invSum');if(!c||!el)return;
    const tmp={...c,price:+(($('ivPrice')||{}).value)||0,vatOn:(($('ivVat')||{}).value??'1')==='1',whtPct:+(($('ivWht')||{}).value)||0};const v=invCalc(tmp);
    el.innerHTML=v.price?`${money(v.price)} × ${v.n} = <b>${money(v.sub)}</b>${v.vat?` + VAT ${money(v.vat)}`:''}${v.wht?` − หัก ณ ที่จ่าย ${money(v.wht)}`:''} → สุทธิ <b style="color:var(--red)">${money(v.net)}</b> บาท`:'กรอกราคาต่อหัวเพื่อคำนวณ';}
  async function saveCur(msg){try{await App.saveTrain(currentG,msg);App.render();openDetail(currentG,currentId);}catch(e){}}

  /* ---- อีเมลยืนยัน 3 ภาษา: เป็นแพทเทิร์นให้ copy (ไม่มีลายเซ็น) ---- */
  function openEmail(){const c=cur();
    openModal(`<h2>อีเมลยืนยันการอบรม</h2>
      <div class="tabs" id="langTabs"><button class="on" onclick="Training.setLang('th')">ไทย</button><button onclick="Training.setLang('jp')">日本語</button><button onclick="Training.setLang('en')">English</button></div>
      <div class="grid2"><div class="frow"><label>เรียนถึง</label><input id="eTo" value="${esc(c._to||'')}"></div><div class="frow"><label>เวลา</label><input id="eTime" value="09:00 - 16:30"></div></div>
      <div class="frow"><label>ชื่อหลักสูตร</label><input id="eCourse" value="${esc(c.name)}"></div>
      <div class="frow"><label>สถานที่</label><input id="eVenue" value="${esc(c._venue||'')}"></div>
      <div class="frow"><label>ผู้เข้าอบรม</label><input id="ePeople" value="${esc(peopleArr(c).join(', '))}"></div>
      <div class="frow"><label>Remark</label><textarea id="eRemark" rows="2"></textarea></div>
      <div class="frow"><label>ข้อความ</label><textarea id="emailOut" readonly></textarea></div>
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button><button class="btn btn-red" onclick="Training.copyEmail()">คัดลอกอีเมล</button></div>`);
    setLang('th');['eTo','eTime','eCourse','eVenue','ePeople','eRemark'].forEach(id=>$(id).addEventListener('input',genEmail));}
  function setLang(l){lang=l;document.querySelectorAll('#langTabs button').forEach((b,i)=>b.classList.toggle('on',['th','jp','en'][i]===l));
    $('eRemark').value={th:'หากรับทราบรายละเอียดแล้ว รบกวนตอบกลับอีเมลนี้ด้วยนะคะ',jp:'内容をご確認のうえ、本メールへご返信いただけますようお願いいたします。',en:'Once you have acknowledged the details, please kindly reply to this email.'}[l];genEmail();}
  const jd=s=>{if(!s)return'';const[y,m,d]=s.split('-');return`${y}年${+m}月${+d}日`;};
  function genEmail(){const c=cur()||{};const v=id=>$(id).value.trim();
    const to=v('eTo'),course=v('eCourse'),time=v('eTime'),venue=v('eVenue'),people=v('ePeople'),rm=v('eRemark');
    const dEN=courseRange(c).replace('–','-'),dJP=!c.end||c.start===c.end?jd(c.start):`${jd(c.start)}～${jd(c.end)}`;let t='';

/* =====================================================================
   7) DSD TRACKER — ตาราง 1 แถว/รุ่นอบรม จัดกลุ่มเป็น bucket สถานะ
   วันยื่นล่วงหน้า (LEAD) / วันครบกำหนดรายงาน (REPORT) มาจาก ⚙ ตั้งค่าของแต่ละ Genpo
   ===================================================================== */
const DSD=(()=>{
  const REQ={none:'ยังไม่ยื่นขอรับรอง',sent:'ยื่นแล้ว รอกรมรับรอง',ok:'รับรองหลักสูตรแล้ว'};
  const STEPS=[{k:'report',nm:'ยื่นรายงานการฝึก'},{k:'dept',nm:'กรมพัฒฯ อนุมัติรายงาน'},{k:'receipt',nm:'ใบเสร็จ'},{k:'cert',nm:'หนังสือรับรอง'}];
  let cofil='ALL', bfil='ALL', q='', currentG=null, currentId=null;
  const endD=r=>isISO(r.dateEnd)?r.dateEnd:(isISO(r.date)?r.date:null);
  const isPast=r=>!!endD(r)&&endD(r)<todayISO();
  const fRange=r=>r.dateEnd&&r.dateEnd!==r.date?fmtDMY(r.date)+' – '+fmtDMY(r.dateEnd):fmtDMY(r.date);
  const LEAD=r=>cfg(r.co).dsdLead, REPORT=r=>cfg(r.co).dsdReport;
  const reqDue=r=>addDays(r.date,-LEAD(r)), reportDue=r=>addDays(endD(r),REPORT(r));
  function findRun(id){for(const g in state.dsd){const r=(state.dsd[g].runs||[]).find(x=>x.id_===id);if(r)return{r,g};}return null;}
  function allRuns(){const o=[];for(const g of Object.keys(state.dsd))for(const r of(state.dsd[g].runs||[]))o.push({r,g});return o;}
  const cur=()=>{const f=findRun(currentId);return f?f.r:null;};
  function bucket(r){if((r.req||'none')==='none')return'noreq';if(r.req==='sent')return'waitapv';if(!r.report)return isPast(r)?'noreport':'ready';if(!r.dept)return'waitdept';if(!r.receipt||!r.cert)return'waitdoc';return'done';}
  const BUCKET={noreq:{t:'ยังไม่ยื่นขอรับรอง',cl:'alert'},waitapv:{t:'รอกรมรับรองหลักสูตร',cl:'wait'},ready:{t:'รับรองแล้ว รออบรม',cl:'ok'},noreport:{t:'ค้างยื่นรายงาน',cl:'alert'},waitdept:{t:'รอกรมอนุมัติรายงาน',cl:'wait'},waitdoc:{t:'รอใบเสร็จ/หนังสือรับรอง',cl:'wait'},done:{t:'เสร็จสิ้น',cl:'ok'}};
  function lastStatus(r){const b=bucket(r),o={...BUCKET[b]};
    if(b==='noreq'){const d=daysUntil(reqDue(r));if(d!==null&&d<=0)o.t='เลยกำหนดยื่นขอรับรอง';else if(d!==null&&d<=14)o.t=`ยังไม่ยื่น · เหลือ ${d} วัน`;}
    if(b==='waitapv'&&isPast(r)){o.cl='alert';o.t='อบรมแล้วแต่ยังไม่ได้รับรอง';}
    if(b==='noreport'){const d=daysUntil(reportDue(r));o.t=d!==null&&d<0?`เลยกำหนดยื่นรายงาน ${-d} วัน`:`ค้างยื่นรายงาน · เหลือ ${d} วัน`;}return o;}
  function personStats(runs){const ids=runs.flatMap(r=>(r.people||[]).map(x=>String(x).trim()).filter(Boolean));const c={};ids.forEach(id=>c[id]=(c[id]||0)+1);const u=Object.keys(c).length;return{total:ids.length,unique:u,dup:ids.length-u,dupIds:Object.keys(c).filter(id=>c[id]>1)};}
  const TILES=[['ALL','ทั้งหมด',''],['new','ใหม่จาก Training','info'],['noreq','ยังไม่ยื่นขอรับรอง','alert'],['waitapv','รอกรมรับรอง','wait'],['noreport','ค้างยื่นรายงาน','alert'],['waitdept','รอกรมอนุมัติรายงาน','wait'],['waitdoc','รอปิดเอกสาร','wait'],['ready','รออบรม','ok'],['done','เสร็จสิ้น','ok']];

  function render(el){
    const scope=allRuns().filter(({g})=>cofil==='ALL'||g===cofil);
    const ps=personStats(scope.map(x=>x.r));const cnt={new:0};scope.forEach(({r})=>{cnt[bucket(r)]=(cnt[bucket(r)]||0)+1;if(r.isNew)cnt.new++;});
    let rs=scope.filter(({r})=>bfil==='ALL'||(bfil==='new'?r.isNew:bucket(r)===bfil));
    if(q)rs=rs.filter(({r})=>(r.course+' '+(r.id||'')+' '+(r.code||'')).toLowerCase().includes(q));
    rs.sort((a,b)=>(b.r.isNew?1:0)-(a.r.isNew?1:0)||(a.r.date||'9999').localeCompare(b.r.date||'9999'));
    el.innerHTML=`
      <div class="toolbar">
        <button class="btn btn-red" onclick="DSD.openAdd()">+ เพิ่มรุ่นอบรม</button>
        <select onchange="DSD.setCo(this.value)">${genpoOptions(cofil,{all:true})}</select>
        <input id="dq" type="search" placeholder="ค้นหา หลักสูตร / Code / ID" value="${esc(q)}" style="width:220px" oninput="DSD.search(this.value)">

        <button class="btn btn-ghost" onclick="DSD.exportExcel()">Export Excel</button>

      </div>
      <div class="tiles">
        <span class="tile"><b>${ps.total}</b><span>ยื่นทั้งหมด (คน·ครั้ง)</span></span>
        <span class="tile ok"><b>${ps.unique}</b><span>ไม่ซ้ำ (คน)</span></span>
        <span class="tile ${ps.dup?'alert':''}"><b>${ps.dup}</b><span>ยื่นซ้ำเกิน 1 ครั้ง</span></span>
      </div>
      ${ps.dup?`<div class="note" style="color:var(--alert);margin:-6px 0 12px">⚠ รหัสพนักงานยื่นซ้ำ ${ps.dupIds.length} คน: ${ps.dupIds.slice(0,12).map(esc).join(', ')}${ps.dupIds.length>12?' …':''}</div>`:''}
      <div class="tiles">${TILES.filter(([k])=>k!=='new'||cnt.new).map(([k,t,cl])=>`<button class="tile ${cl} ${bfil===k?'on':''}" onclick="DSD.setB('${k}')"><b>${k==='ALL'?scope.length:(cnt[k]||0)}</b><span>${t}</span></button>`).join('')}</div>
      <div class="tblwrap"><table><thead><tr><th>Genpo / Code</th><th>หลักสูตร</th><th>วันอบรม</th><th>คน</th><th>ขอรับรอง</th><th>ขั้นตอน</th><th>สถานะ</th></tr></thead><tbody id="dRows"></tbody></table></div>`;
    const tb=el.querySelector('#dRows');
    if(!rs.length){tb.innerHTML=`<tr><td colspan="7" class="empty">ไม่มีรายการ — หลักสูตรที่เพิ่มใน Training จะเข้ามาที่นี่อัตโนมัติ</td></tr>`;return;}
    let html='',lastM='';
    for(const {r,g} of rs){const mk=r.isNew?'new':(r.date?r.date.slice(0,7):'no');
      if(mk!==lastM){lastM=mk;const lbl=mk==='new'?'ใหม่จาก Training — คลิกเพื่อตรวจสอบ':mk==='no'?'ไม่ระบุวันที่':MONTH[+mk.slice(5)-1]+' '+mk.slice(0,4);html+=`<tr class="mrow"><td colspan="7">${lbl}</td></tr>`;}
      const b=bucket(r),st=lastStatus(r),rq=r.req||'none';
      const rqChip=rq==='ok'?`<span class="chip ok">✓ รับรองแล้ว</span><br><span style="font-size:var(--fs-xs);color:var(--sub)">ID ${esc(r.id)||'—'}</span>`:rq==='sent'?`<span class="chip wait">ยื่นแล้ว</span>`:`<span class="chip alert">ยังไม่ยื่น</span>${r.date?`<br><span style="font-size:var(--fs-xs);color:var(--sub)">ภายใน ${fmtDMY(reqDue(r))}</span>`:''}`;
      const dots=`<span class="dot ${rq==='ok'?'ok':rq==='sent'?'wait':'hot'}" title="${REQ[rq]}"></span>`+STEPS.map(s=>`<span class="dot ${r[s.k]?'ok':(s.k==='report'&&b==='noreport'?'hot':'wait')}" title="${s.nm}"></span>`).join('');
      const pc=(r.people||[]).length;
      html+=`<tr class="clk ${r.isNew?'isnew':st.cl==='alert'?'late':''}" onclick="DSD.openDrawer('${g}','${r.id_}')">
        <td><span class="co ${g}">${CO[g]}</span>${r.code?`<br><span class="code">${esc(r.code)}</span>`:''}</td>
        <td class="cname">${esc(r.course)}${r.isNew?'<span class="newtag">NEW</span>':''}${r.by?`<br><span class="by">เพิ่มโดย ${esc(r.by)}</span>`:''}</td>
        <td class="cdate">${fRange(r)}</td><td>${r.ppl??''}${pc?`<br><span style="font-size:var(--fs-xs);color:var(--sub)">${pc} รหัส</span>`:''}</td>
        <td style="line-height:1.5">${rqChip}</td><td><div class="dots">${dots}</div></td>
        <td><span class="chip ${r.isNew?'info':st.cl}">${r.isNew?'ใหม่ · ':''}${esc(st.t)}</span></td></tr>`;}
    tb.innerHTML=html;}
  function setB(b){bfil=b;App.render();}
  function setCo(v){cofil=v;App.render();}
  function search(v){q=v.trim().toLowerCase();App.render();const i=$('dq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}

  async function openDetail(g,id){currentG=g;currentId=id;const r=cur();if(!r)return;
    if(r.isNew){r.isNew=false;r.seenBy=state.profile.username;App.saveDsd(g,'seen '+(r.code||r.course)).then(()=>App.render()).catch(()=>{});}
    const rq=r.req||'none',dRq=daysUntil(reqDue(r)),dRep=daysUntil(reportDue(r));
    const mine=(r.people||[]).map(x=>String(x).trim()).filter(Boolean);
    const others=allRuns().filter(({r:o})=>o!==r).flatMap(({r:o})=>(o.people||[]).map(x=>String(x).trim()));
    const dupHere=mine.filter(id=>others.includes(id));const linkedC=App.courseByCode(r.code,g);

          <div class="grid2"><div class="frow"><label>สถานะการยื่น</label><select onchange="DSD.setReq(this.value)">${Object.entries(REQ).map(([k,v])=>`<option value="${k}" ${rq===k?'selected':''}>${v}</option>`).join('')}</select></div>
            <div class="frow"><label>วันที่ยื่น</label>${dateInput(r.reqDate,"DSD.editDate('reqDate',this.value)")}</div></div>
