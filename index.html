<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<title>People Center Training Hub — Demo</title>
<style>
:root{
  --red:#CC0000; --red-dark:#A30000; --ink:#1A1A1A; --sub:#6B6B6B;
  --line:#E4E4E4; --line2:#F0F0F2; --bg:#F7F7F7; --card:#FFFFFF;
  --ok:#1E8E3E; --wait:#B26A00; --none:#9AA0A6; --alert:#D93025;
  --c-TH:#1f3a5f; --c-HRST:#CC0000; --c-EGAS:#3f6f68;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
a{color:var(--red)}
.btn{padding:8px 15px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-dark)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--ink)}.btn-ghost:hover{border-color:var(--sub)}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#EFEFEF;color:var(--sub);white-space:nowrap}
.chip.ok{background:#E6F4EA;color:var(--ok)}.chip.wait{background:#FFF3E0;color:var(--wait)}
.chip.alert{background:#FDE7E7;color:var(--alert)}
.code{display:inline-block;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:4px;background:#F0F0F2;color:#444}
.co{display:inline-block;font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap}
.co.TH{background:#E5EFFA;color:var(--c-TH)}.co.HRST{background:#FDE7E7;color:var(--red)}.co.EGAS{background:#E6F4EA;color:var(--c-EGAS)}

#demoBar{background:#2C2C2A;color:#fff;font-size:12.5px;padding:7px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#demoBar b{background:#E9A13B;color:#2C2C2A;padding:1px 8px;border-radius:3px;font-size:11px;letter-spacing:.04em}
#demoBar span{opacity:.85}
header{background:var(--card);border-bottom:2px solid var(--red);padding:0 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;height:56px}
header .brand{display:flex;align-items:center;gap:10px;margin-right:8px}
header .brand img{height:26px}
header .brand .nm{font-size:15px;font-weight:600;line-height:1.1}
.nav{display:flex;gap:2px;height:100%}
.nav button{padding:0 15px;font-size:13px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px}
.nav button.on{color:var(--red);border-bottom-color:var(--red);font-weight:500}
.nav button:hover{color:var(--ink)}
.spacer{flex:1}
main{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.cofil{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.cofil button{padding:8px 14px;color:var(--sub)}.cofil button.on{background:var(--red);color:#fff}
.note{font-size:12px;color:var(--sub);line-height:1.6}

table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
th{font-size:11px;font-weight:500;color:var(--sub);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:#FCFCFC;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#FFF6F6}
.cname{max-width:320px}.cdate{white-space:nowrap;font-size:12.5px;color:var(--sub)}
.dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;background:#E9E9E9;border:1px solid #DADADA}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.wait{background:#FFD9A0;border-color:var(--wait)}
.dot.hot{background:var(--alert);border-color:var(--alert)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel h3{font-size:13px;font-weight:600;margin-bottom:2px}
.panel .cap{font-size:11.5px;color:var(--sub);margin-bottom:10px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;border-top:3px solid var(--line)}
.kcard.ok{border-top-color:var(--ok)}.kcard.bad{border-top-color:var(--alert)}.kcard.warn{border-top-color:var(--wait)}.kcard.neutral{border-top-color:var(--red)}
.kcard b{display:block;font-size:30px;font-weight:600;line-height:1.15}
.kcard .lb{font-size:12px;color:var(--sub);margin-top:2px}
.kcard .sub{font-size:11px;color:var(--none);margin-top:5px}
.kcard.bad b{color:var(--alert)}.kcard.ok b{color:var(--ok)}.kcard.warn b{color:var(--wait)}
.dwrap{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.fl{font-size:11.5px;fill:var(--sub)}.fv{font-size:11.5px;fill:var(--ink);font-weight:500}
.gbar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:5px}
.gbar i{display:block;height:100%;background:var(--ok)}
.grow{padding:9px 0;border-bottom:1px solid var(--line2)}.grow:last-child{border:none}
.rk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2)}
.rk:last-child{border:none}
.rk .bar{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
.rk.high .bar{background:var(--alert)}.rk.mid .bar{background:var(--wait)}
.rk .msg{font-size:12px}.rk.high .msg{color:var(--alert)}.rk.mid .msg{color:var(--wait)}

.sect{margin-bottom:22px}
.sect h3{font-size:12px;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.frow{margin-bottom:14px}
.warnbox{background:#FFFAF2;border:1px solid #F3D9A8;border-left:3px solid var(--wait);border-radius:0 6px 6px 0;padding:11px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.65}
.okbox{background:#F4FAF5;border:1px solid #CBE6D0;border-left:3px solid var(--ok);border-radius:0 6px 6px 0;padding:11px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.65}
.mini{font-size:11px;padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:#fff}
.mini:hover{border-color:var(--red);color:var(--red)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:5px;font-size:13px;display:none;z-index:60}
.hide{display:none!important}
@media print{#demoBar,header,.toolbar,.noprint{display:none!important}main{padding:0}.panel,.kcard{break-inside:avoid}}
</style>
</head>
<body>
<div id="demoBar">
  <b>DEMO</b>
  <span>ข้อมูลทั้งหมดในหน้านี้เป็นข้อมูลสมมติสำหรับสาธิตเท่านั้น · ไม่มีการเชื่อมต่อเซิร์ฟเวอร์ใด ๆ · สิ่งที่พิมพ์เพิ่มจะหายเมื่อปิดหน้าต่าง</span>
</div>
<header>
  <div class="brand"><img id="hdrLogo" alt="Honda"><span class="nm">People Center<br>Training Hub</span></div>
  <nav class="nav" id="nav"></nav>
  <div class="spacer"></div>
  <span class="note">โหมดสาธิต</span>
</header>
<main><div id="app"></div></main>
<div id="toast"></div>

/* ---------- ลิงก์ SharePoint: เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่เคยส่งออกไปไหน ---------- */
const SP_KEY='pcth_sp_links';
function spCfg(){try{return JSON.parse(localStorage.getItem(SP_KEY)||'{}')}catch(e){return{}}}
function spSave(o){localStorage.setItem(SP_KEY,JSON.stringify(o))}
function spLink(g,code){
  const base=(spCfg()[g]||'').trim(); if(!base)return null;
  let u; try{u=new URL(base)}catch(e){return null}
  if(u.protocol!=='https:')return null;              // กัน javascript: / data: เด็ดขาด
  if(u.searchParams.has('id')){                       // รูปแบบ .../AllItems.aspx?id=<path>
    u.searchParams.set('id',u.searchParams.get('id').replace(/\/+$/,'')+'/'+code);
    return u.toString();
  }
  return base.replace(/\/+$/,'')+'/'+encodeURIComponent(code);
}
function spButton(g,code,label){
  const url=spLink(g,code);
  if(!url)return `<button class="mini" onclick="App.go('settings')">ตั้งค่าลิงก์ SharePoint ก่อน</button>`;
  return `<a class="btn btn-red" style="font-size:12px;padding:7px 13px" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label||'เปิดโฟลเดอร์ SharePoint')}</a>`;
}

/* ================= Dashboard ================= */
const Dash=(()=>{
  const LEAD=30, REPORT=60;
  const MTH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  let gfil='ALL';
  const runs=()=>state.runs.filter(r=>gfil==='ALL'||r.co===gfil);
  const endD=r=>r.dateEnd||r.date;
  const isPast=r=>!!endD(r)&&endD(r)<todayISO();
  const reqDue=r=>addD(r.date,-LEAD), reportDue=r=>addD(endD(r),REPORT);
  function risks(){
    const out=[];
    for(const r of runs()){
      const rq=r.req||'none';
      if(rq==='none'&&r.date){const d=daysTo(reqDue(r));
        if(d!==null&&d<0)out.push({r,lv:'high',t:`เลยกำหนดยื่นขอรับรอง ${-d} วัน`,due:reqDue(r)});
        else if(d!==null&&d<=14)out.push({r,lv:'mid',t:`ต้องยื่นขอรับรองใน ${d} วัน`,due:reqDue(r)});}
      if(rq!=='ok'&&isPast(r))out.push({r,lv:'high',t:'อบรมไปแล้วแต่ยังไม่ได้รับรองหลักสูตร',due:endD(r)});
      if(rq==='ok'&&isPast(r)&&!r.report){const d=daysTo(reportDue(r));
        if(d!==null&&d<0)out.push({r,lv:'high',t:`เลยกำหนดยื่นรายงาน ${-d} วัน`,due:reportDue(r)});
        else out.push({r,lv:'mid',t:`ต้องยื่นรายงานใน ${d} วัน`,due:reportDue(r)});}
    }
    const rank={high:0,mid:1};
    return out.sort((a,b)=>rank[a.lv]-rank[b.lv]||(a.due||'').localeCompare(b.due||''));
  }
  function render(el){
    const R=runs(), n=R.length, pct=(a,b)=>b?Math.round(a*100/b):0;
    const certified=R.filter(r=>r.req==='ok').length, certPct=pct(certified,n);
    const rk=risks(), high=rk.filter(x=>x.lv==='high').length, mid=rk.filter(x=>x.lv==='mid').length;
    const ids=R.flatMap(r=>r.people||[]), uniq=new Set(ids).size;

    const STG=[{k:'noreq',lb:'ยังไม่ยื่นขอรับรอง',c:'#D93025'},
      {k:'sent',lb:'ยื่นแล้ว รอกรมรับรอง',c:'#E9A13B'},
      {k:'okwait',lb:'รับรองแล้ว รอยื่นรายงาน',c:'#4A90D9'},
      {k:'reported',lb:'ยื่นรายงาน รอกรมอนุมัติ',c:'#7E9E3E'},
      {k:'deptok',lb:'กรมอนุมัติแล้ว รอปิดเอกสาร',c:'#2E9E5B'},
      {k:'closed',lb:'ปิดเอกสารครบ',c:'#1B6B3A'}];
    const stageOf=r=>{const rq=r.req||'none';
      if(rq==='none')return'noreq'; if(rq==='sent')return'sent';
      if(!r.report)return'okwait'; if(!r.dept)return'reported';
      return (r.receipt&&r.cert)?'closed':'deptok';};
    const sc={}; R.forEach(r=>{const k=stageOf(r);sc[k]=(sc[k]||0)+1;});
    const CX=130,CY=132,RM=76,SW=36,CIRC=2*Math.PI*RM; let off=0;
    const donut=STG.map(s=>{const v=sc[s.k]||0;if(!v||!n)return'';
      const len=v*CIRC/n;
      const e=`<circle cx="${CX}" cy="${CY}" r="${RM}" fill="none" stroke="${s.c}" stroke-width="${SW}" stroke-dasharray="${len.toFixed(2)} ${(CIRC-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${CX} ${CY})"><title>${s.lb}: ${v}</title></circle>`;
      off+=len;return e;}).join('')||`<circle cx="${CX}" cy="${CY}" r="${RM}" fill="none" stroke="#E8E8E8" stroke-width="${SW}"/>`;
    const legend=STG.map((s,i)=>{const v=sc[s.k]||0,y=34+i*32;
      return `<rect x="266" y="${y}" width="12" height="12" rx="3" fill="${s.c}" opacity="${v?1:.28}"/>`+
        `<text class="fl" x="288" y="${y+11}" ${v?'style="fill:var(--ink)"':''}>${s.lb}</text>`+
        `<text class="fv" x="612" y="${y+11}" text-anchor="end" ${v?'':'style="fill:var(--none)"'}>${v} · ${pct(v,n)}%</text>`;}).join('');

    const rows=GENPOS.map(g=>{const gr=state.runs.filter(r=>r.co===g);
      const c=gr.filter(r=>r.req==='ok').length;
      const ov=gr.filter(r=>(r.req!=='ok'&&isPast(r))||(r.req==='none'&&r.date&&daysTo(reqDue(r))<0)||(r.req==='ok'&&isPast(r)&&!r.report&&daysTo(reportDue(r))<0)).length;
      return {g,n:gr.length,c,ov,p:pct(c,gr.length)};});

    const nowD=new Date(), kiS=new Date(nowD.getMonth()>=3?nowD.getFullYear():nowD.getFullYear()-1,3,1);
    const mData=[...Array(12)].map((_,i)=>{const d=new Date(kiS.getFullYear(),kiS.getMonth()+i,1);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const mr=R.filter(r=>(r.date||'').slice(0,7)===key);
      return {m:d.getMonth(),tot:mr.length,ok:mr.filter(r=>r.req==='ok').length};});
    const mMax=Math.max(1,...mData.map(x=>x.tot));
    const bars=mData.map((d,i)=>{const x=i*44+40,h=d.tot*110/mMax,y=150-h,ho=d.ok*110/mMax;
      return `<rect x="${x}" y="${y}" width="26" height="${h}" rx="3" fill="#E0E0E0"/>`+
        `<rect x="${x}" y="${150-ho}" width="26" height="${ho}" rx="3" fill="#1E8E3E"/>`+
        `<text class="fv" x="${x+13}" y="${y-5}" text-anchor="middle">${d.tot||''}</text>`+
        `<text class="fl" x="${x+13}" y="166" text-anchor="middle">${MTH[d.m]}</text>`;}).join('');

    el.innerHTML=`
      <div class="toolbar noprint">
        <div class="cofil"><button class="${gfil==='ALL'?'on':''}" onclick="Dash.fil('ALL')">ทุกบริษัท</button>${GENPOS.map(g=>`<button class="${gfil===g?'on':''}" onclick="Dash.fil('${g}')">${CO[g]}</button>`).join('')}</div>
        <button class="btn btn-ghost" onclick="window.print()">พิมพ์ / บันทึก PDF</button>
        <span class="note">ข้อมูลสาธิต ณ ${fmtDMY(todayISO())}</span>
      </div>
      <div class="dwrap">
        <div class="kpi">
          <div class="kcard ${certPct>=90?'ok':certPct>=70?'warn':'bad'}"><b>${certPct}%</b><div class="lb">อัตรารับรองหลักสูตร DSD</div><div class="sub">${certified} จาก ${n} รุ่น</div></div>
          <div class="kcard ${high?'bad':'ok'}"><b>${high}</b><div class="lb">รายการเกินกำหนดตามกฎหมาย</div><div class="sub">${high?'ต้องดำเนินการทันที':'ไม่มีรายการค้าง'}</div></div>
          <div class="kcard ${mid?'warn':'ok'}"><b>${mid}</b><div class="lb">ใกล้ครบกำหนด (ภายใน 14 วัน)</div><div class="sub">เฝ้าระวัง</div></div>
          <div class="kcard neutral"><b>${uniq}</b><div class="lb">พนักงานที่ยื่นแล้ว (ไม่ซ้ำ)</div><div class="sub">จากการยื่นรวม ${ids.length} ครั้ง</div></div>
        </div>
        <div class="panel">
          <h3>สถานะการดำเนินการ DSD</h3>
          <div class="cap">ยื่นขอรับรองก่อนอบรม ${LEAD} วัน · ยื่นรายงานหลังอบรมภายใน ${REPORT} วัน</div>
          <svg width="100%" viewBox="0 0 620 244">${donut}
            <text x="${CX}" y="${CY-4}" text-anchor="middle" style="font-size:26px;font-weight:600;fill:var(--ink)">${n}</text>
            <text x="${CX}" y="${CY+16}" text-anchor="middle" class="fl">รุ่นอบรม</text>${legend}</svg>
        </div>
        <div class="two">
          <div class="panel"><h3>เปรียบเทียบตามบริษัท</h3><div class="cap">อัตรารับรองหลักสูตร และรายการค้าง</div>
            ${rows.map(r=>`<div class="grow"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span><span class="co ${r.g}">${CO[r.g]}</span> <span style="color:var(--sub)">${r.c}/${r.n} รุ่น</span></span><span><b>${r.p}%</b>${r.ov?` <span class="chip alert">ค้าง ${r.ov}</span>`:''}</span></div><div class="gbar"><i style="width:${r.p}%;background:${r.p>=90?'var(--ok)':r.p>=70?'var(--wait)':'var(--alert)'}"></i></div></div>`).join('')}
            <div class="cap" style="margin:12px 0 0">Training Tracker: ${state.courses.length} หลักสูตร · ยื่น DSD แล้ว ${state.courses.filter(c=>c.steps.dsd).length}</div>
          </div>
          <div class="panel"><h3>ปริมาณการอบรมรายเดือน (ปี Ki ปัจจุบัน)</h3>
            <div class="cap">แท่งเขียว = รับรองหลักสูตรแล้ว · เทา = ยังไม่รับรอง</div>
            <svg width="100%" viewBox="0 0 620 180">${bars}</svg></div>
        </div>
        <div class="panel">
          <h3>รายการที่ต้องดำเนินการ ${rk.length?`(${rk.length})`:''}</h3>
          <div class="cap">เรียงตามความเร่งด่วน — แดง = เกินกำหนดแล้ว, ส้ม = ใกล้ครบกำหนด</div>
          ${rk.length?rk.slice(0,12).map(x=>`<div class="rk ${x.lv}"><span class="bar"></span><div style="flex:1"><div style="font-size:13px"><span class="co ${x.r.co}">${CO[x.r.co]}</span> ${esc(x.r.course)}</div><div class="msg">${esc(x.t)}${x.due?` · กำหนด ${fmtDMY(x.due)}`:''}</div></div></div>`).join(''):'<div class="note" style="color:var(--ok)">ไม่มีรายการค้างดำเนินการ</div>'}
        </div>
      </div>`;
  }
  function fil(g){gfil=g;App.render();}
  return {render,fil};
})();

/* ================= DSD Tracker ================= */
const DSD=(()=>{
  const LEAD=30, REPORT=60;
  const REQ={none:'ยังไม่ยื่นขอรับรอง',sent:'ยื่นแล้ว รอกรมรับรอง',ok:'รับรองหลักสูตรแล้ว'};
  const STEPS=[{k:'report',nm:'ยื่นรายงานการฝึก'},{k:'dept',nm:'กรมพัฒฯ อนุมัติรายงาน'},{k:'receipt',nm:'ใบเสร็จ'},{k:'cert',nm:'หนังสือรับรอง'}];
  let gfil='ALL', openId=null;
  const list=()=>state.runs.filter(r=>gfil==='ALL'||r.co===gfil);
  const endD=r=>r.dateEnd||r.date;
  const isPast=r=>!!endD(r)&&endD(r)<todayISO();
  const reqDue=r=>addD(r.date,-LEAD), reportDue=r=>addD(endD(r),REPORT);
  function status(r){
    const rq=r.req||'none';
    if(rq==='none'){const d=daysTo(reqDue(r));
      if(d!==null&&d<0)return{t:'เลยกำหนดยื่นขอรับรอง',cl:'alert'};return{t:'ยังไม่ยื่นขอรับรอง',cl:'alert'};}
    if(rq==='sent')return{t:'รอกรมรับรอง',cl:'wait'};
    if(!isPast(r))return{t:'รับรองแล้ว รออบรม',cl:'ok'};
    if(!r.report){const d=daysTo(reportDue(r));
      return d!==null&&d<0?{t:`เลยกำหนดยื่นรายงาน ${-d} วัน`,cl:'alert'}:{t:`ต้องยื่นรายงานใน ${d} วัน`,cl:'wait'};}
    if(!r.dept)return{t:'รอกรมอนุมัติรายงาน',cl:'wait'};
    if(!(r.receipt&&r.cert))return{t:'รอปิดเอกสาร',cl:'wait'};
    return{t:'เสร็จสิ้น',cl:'ok'};
  }
  function render(el){
    if(openId)return detail(el);
    const R=list().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const ids=R.flatMap(r=>r.people||[]), uniq=new Set(ids).size;
    el.innerHTML=`
      <div class="toolbar">
        <div class="cofil"><button class="${gfil==='ALL'?'on':''}" onclick="DSD.fil('ALL')">ทั้งหมด</button>${GENPOS.map(g=>`<button class="${gfil===g?'on':''}" onclick="DSD.fil('${g}')">${CO[g]}</button>`).join('')}</div>
        <span class="note">รหัสพนักงานในหน้านี้เป็นข้อมูลสมมติ (EMP-xxxx)</span>
      </div>
      <div class="kpi" style="margin-bottom:14px">
        <div class="kcard neutral"><b>${ids.length}</b><div class="lb">ยื่นทั้งหมด (คน·ครั้ง)</div></div>
        <div class="kcard ok"><b>${uniq}</b><div class="lb">ไม่ซ้ำ (คน)</div></div>
        <div class="kcard ${ids.length-uniq?'warn':'ok'}"><b>${ids.length-uniq}</b><div class="lb">ซ้ำ (ยื่นเกิน 1 ครั้ง)</div></div>
      </div>
      <table><thead><tr><th>บริษัท / Code</th><th>หลักสูตร</th><th>วันอบรม</th><th>คน</th><th>ขอรับรอง</th><th>สถานะ</th></tr></thead><tbody>
      ${R.map(r=>{const st=status(r),rq=r.req||'none';
        return `<tr onclick="DSD.open('${esc(r.id_)}')" style="cursor:pointer">
        <td><span class="co ${r.co}">${CO[r.co]}</span><br><span class="code">${esc(r.code)}</span></td>
        <td class="cname">${esc(r.course)}</td>
        <td class="cdate">${fmtDMY(r.date)}${r.dateEnd!==r.date?' – '+fmtDMY(r.dateEnd):''}</td>
        <td>${r.ppl??''}${(r.people||[]).length?`<br><span style="font-size:11px;color:var(--sub)">${r.people.length} id</span>`:''}</td>
        <td>${rq==='ok'?`<span class="chip ok">✓ รับรองแล้ว</span><br><span style="font-size:11px;color:var(--sub)">ID ${esc(r.id)}</span>`:rq==='sent'?'<span class="chip wait">ยื่นแล้ว</span>':`<span class="chip alert">✕ ยังไม่ยื่น</span>${r.date?`<br><span style="font-size:11px;color:var(--sub)">ภายใน ${fmtDMY(reqDue(r))}</span>`:''}`}</td>
        <td><span class="chip ${st.cl}">${st.t}</span></td></tr>`;}).join('')}
      </tbody></table>`;
  }
  function detail(el){
    const r=state.runs.find(x=>x.id_===openId); if(!r){openId=null;return render(el);}
    el.innerHTML=`
      <div class="toolbar"><button class="btn btn-ghost" onclick="DSD.close()">← กลับ</button>
        <span class="co ${r.co}">${CO[r.co]}</span> <span class="code">${esc(r.code)}</span> <b>${esc(r.course)}</b></div>
      <div class="two">
        <div class="panel"><h3>ขอรับรองหลักสูตร (ก่อนอบรม ${LEAD} วัน)</h3>
          <div class="note" style="line-height:2">สถานะ: <b>${REQ[r.req||'none']}</b><br>
            ${r.id?`เลข ID รับรอง: <span class="code">${esc(r.id)}</span><br>`:''}
            วันอบรม: ${fmtDMY(r.date)}${r.dateEnd!==r.date?' – '+fmtDMY(r.dateEnd):''}<br>
            กำหนดยื่นขอรับรอง: ${fmtDMY(reqDue(r))}<br>
            กำหนดยื่นรายงาน: ${fmtDMY(reportDue(r))}</div>
          <div class="sect" style="margin-top:14px"><h3>รายชื่อผู้เข้าอบรม และเอกสาร</h3>
            <div class="note" style="margin-bottom:9px">เก็บใน SharePoint ของบริษัท ไม่ได้เก็บในระบบนี้</div>
            ${spButton(r.co,r.code)}</div>
        </div>
        <div class="panel"><h3>ขั้นตอนหลังอบรม</h3>
          <div class="cap">ทดลองติ๊กได้ — เป็นการสาธิต ไม่มีการบันทึก</div>
          ${STEPS.map(s=>`<div class="grow" style="display:flex;align-items:center;gap:10px">
            <span style="flex:1;font-size:13px">${s.nm}</span>
            <input type="checkbox" ${r[s.k]?'checked':''} onchange="DSD.toggle('${esc(r.id_)}','${s.k}',this.checked)" style="width:16px;height:16px;accent-color:var(--red)"></div>`).join('')}
          <div class="note" style="margin-top:12px">รหัสพนักงานที่ยื่น: ${(r.people||[]).length} รายการ (ข้อมูลสมมติ)</div>
        </div>
      </div>`;
  }
  function fil(g){gfil=g;App.render();}
  function open(id){openId=id;App.render();}
  function close(){openId=null;App.render();}
  function toggle(id,k,v){const r=state.runs.find(x=>x.id_===id);if(r){r[k]=v;App.render();}}
  return {render,fil,open,close,toggle};
})();

/* ================= Calendar ================= */
const Calendar=(()=>{
  const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const MTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  let cur=new Date(), gfil='ALL';
  const kiOf=d=>(d.getMonth()>=3?d.getFullYear():d.getFullYear()-1)-1923;
  const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  function render(el){
    const y=cur.getFullYear(),m=cur.getMonth();
    const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
    const ev=state.events.filter(e=>gfil==='ALL'||e.co===gfil);
    const curKi=kiOf(cur),kis=[];for(let k=curKi-3;k<=curKi+3;k++)kis.push(k);
    let cells='';for(let i=0;i<start;i++)cells+='<div class="cal-cell empty"></div>';
    for(let d=1;d<=days;d++){const ds=ymd(new Date(y,m,d));const de=ev.filter(e=>e.date===ds);
      cells+=`<div class="cal-cell${ds===todayISO()?' today':''}"><div class="cal-d">${d}</div>${de.map(e=>`<div class="cal-ev" title="${esc(e.title)}"><span class="dotco ${e.co}"></span>${esc(e.title)}</div>`).join('')}</div>`;}
    const monthEv=ev.filter(e=>(e.date||'').slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).sort((a,b)=>a.date.localeCompare(b.date));
    el.innerHTML=`
      <style>
      .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
      .cal-dow{background:#FCFCFC;padding:7px 0;text-align:center;font-size:11px;color:var(--sub);font-weight:500}
      .cal-cell{background:#fff;min-height:92px;padding:4px 5px;overflow:hidden}.cal-cell.empty{background:#FAFAFA}
      .cal-cell.today{box-shadow:inset 0 0 0 2px var(--red)}
      .cal-d{font-size:12px;color:var(--sub);margin-bottom:3px}
      .cal-ev{font-size:11px;background:#F7F7F7;border-left:3px solid var(--ok);border-radius:3px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .dotco{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
      .dotco.TH{background:var(--c-TH)}.dotco.HRST{background:var(--c-HRST)}.dotco.EGAS{background:var(--c-EGAS)}
      .agenda{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
      .ag-item{border-left:3px solid var(--ok);padding:6px 9px;margin-bottom:7px;background:#FAFAFA;border-radius:0 5px 5px 0}
      </style>
      <div class="toolbar">
        <button class="btn btn-ghost" onclick="Calendar.move(-1)">‹</button>
        <div style="font-size:18px;font-weight:600">${MTH[m]} ${y+543}</div>
        <button class="btn btn-ghost" onclick="Calendar.move(1)">›</button>
        <select style="width:auto" onchange="Calendar.jumpKi(+this.value)">${kis.map(k=>`<option value="${k}" ${k===curKi?'selected':''}>${k} Ki (เม.ย.${k+1923+543} – มี.ค.${k+1924+543})</option>`).join('')}</select>
        <button class="btn btn-ghost" onclick="Calendar.today()">วันนี้</button>
        <div class="cofil"><button class="${gfil==='ALL'?'on':''}" onclick="Calendar.fil('ALL')">ทั้งหมด</button>${GENPOS.map(g=>`<button class="${gfil===g?'on':''}" onclick="Calendar.fil('${g}')">${CO[g]}</button>`).join('')}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 300px;gap:16px">
        <div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
        <div class="agenda"><div class="cap" style="font-size:12px;color:var(--sub);margin-bottom:8px">กิจกรรมเดือนนี้ (${monthEv.length})</div>
          ${monthEv.length?monthEv.map(e=>`<div class="ag-item"><b style="font-size:12.5px">${esc(e.title)}</b><div style="font-size:11px;color:var(--sub)"><span class="dotco ${e.co}"></span>${CO[e.co]} · ${fmtDMY(e.date)} · ${esc(e.time)}</div></div>`).join(''):'<div class="note">ไม่มีกิจกรรม</div>'}</div>
      </div>`;
  }
  function move(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);App.render();}
  function today(){cur=new Date();App.render();}
  function jumpKi(k){cur=new Date(k+1923,3,1);App.render();}
  function fil(g){gfil=g;App.render();}
  return {render,move,today,jumpKi,fil};
})();

/* ================= ตั้งค่าลิงก์ SharePoint ================= */
const Settings=(()=>{
  function render(el){
    const cfg=spCfg();
    el.innerHTML=`
      <div class="okbox">
        <b>ข้อมูลของคุณอยู่ที่ไหน</b><br>
        ลิงก์ที่กรอกในหน้านี้ถูกเก็บไว้ใน <b>เบราว์เซอร์เครื่องนี้เท่านั้น</b> (localStorage)
        ไม่มีการส่งออกไปยังเซิร์ฟเวอร์ใด ๆ — หน้าเว็บนี้ไม่มีการเชื่อมต่อออกภายนอกเลยแม้แต่จุดเดียว
        ถ้าเปิดจากเครื่องอื่นหรือล้างข้อมูลเบราว์เซอร์ จะต้องกรอกใหม่
      </div>
      <div class="warnbox">
        <b>ข้อควรระวัง</b><br>
        อย่าพิมพ์ชื่อพนักงาน รหัสพนักงานจริง หรือข้อมูลภายในลงในหน้าเว็บสาธิตนี้
        เอกสารและรายชื่อทั้งหมดควรอยู่ใน SharePoint ของบริษัทเท่านั้น
      </div>
      <div class="panel">
        <h3>ลิงก์โฟลเดอร์ SharePoint แยกตามบริษัท</h3>
        <div class="cap">วาง URL ของโฟลเดอร์แม่ที่เก็บเอกสารของแต่ละบริษัท ระบบจะต่อชื่อโฟลเดอร์ย่อยตาม Training Code ให้เอง<br>
          เช่น วาง <span class="code">.../8.HRST</span> แล้วหลักสูตร <span class="code">HRST-001</span> จะลิงก์ไปที่ <span class="code">.../8.HRST/HRST-001</span><br>
          รับเฉพาะ URL ที่ขึ้นต้นด้วย https:// เท่านั้น</div>
        ${GENPOS.map(g=>`<div class="frow"><label>${CO[g]}</label>
          <input id="sp_${g}" placeholder="https://..." value="${esc(cfg[g]||'')}"></div>`).join('')}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-red" onclick="Settings.save()">บันทึกลิงก์</button>
          <button class="btn btn-ghost" onclick="Settings.test()">ทดสอบเปิดลิงก์</button>
          <button class="btn btn-ghost" style="color:var(--alert);border-color:var(--alert)" onclick="Settings.clear()">ล้างลิงก์ทั้งหมด</button>
        </div>
      </div>
      <div class="panel" style="margin-top:14px">
        <h3>โหมดสาธิตนี้ตัดอะไรออกบ้าง</h3>
        <div class="note" style="line-height:2">
          ✕ ไม่มีเซิร์ฟเวอร์ ไม่มี API ไม่มีฐานข้อมูล — เปิดจากไฟล์เดียวจบ<br>
          ✕ ไม่มีระบบล็อกอิน ไม่มีการเก็บรหัสผ่าน<br>
          ✕ ไม่มีการอัปโหลดไฟล์ใด ๆ<br>
          ✕ ไม่มีการเรียกออกอินเทอร์เน็ตเลย (ไม่มีแม้แต่ฟอนต์หรือรูปจากภายนอก)<br>
          ✓ ข้อมูลที่แสดงทั้งหมดเป็นข้อมูลสมมติ<br>
          ✓ สิ่งที่แก้ไขในหน้าเว็บจะหายทันทีที่ปิดหรือรีเฟรช
        </div>
      </div>`;
  }
  function read(){const o={};GENPOS.forEach(g=>{const v=document.getElementById('sp_'+g).value.trim();if(v)o[g]=v;});return o;}
  function valid(u){try{return new URL(u).protocol==='https:'}catch(e){return false}}
  function save(){
    const o=read(); const bad=Object.entries(o).filter(([g,u])=>!valid(u)).map(([g])=>CO[g]);
    if(bad.length){toast('ลิงก์ต้องขึ้นต้นด้วย https:// — '+bad.join(', '));return;}
    spSave(o);toast('บันทึกลิงก์แล้ว (เก็บในเครื่องนี้เท่านั้น)');App.render();
  }
  function test(){
    const o=read(); const g=GENPOS.find(x=>o[x]);
    if(!g){toast('ยังไม่ได้กรอกลิงก์');return;}
    if(!valid(o[g])){toast('ลิงก์ต้องขึ้นต้นด้วย https://');return;}
    spSave(o); window.open(spLink(g,'ตัวอย่าง-CODE')||o[g],'_blank','noopener,noreferrer');
  }
  function clear(){if(!confirm('ล้างลิงก์ SharePoint ทั้งหมดออกจากเบราว์เซอร์นี้?'))return;
    localStorage.removeItem(SP_KEY);toast('ล้างแล้ว');App.render();}
  return {render,save,test,clear};
})();

App.boot();
</script>
</body>
</html>
