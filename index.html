      ${chartCard('สถานะสัญญาที่พัก','ตามรายชื่อที่ติดตาม',[{label:'ปกติ',value:aptOk,color:C_OK},{label:'ใกล้ครบกำหนด',value:aptWait,color:C_WAIT},{label:'เลยกำหนด',value:aptAlert,color:C_ALERT}],{centerLabel:'คน'})}
    </div>
    <div class="concern">
      <div class="concern-h"><h3>⚠ รายการที่ต้องรีบจัดการ</h3><span class="cnt">${concerns.length} รายการ</span></div>
      ${concerns.length?concerns.slice(0,15).map(c=>`
        <div class="crow s${c.sev}"><span class="ck ${c.kind}">${esc(c.klabel)}</span><span class="co ${c.g}">${CO[c.g]}</span>
        <div class="cnm"><b>${esc(c.name)}</b><div class="cd">${esc(c.detail)}</div></div><span class="cdt">${c.date?fmtDMY(c.date):'—'}</span></div>`).join('')+(concerns.length>15?`<div class="crow" style="justify-content:center;color:var(--sub)">และอีก ${concerns.length-15} รายการ</div>`:'')
      :'<div class="concern-empty">✓ ไม่มีรายการเร่งด่วน ทุกอย่างอยู่ในกำหนด</div>'}
    </div>`;
    el.querySelectorAll('#vdCofil button').forEach(b=>b.onclick=()=>{cofil=b.dataset.c;App.render();});
  }
  return {render};
})();

/* ================= Visa & Work Permit Calendar ================= */
const VWPCalendar=(()=>{
  const KIND={visa:{t:'Visa/Work Permit',c:'#CC0000'},apartment:{t:'สัญญาที่พัก',c:'#1f3a5f'},resignation:{t:'ลาออก',c:'#B26A00'},retirement:{t:'เกษียณอายุ',c:'#6B6B6B'},other:{t:'อื่นๆ',c:'#3f6f68'}};
  const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'],MTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  let cur=new Date(),cofil='ALL',kfil='ALL',editId=null;
  const evs=()=>state.vwpcal.events;
  const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const show=e=>(cofil==='ALL'||e.co===cofil)&&(kfil==='ALL'||e.kind===kfil);
  const fD=s=>{if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${+y+543}`;};

  function render(el){
    const y=cur.getFullYear(),m=cur.getMonth(),start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
    const monthEvs=evs().filter(e=>e.date&&e.date.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`&&show(e)).sort((a,b)=>a.date.localeCompare(b.date));
    let cells='';for(let i=0;i<start;i++)cells+='<div class="cal-cell empty"></div>';
    for(let d=1;d<=days;d++){const ds=ymd(new Date(y,m,d));const de=evs().filter(e=>e.date===ds&&show(e));const isToday=ds===ymd(new Date());
      cells+=`<div class="cal-cell${isToday?' today':''}" onclick="VWPCalendar.add('${ds}')"><div class="cal-d">${d}</div>${de.slice(0,3).map(e=>`<div class="cal-ev" style="border-left-color:${(KIND[e.kind]||KIND.other).c}" onclick="event.stopPropagation();VWPCalendar.open('${e.id}')"><span class="dotco ${e.co}"></span>${esc(e.title)}</div>`).join('')}${de.length>3?`<div class="cal-more">+${de.length-3}</div>`:''}</div>`;}
    const cofilBtns=`<div class="cofil"><button class="${cofil==='ALL'?'on':''}" onclick="VWPCalendar.fil('ALL')">ทั้งหมด</button>${GENPOS.map(g=>`<button class="${cofil===g?'on':''}" onclick="VWPCalendar.fil('${g}')">${CO[g]}</button>`).join('')}</div>`;
    const kfilBtns=`<div class="cofil"><button class="${kfil==='ALL'?'on':''}" onclick="VWPCalendar.filK('ALL')">ทุกประเภท</button>${Object.entries(KIND).map(([k,v])=>`<button class="${kfil===k?'on':''}" onclick="VWPCalendar.filK('${k}')">${v.t}</button>`).join('')}</div>`;
    el.innerHTML=`
      <style>
      .cal-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
      .cal-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px}@media(max-width:860px){.cal-wrap{grid-template-columns:1fr}}
      .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
      .cal-dow{background:#FCFCFC;padding:7px 0;text-align:center;font-size:11px;color:var(--sub);font-weight:500}
      .cal-cell{background:#fff;min-height:92px;padding:4px 5px;cursor:pointer;overflow:hidden}.cal-cell.empty{background:#FAFAFA;cursor:default}.cal-cell:hover{background:#FFF9F9}
      .cal-cell.today{box-shadow:inset 0 0 0 2px var(--red)}
      .cal-d{font-size:12px;color:var(--sub);margin-bottom:3px}
      .cal-ev{font-size:11px;background:#F7F7F7;border-left:3px solid;border-radius:3px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .cal-more{font-size:10.5px;color:var(--sub)}
      .dotco{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}
      .dotco.TH{background:var(--c-TH)}.dotco.HRST{background:var(--c-HRST)}.dotco.EGAS{background:var(--c-EGAS)}
      .agenda{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;max-height:640px;overflow:auto}
      .agenda h4{font-size:12px;color:var(--sub);margin-bottom:8px}
      .ag-item{border-left:3px solid;padding:6px 9px;margin-bottom:7px;background:#FAFAFA;border-radius:0 5px 5px 0;cursor:pointer}
      .ag-item b{font-size:12.5px}.ag-item .m{font-size:11px;color:var(--sub)}
      </style>
      <div class="cal-top">
        <button class="btn btn-ghost" onclick="VWPCalendar.move(-1)">‹</button>
        <div style="font-size:18px;font-weight:600">${MTH[m]} ${y+543}</div>
        <button class="btn btn-ghost" onclick="VWPCalendar.move(1)">›</button>
        <button class="btn btn-ghost" onclick="VWPCalendar.today()">วันนี้</button>
        ${cofilBtns}${kfilBtns}
        <button class="btn btn-ghost" onclick="VWPCalendar.syncAll()">ซิงค์จาก Visa/WP &amp; Resignation</button>
        <button class="btn btn-red" onclick="VWPCalendar.add('${ymd(new Date())}')">+ เพิ่มกิจกรรม</button>
      </div>
      <div class="cal-wrap">
        <div><div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div></div>
        <div class="agenda"><h4>กิจกรรมเดือนนี้ (${monthEvs.length})</h4>${monthEvs.length?monthEvs.map(e=>`<div class="ag-item" style="border-left-color:${(KIND[e.kind]||KIND.other).c}" onclick="VWPCalendar.open('${e.id}')"><b>${esc(e.title)}</b><div class="m"><span class="dotco ${e.co}"></span>${CO[e.co]} · ${fD(e.date)} · ${(KIND[e.kind]||KIND.other).t}</div></div>`).join(''):'<div class="note">ไม่มีกิจกรรม</div>'}</div>
      </div>`;
  }
  function move(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);App.render();}
  function today(){cur=new Date();App.render();}
  function fil(c){cofil=c;App.render();}
  function filK(k){kfil=k;App.render();}
  async function syncAll(){let n=0;
    for(const {p} of App.allVwp()){
      if(p.visaExpiry&&!evs().some(e=>e.refId===p.id&&e.kind==='visa')){evs().push({id:Date.now().toString(36)+(n++),kind:'visa',refId:p.id,title:'Visa/WP หมดอายุ: '+p.name,co:p.co,date:p.visaExpiry,note:'',by:p.by,history:['ซิงค์โดย '+state.profile.username]});}
      if(p.aptExpiry&&!evs().some(e=>e.refId===p.id&&e.kind==='apartment')){evs().push({id:Date.now().toString(36)+(n++),kind:'apartment',refId:p.id,title:'ที่พักหมดสัญญา: '+p.name,co:p.co,date:p.aptExpiry,note:'',by:p.by,history:['ซิงค์โดย '+state.profile.username]});}
    }
    for(const {it} of App.allResignItems()){if(it.date&&!evs().some(e=>e.refId===it.id&&e.kind===it.kind)){evs().push({id:Date.now().toString(36)+(n++),kind:it.kind,refId:it.id,title:(it.kind==='retirement'?'เกษียณอายุ: ':'ลาออก: ')+it.name,co:it.co,date:it.date,note:'',by:it.by,history:['ซิงค์โดย '+state.profile.username]});}}
    if(!n){toast('ไม่มีรายการใหม่ที่ต้องซิงค์');return;}
    try{await App.saveVwpCal('sync all');App.render();toast('ซิงค์ '+n+' รายการเข้า Calendar');}catch(e){}
  }
  function add(date){editId=null;form({date,co:cofil==='ALL'?'HRST':cofil,kind:kfil==='ALL'?'other':kfil,title:'',note:''});}
  function open(id){const e=evs().find(x=>x.id===id);if(!e)return;editId=id;form(e,true);}
  function form(e,isEdit){openModal(`<h2><span>${isEdit?'แก้ไข':'เพิ่ม'}</span>กิจกรรม</h2>
      <div class="frow"><label>ชื่อกิจกรรม</label><input id="ceTitle" value="${esc(e.title||'')}"></div>
      <div class="grid2">
        <div class="frow"><label>บริษัท</label><select id="ceCo">${GENPOS.map(g=>`<option value="${g}" ${e.co===g?'selected':''}>${CO[g]}</option>`).join('')}</select></div>
        <div class="frow"><label>ประเภท</label><select id="ceKind">${Object.entries(KIND).map(([k,v])=>`<option value="${k}" ${e.kind===k?'selected':''}>${v.t}</option>`).join('')}</select></div>
        <div class="frow"><label>วันที่</label>${dateInput(e.date,'','ceDate')}</div>
      </div>
      <div class="frow"><label>หมายเหตุ</label><textarea id="ceNote" rows="2">${esc(e.note||'')}</textarea></div>
      ${isEdit&&e.by?`<p class="by">เพิ่มโดย ${esc(e.by)}</p>`:''}
      <div class="mfoot">${isEdit?`<button class="btn btn-ghost" style="color:var(--alert);margin-right:auto" onclick="VWPCalendar.del()">ลบ</button>`:''}<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" onclick="VWPCalendar.save()">บันทึก</button></div>`);}
  async function save(){const g=id=>document.getElementById(id).value;
    const title=g('ceTitle').trim();if(!title){toast('กรอกชื่อกิจกรรม');return;}
    const date=parseDMY(g('ceDate'));if(!date){toast('วันที่ต้องเป็น dd/mm/yyyy');return;}
    const rec={title,co:g('ceCo'),kind:g('ceKind'),date,note:g('ceNote').trim()};
    if(editId){const e=evs().find(x=>x.id===editId);Object.assign(e,rec);}
    else evs().push({id:Date.now().toString(36),...rec,by:state.profile.username,history:['สร้างโดย '+state.profile.username]});
    try{await App.saveVwpCal(editId?'edit event':'add event');closeModal();App.render();}catch(e){}}
  async function del(){if(!confirm('ลบกิจกรรมนี้?'))return;state.vwpcal.events=evs().filter(x=>x.id!==editId);try{await App.saveVwpCal('delete event');closeModal();App.render();}catch(e){}}
  return {render,move,today,fil,filK,syncAll,add,open,save,del};
})();

/* ================= Import (นำเข้าข้อมูลเก่า) — เฉพาะ People Center ================= */
const Import=(()=>{
  let app='training',pending=null;
  const pick=(o,keys)=>{for(const k of keys)if(o[k]!==undefined&&o[k]!==''&&o[k]!==null)return o[k];return undefined;};
  function toISO(v){if(!v)return '';
    if(typeof v==='number'){ // Excel serial date
      const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?'':d.toISOString().slice(0,10);}
    v=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
    let m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);if(m){return `${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}
    const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10);}
  function normCo(v){let co=String(v||'HRST').toUpperCase().trim();
    if(GENPOS.includes(co))return co;
    if(co.includes('EG'))return 'EGAS';if(co.includes('TH')&&!co.includes('HR'))return 'TH';return 'HRST';}
  const APP_TXT={training:'Training',dsd:'DSD',calendar:'Calendar',vwp:'Visa & Work Permit',resign:'Resignation/Retirement'};
  function open(a){app=a;pending=null;
    const gsel=(app==='calendar')?'':`<div class="frow"><label>นำเข้าไปที่บริษัท (Genpo)</label><select id="imGenpo">${GENPOS.map(g=>`<option value="${g}">${CO[g]}</option>`).join('')}</select></div>`;
    const hint={training:'รับ array ของหลักสูตร หรือ {courses:[...]} — ฟิลด์ที่อ่าน: name/course, vendor, start, end, count, code',
      dsd:'รับ array ของรุ่น หรือ {runs:[...]} — ฟิลด์: course/name, code, date, dateEnd, ppl, id, req/status, people(รหัสพนักงาน)',
      calendar:'รับ array ของกิจกรรม หรือ {events:[...]} — ฟิลด์: title, co, date, end, time, status, note',
      vwp:'รับ array ของรายชื่อ หรือ {people:[...]} — ฟิลด์: name, empType/type, relatedTo, position, visaExpiry/visa, aptExpiry/apartment, remark (รูปแบบคอลัมน์จริงจะปรับให้ตรงไฟล์ตัวอย่างที่จะได้รับภายหลัง)',
      resign:'รับ array ของรายการ หรือ {items:[...]} — ฟิลด์: name, kind/type(resignation/retirement), position, date, remark'}[app];
    openModal(`<h2><span>นำเข้า</span>${APP_TXT[app]}</h2>
      <p class="note" style="margin-bottom:10px">อัปโหลดไฟล์ Excel/CSV โดยตรง หรือวางข้อมูล JSON จากระบบเดิม แล้วกด "ตรวจสอบ" เพื่อดูตัวอย่างก่อนนำเข้า วันที่รับได้ทั้ง yyyy-mm-dd และ dd/mm/yyyy</p>
      ${gsel}
      <div class="frow"><label>อัปโหลดไฟล์ Excel (.xlsx/.xls) หรือ CSV</label><input type="file" id="imFile" accept=".xlsx,.xls,.csv" onchange="Import.fromFile(this.files[0])"></div>
      <p class="note" style="margin-bottom:6px">${hint}</p>
      <div class="frow"><label>ข้อมูล JSON (เติมอัตโนมัติจากไฟล์ที่อัปโหลด หรือวางเองก็ได้)</label><textarea id="imJson" rows="8" placeholder='[ { "name":"...", "start":"2026-05-08", "count":10 } ]'></textarea></div>
      <div id="imPrev" class="note"></div>
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-ghost" onclick="Import.check()">ตรวจสอบ</button><button class="btn btn-red" id="imGo" disabled onclick="Import.run()">นำเข้า</button></div>`);}
  function fromFile(file){if(!file)return;
    if(!window.XLSX){toast('ไลบรารีอ่านไฟล์ Excel โหลดไม่สำเร็จ (ต้องเชื่อมต่ออินเทอร์เน็ต) — ลองวาง JSON แทน');return;}
    const rd=new FileReader();
    rd.onload=e=>{try{
        const wb=XLSX.read(e.target.result,{type:'array',cellDates:false});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
        document.getElementById('imJson').value=JSON.stringify(rows);
        toast('อ่านไฟล์แล้ว '+rows.length+' แถว — กด "ตรวจสอบ" เพื่อดูตัวอย่าง');
      }catch(err){toast('อ่านไฟล์ไม่สำเร็จ: '+err.message);}};
    rd.onerror=()=>toast('อ่านไฟล์ไม่สำเร็จ');
    rd.readAsArrayBuffer(file);}
  function parse(){let raw;try{raw=JSON.parse(document.getElementById('imJson').value);}catch(e){throw new Error('JSON ไม่ถูกต้อง: '+e.message);}
    let arr=Array.isArray(raw)?raw:(raw.courses||raw.runs||raw.events||raw.people||raw.items||raw.data||[]);
    if(!Array.isArray(arr)||!arr.length)throw new Error('ไม่พบรายการข้อมูล');
    if(app==='training')return arr.map(o=>({name:pick(o,['name','course','title','courseName'])||'(ไม่มีชื่อ)',
      vendorName:pick(o,['vendorName','vendor','institute','สถาบัน'])||'',start:toISO(pick(o,['start','date','dateStart','startDate'])),
      end:toISO(pick(o,['end','dateEnd','endDate']))||toISO(pick(o,['start','date'])),count:+pick(o,['count','ppl','people','seats','จำนวน'])||1,
      cat:pick(o,['cat','category','ประเภท'])||'Public',code:pick(o,['code','trainingCode'])||''}));
    if(app==='dsd')return arr.map(o=>{let ppl=pick(o,['people','ids','empIds','รหัส']);let people=Array.isArray(ppl)?ppl.map(x=>String(x).trim()).filter(Boolean):(typeof ppl==='string'?ppl.split(/[\n,]/).map(x=>x.trim()).filter(Boolean):[]);
      let req=String(pick(o,['req','status'])||'').toLowerCase();req=/ok|รับรอง|approve|cert/.test(req)?'ok':/sent|ยื่น|submit/.test(req)?'sent':'none';
      const id=pick(o,['id','certId','courseId'])||'';return {course:pick(o,['course','name','title'])||'(ไม่มีชื่อ)',code:pick(o,['code','trainingCode'])||'',
      date:toISO(pick(o,['date','start','dateStart'])),dateEnd:toISO(pick(o,['dateEnd','end'])),ppl:pick(o,['ppl','count','seats'])!==undefined?+pick(o,['ppl','count','seats']):null,
      id:String(id),req:id?'ok':req,people};});
    if(app==='vwp')return arr.map(o=>{let et=String(pick(o,['empType','type','ประเภท'])||'employee').toLowerCase();
      et=/family|ครอบครัว|dependent/.test(et)?'family':'employee';
      return{name:pick(o,['name','ชื่อ','fullName'])||'(ไม่มีชื่อ)',empType:et,relatedTo:pick(o,['relatedTo','familyOf','ของ'])||'',
      position:pick(o,['position','ตำแหน่ง'])||'',co:normCo(pick(o,['co','company','genpo'])),
      visaNo:pick(o,['visaNo','visaNumber','เลขที่วีซ่า'])||'',visaExpiry:toISO(pick(o,['visaExpiry','visa','workPermitExpiry','วันหมดอายุวีซ่า'])),
      aptAddress:pick(o,['aptAddress','apartment','address','ที่พัก'])||'',aptExpiry:toISO(pick(o,['aptExpiry','apartmentExpiry','วันหมดอายุที่พัก'])),
      remark:pick(o,['remark','note','หมายเหตุ'])||''};});
    if(app==='resign')return arr.map(o=>{let k=String(pick(o,['kind','type','ประเภท'])||'resignation').toLowerCase();
      k=/retire|เกษียณ/.test(k)?'retirement':'resignation';
      return{name:pick(o,['name','ชื่อ','fullName'])||'(ไม่มีชื่อ)',kind:k,position:pick(o,['position','ตำแหน่ง'])||'',
      co:normCo(pick(o,['co','company','genpo'])),date:toISO(pick(o,['date','effectiveDate','วันที่'])),remark:pick(o,['remark','note','หมายเหตุ'])||''};});
    return arr.map(o=>{let co=normCo(pick(o,['co','company','genpo']));
      let st=String(pick(o,['status'])||'confirmed').toLowerCase();st=['confirmed','tentative','postponed','cancelled'].includes(st)?st:'confirmed';
      return {title:pick(o,['title','name','course'])||'(ไม่มีชื่อ)',co,date:toISO(pick(o,['date','start'])),end:toISO(pick(o,['end','dateEnd'])),time:pick(o,['time'])||'',status:st,note:pick(o,['note','remark'])||''};});}
  function check(){try{pending=parse();const sample=pending.slice(0,5).map(x=>'· '+esc(x.name||x.course||x.title||'')+(x.start||x.date||x.visaExpiry?` (${fmtDMY(x.start||x.date||x.visaExpiry)})`:'')).join('<br>');
    document.getElementById('imPrev').innerHTML=`<div style="background:#F4FAF5;border:1px solid #CBE6D0;border-radius:5px;padding:9px 12px;margin-top:4px"><b>พบ ${pending.length} รายการ</b><br>${sample}${pending.length>5?'<br>…':''}</div>`;
    document.getElementById('imGo').disabled=false;}catch(e){pending=null;document.getElementById('imGo').disabled=true;document.getElementById('imPrev').innerHTML=`<div class="autherr" style="margin-top:4px">${esc(e.message)}</div>`;}}
  async function run(){if(!pending)return;const by=state.profile.username;
    try{
      if(app==='training'){const g=document.getElementById('imGenpo').value;const s=state.train[g];let no=Math.max(0,...s.courses.map(c=>c.no||0));
        pending.forEach(p=>{no++;s.courses.push({id:Date.now().toString(36)+no,no,code:p.code||g+'-'+String(no).padStart(3,'0'),name:p.name,co:g,vendorName:p.vendorName,start:p.start,end:p.end,count:p.count,cat:p.cat,people:'',vendor:'none',pr:'none',by,imported:true,steps:{},stepTs:{},stepBy:{},stepRemark:{},docs:{},docBy:{}});});
        await App.saveTrain(g,'import '+pending.length+' courses');}
      else if(app==='dsd'){const g=document.getElementById('imGenpo').value;const s=state.dsd[g];
        pending.forEach((p,i)=>s.runs.push({id_:Date.now().toString(36)+i,code:p.code,co:g,course:p.course,date:p.date,dateEnd:p.dateEnd,dateText:'',ppl:p.ppl,id:p.id,req:p.req,reqDate:'',report:false,dept:false,receipt:false,cert:false,remark:'',people:p.people,by,imported:true}));
        await App.saveDsd(g,'import '+pending.length+' runs');}
      else if(app==='vwp'){const g=document.getElementById('imGenpo').value;const s=state.vwp[g];let no=Math.max(0,...s.people.map(x=>x.no||0));
        const added=[];pending.forEach(p=>{no++;const rec={id:Date.now().toString(36)+no,no,name:p.name,empType:p.empType,relatedTo:p.relatedTo,co:g,position:p.position,visaNo:p.visaNo,visaExpiry:p.visaExpiry,visaRemark:'',aptAddress:p.aptAddress,aptExpiry:p.aptExpiry,aptRemark:'',remark:p.remark,by,imported:true};s.people.push(rec);added.push(rec);});
        await App.saveVwp(g,'import '+pending.length+' people');for(const rec of added){try{await App.vwpCalFromPerson(rec);}catch(e){}}}
      else if(app==='resign'){const g=document.getElementById('imGenpo').value;const s=state.resign[g];let no=Math.max(0,...s.items.map(x=>x.no||0));
        const added=[];pending.forEach(p=>{no++;const rec={id:Date.now().toString(36)+no,no,name:p.name,kind:p.kind,co:g,position:p.position,date:p.date,remark:p.remark,by,imported:true};s.items.push(rec);added.push(rec);});
        await App.saveResign(g,'import '+pending.length+' items');for(const rec of added){try{await App.vwpCalFromResign(rec);}catch(e){}}}
      else {pending.forEach((p,i)=>state.cal.events.push({id:Date.now().toString(36)+i,title:p.title,co:p.co,date:p.date,end:p.end,time:p.time,status:p.status,note:p.note,by,history:['นำเข้าโดย '+by]}));
        await App.saveCal('import '+pending.length+' events');}
      closeModal();App.render();toast('นำเข้า '+pending.length+' รายการแล้ว');
    }catch(e){toast('นำเข้าไม่สำเร็จ: '+e.message);}}
  return {open,check,run,fromFile};
})();

/* ================= seed (ว่าง — ข้อมูลเดิมนำเข้าผ่านปุ่ม "นำเข้าข้อมูล") ================= */
const SEED=[], CAL_SEED=[];

/* ================= modal helpers ================= */
function openModal(html){let m=document.getElementById('modal');if(!m){m=document.createElement('div');m.id='modal';m.className='modal';m.onclick=e=>{if(e.target===m)closeModal();};document.body.appendChild(m);}m.innerHTML=`<div class="mcard">${html}</div>`;m.classList.add('open');}
function closeModal(){const m=document.getElementById('modal');if(m)m.classList.remove('open');}

/* ================= boot ================= */
App.boot();
</script>
