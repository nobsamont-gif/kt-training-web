  /* ---------- ย้ายข้อมูลเดิม: DSD (รหัส) + Training (ชื่อ) → Training Record ---------- */
  const stripTitle=s=>String(s||'').replace(/^(นาย|นางสาว|นาง|น\.ส\.|mr\.?|mrs\.?|ms\.?|miss)\s*/i,'').trim();
  function legacyPlan(){const out=[],unmatched=[],today=todayISO();
    for(const g of scopeGenpos()){if(!state.rec[g])continue;const have=new Set(People.recs(g).map(r=>(r.sessionId||r.legacyRun||r.code)+'|'+r.empId));
      const nameIx=new Map();People.emps(g).forEach(e=>[e.nameTh,e.nameEn].filter(Boolean).forEach(n=>{const k=nkey(stripTitle(n));nameIx.set(k,nameIx.has(k)&&nameIx.get(k)!==e.empId?'__dup':e.empId);}));
      const push=(c,run,empId,how)=>{const k=(c?c.id:run.id_)+'|'+empId;if(have.has(k))return;have.add(k);
        const end=c?(c.end||c.start):(run.dateEnd||run.date),st=isISO(end)&&end<today?'attended':'enrolled';
        out.push({g,rec:{id:uid(),empId,...(c?People.snapshot(c):{sessionId:'',code:run.code||'',courseName:run.course,courseKey:ckey(run.course),cat:'',start:run.date||'',end:run.dateEnd||run.date||'',provider:''}),
          ...(c?{}:{legacyRun:run.id_}),hours:c?+c.hours||0:0,hoursSet:false,status:st,nominationId:'',source:'legacy',remark:how,by:state.profile.username,at:todayISO()}});};
      for(const run of((state.dsd[g]||{}).runs||[])){const c=run.code?App.courseByCode(run.code,g):null;(run.people||[]).map(x=>String(x).trim()).filter(Boolean).forEach(id=>push(c,run,id,'จาก DSD'));}
      for(const {c,g:gg} of App.allCourses()){if(gg!==g)continue;for(const nm of peopleArr(c)){const id=nameIx.get(nkey(stripTitle(nm)));
        if(id&&id!=='__dup')push(c,null,id,'จับคู่ชื่อ: '+nm);else unmatched.push({g,c,nm,why:id==='__dup'?'ชื่อซ้ำหลายคน':'ไม่พบชื่อในทะเบียน'});}}}
    return{out,unmatched};}
  function openLegacy(){const {out,unmatched}=legacyPlan();const byG={};out.forEach(x=>byG[x.g]=(byG[x.g]||0)+1);
    openModal(`<h2>ย้ายข้อมูลเดิมเข้า Training Record</h2>
      <p class="note" style="margin-bottom:10px">ระบบเดิมเก็บผู้เข้าอบรม 2 แบบ: DSD เก็บเป็น<b>รหัสพนักงาน</b> และ Training เก็บเป็น<b>ชื่อ</b> — ขั้นตอนนี้แปลงทั้งหมดให้เป็น Record ที่ผูกรหัส (รายการที่มีอยู่แล้วจะไม่สร้างซ้ำ) · อบรมผ่านไปแล้ว = เข้าอบรมแล้ว, ยังไม่ถึงวัน = ลงทะเบียน</p>
      <div class="statbox ok"><b>สร้างได้ ${out.length} รายการ</b> ${Object.entries(byG).map(([g,n])=>`<span class="co ${g}">${CO[g]}</span> ${n}`).join(' ')}</div>
      <div class="statbox ${unmatched.length?'wait':'ok'}"><b>ชื่อที่จับคู่รหัสไม่ได้ ${unmatched.length} รายการ</b>${unmatched.length?`<br><span class="note">${unmatched.slice(0,6).map(u=>`${esc(u.nm)} · ${esc(u.c.code||'')} (${u.why})`).join('<br>')}${unmatched.length>6?'<br>…':''}</span>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="mini" onclick="Records.exportUnmatched()">ดาวน์โหลดรายการ (เติมรหัสในคอลัมน์ EmpID)</button><button class="mini" onclick="Records.pickFilled()">นำเข้าไฟล์ที่เติมรหัสแล้ว</button></div>`:''}</div>
      <p class="note">ต้อง Import HRIS ก่อน ชื่อจึงจับคู่กับรหัสได้ · ข้อมูลเดิมในหน้า Training และ DSD ไม่ถูกแก้ไข</p>
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" ${out.length?'':'disabled'} onclick="Records.runLegacy()">สร้าง ${out.length} Record</button></div>`);}
  async function saveMany(list,msg){const gs=new Set();list.forEach(({g,rec})=>{state.rec[g].records.push(rec);gs.add(g);});
    for(const g of gs)await App.saveKind('rec',g,msg);}
  async function runLegacy(){const {out}=legacyPlan();try{await saveMany(out,'legacy → records '+out.length);closeModal();App.render();toast(`สร้าง Training Record ${out.length} รายการแล้ว`);}catch(e){}}
  function exportUnmatched(){const {unmatched}=legacyPlan();xlsxExport('legacy_names_'+dstamp()+'.xlsx',['Genpo','Code','หลักสูตร','วันอบรม','ชื่อ (เดิม)','EmpID','หมายเหตุ'],
    unmatched.map(u=>[u.g,u.c.code||'',u.c.name,fmtDMY(u.c.start),u.nm,'',u.why]));}
  function pickFilled(){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=async e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
      const {unmatched}=legacyPlan(),list=[],today=todayISO();
      for(const o of rows){const id=String(o.EmpID||'').trim(),g=String(o.Genpo||'').trim(),code=String(o.Code||'').trim(),nm=String(o['ชื่อ (เดิม)']||'').trim();if(!id||!g)continue;
        const u=unmatched.find(x=>x.g===g&&(x.c.code||'')===code&&x.nm===nm);if(!u)continue;const c=u.c,end=c.end||c.start;
        if(People.recFor(g,c.id,id)||list.some(x=>x.g===g&&x.rec.sessionId===c.id&&x.rec.empId===id))continue;
        list.push({g,rec:{id:uid(),empId:id,...People.snapshot(c),hours:+c.hours||0,hoursSet:false,status:isISO(end)&&end<today?'attended':'enrolled',nominationId:'',source:'legacy',remark:'เติมรหัสจากไฟล์: '+nm,by:state.profile.username,at:todayISO()}});}
      if(!list.length){toast('ไม่พบแถวที่เติมรหัสแล้ว');return;}await saveMany(list,'legacy filled '+list.length);closeModal();App.render();toast(`สร้าง Record ${list.length} รายการ`);}catch(err){toast('อ่านไฟล์ไม่สำเร็จ: '+err.message);}};rd.readAsArrayBuffer(f);};i.click();}

  function exportExcel(){const k=ki??kiCur(),out=[];
    for(const {g,e} of rows())for(const r of People.recs(g).filter(r=>r.empId===e.empId).sort((a,b)=>(a.start||'').localeCompare(b.start||'')))
      out.push([CO[g],e.empId,People.nameOf(e),People.deptName(g,e.dept),e.position||'',e.level||'',r.code,r.courseName,r.cat,fmtDMY(r.start),fmtDMY(r.end),People.done(r)?+r.hours||0:0,(People.REC[r.status]||{}).t,kiOfISO(r.start)===k?'✓':'',r.source]);
    xlsxExport('training_records_'+dstamp()+'.xlsx',['Genpo','รหัส','ชื่อ','ฝ่าย','ตำแหน่ง','Level','Code','หลักสูตร','ประเภท','เริ่ม','สิ้นสุด','ชั่วโมง','สถานะ',`${k} Ki`,'ที่มา'],out);}
  return {render,setCo,setDept,setKi,setSort,toggleInactive,more,search,open,exportPerson,editRec,saveRec,delRec,openExternal,saveExternal,bySession,syncCourse,
    openImport,readHris,previewHris,runHris,openDepts,saveDepts,openLegacy,runLegacy,exportUnmatched,pickFilled,exportExcel,empDatalist};
})();

/* =====================================================================
   13) PENDING LIST + เช็กชื่อ — ใช้ร่วมกันระหว่างหน้า Survey และ drawer ของ Training
   Nomination: pending → confirmed (สร้าง Training Record = ลงทะเบียน) / waitlist / rejected / withdrawn
   ===================================================================== */
const Nom=(()=>{
  const META={pending:{t:'Pending',cl:'wait'},confirmed:{t:'Confirmed',cl:'ok'},waitlist:{t:'Waitlist',cl:'info'},rejected:{t:'Rejected',cl:'alert'},withdrawn:{t:'Withdrawn',cl:''},cancelled:{t:'Cancelled',cl:''}};
  const ACTIVE=['pending','waitlist','confirmed'];
  let ctx=null,sel=new Set(),fil='active',shown=[];
  const forSession=(g,id)=>People.noms(g).filter(n=>n.sessionId===id);
  function counts(g,id){const o={pending:0,confirmed:0,waitlist:0,closed:0};forSession(g,id).forEach(n=>{if(o[n.status]!==undefined)o[n.status]++;else o.closed++;});return o;}
  function countLine(g,c){const o=counts(g,c.id),r=Records.bySession(g,c.id).filter(x=>x.status!=='cancelled').length,p=[];
    if(r)p.push(`${r} ลงทะเบียน`);if(o.pending)p.push(`<b style="color:var(--wait)">${o.pending} pending</b>`);if(o.waitlist)p.push(`${o.waitlist} waitlist`);
    return p.length?`<br><span style="font-size:var(--fs-xs);color:var(--sub)">${p.join(' · ')}</span>`:'';}
  function summary(g,c){const o=counts(g,c.id),R=Records.bySession(g,c.id),live=R.filter(r=>r.status!=='cancelled');
    const att=R.filter(People.done).length,sv=People.surveys(g).filter(s=>(s.sessionIds||[]).includes(c.id));
    return`<div class="tiles" style="margin-bottom:10px"><span class="tile ok"><b>${live.length} / ${c.count||0}</b><span>ลงทะเบียน / ที่นั่ง</span></span>
        <span class="tile wait"><b>${o.pending}</b><span>Pending รอตรวจ</span></span><span class="tile info"><b>${o.waitlist}</b><span>Waitlist</span></span>
        <span class="tile"><b>${att}</b><span>เข้าอบรมแล้ว</span></span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost" onclick="Nom.openList('${g}','${c.id}')">Pending list${o.pending?` (${o.pending})`:''}</button>
        <button class="btn btn-ghost" onclick="Nom.openAttendance('${g}','${c.id}')">เช็กชื่อ / ผู้เข้าอบรม (${live.length})</button></div>
      ${sv.length?`<p class="note" style="margin-top:6px">รายชื่อมาจาก ${sv.map(s=>`<span class="authlink" onclick="Survey.openSurvey('${g}','${s.id}')">${esc(s.code)}</span>`).join(', ')}</p>`:''}`;}

  function setCtx(g,id,host){if(!ctx||ctx.g!==g||ctx.id!==id){sel=new Set();fil='active';}ctx={g,id,host};}
  function body(){const {g,id}=ctx,c=courseById(g,id);if(!c)return '<p class="note">ไม่พบรอบอบรมนี้ใน Training Tracker (อาจถูกลบ)</p>';
    const L=forSession(g,id),o=counts(g,id),seats=+c.count||0,ix=People.index(g);
    const show=L.filter(n=>fil==='active'?ACTIVE.includes(n.status):fil==='closed'?!ACTIVE.includes(n.status):n.status===fil);
    shown=show.map(n=>n.id);[...sel].forEach(x=>{if(!shown.includes(x))sel.delete(x);});
    const quota={};People.surveys(g).filter(s=>(s.sessionIds||[]).includes(id)).forEach(s=>{const q=(s.quota||{})[id]||{};for(const d in q)quota[d]=(quota[d]||0)+(+q[d]||0);});
    const groups=new Map();show.forEach(n=>{if(!groups.has(n.dept))groups.set(n.dept,[]);groups.get(n.dept).push(n);});
    const depts=[...groups.keys()].sort((a,b)=>People.deptName(g,a).localeCompare(People.deptName(g,b),'th'));
    const others=((state.train[g]||{}).courses||[]).filter(x=>x.id!==id&&ckey(x.name)===ckey(c.name)&&!(x.end&&x.end<todayISO()));
    const tile=(k,cl,n,t)=>`<button class="tile ${cl} ${fil===k?'on':''}" onclick="Nom.setFil('${k}')"><b>${n}</b><span>${t}</span></button>`;
    const over=o.confirmed>seats;
    return`<div class="tiles"><span class="tile ${over?'alert':'ok'}"><b>${o.confirmed} / ${seats}</b><span>Confirmed / ที่นั่ง</span></span>
        ${tile('active','',o.pending+o.waitlist+o.confirmed,'ทั้งหมด (ที่ยังใช้งาน)')}${tile('pending','wait',o.pending,'Pending รอตรวจ')}${tile('waitlist','info',o.waitlist,'Waitlist')}${tile('confirmed','ok',o.confirmed,'Confirmed')}${tile('closed','',o.closed,'Rejected / Withdrawn')}</div>
      <div class="bulkbar"><label class="inl"><input type="checkbox" ${show.length&&sel.size===show.length?'checked':''} onchange="Nom.selAll(this.checked)">เลือกทั้งหมด</label><span class="note">${sel.size} รายการ</span><span style="flex:1"></span>
        <button class="mini good" onclick="Nom.act('confirm')">✓ Confirm</button><button class="mini" onclick="Nom.act('waitlist')">Waitlist</button><button class="mini" onclick="Nom.act('pending')">คืนเป็น Pending</button>
        ${others.length?`<select id="nomMove" class="minisel"><option value="">ย้ายไปรอบ…</option>${others.map(x=>`<option value="${x.id}">${esc(x.code)} · ${courseRange(x)}</option>`).join('')}</select><button class="mini" onclick="Nom.act('move')">ย้าย</button>`:''}
        <button class="mini danger" onclick="Nom.act('reject')">Reject</button></div>
      <div class="tblwrap"><table><thead><tr><th style="width:34px"></th><th>รหัส</th><th>ชื่อ-สกุล</th><th>ตำแหน่ง</th><th class="num">ลำดับ</th><th>หมายเหตุจากผู้จัดการ</th><th>ธง</th><th>สถานะ</th></tr></thead><tbody>
      ${show.length?depts.map(d=>{const G=groups.get(d),all=L.filter(n=>n.dept===d),cf=all.filter(n=>n.status==='confirmed').length,pd=all.filter(n=>n.status==='pending').length;
          const q=quota[d];return`<tr class="mrow"><td colspan="8">${esc(People.deptName(g,d))} · Confirmed ${cf} + Pending ${pd}${q!==undefined?` / โควต้า ${q}${cf+pd>q?' <span class="chip alert">เกินโควต้า</span>':''}`:''}</td></tr>`+
          G.sort((a,b)=>(a.priority||99)-(b.priority||99)||a.empId.localeCompare(b.empId)).map(n=>{const e=People.emp(g,n.empId),fl=People.flagsFor(g,n.empId,c,ix);
            return`<tr><td><input type="checkbox" class="nomck" ${sel.has(n.id)?'checked':''} onchange="Nom.toggle('${n.id}',this.checked)" aria-label="เลือก ${esc(n.empId)}"></td>
              <td><span class="code">${esc(n.empId)}</span></td><td><span class="authlink" style="color:inherit" onclick="Records.open('${g}','${esc(n.empId)}')">${esc(People.nameOf(e)||'—')}</span>${e?(e.status==='Inactive'?' <span class="chip alert">พ้นสภาพ</span>':''):' <span class="chip alert">ไม่พบในทะเบียน</span>'}</td>
              <td>${esc((e||{}).position||'')}${e&&e.level?` <span class="chip">${esc(e.level)}</span>`:''}</td><td class="num">${n.priority||''}</td><td>${esc(n.note||'')}</td>
              <td>${fl.map(f=>`<span class="chip wait">${esc(f)}</span>`).join(' ')}</td>
              <td><span class="chip ${META[n.status].cl}">${META[n.status].t}</span>${n.reason?`<br><span class="by">${esc(n.reason)}</span>`:''}${n.source==='manual'?'<br><span class="by">Training เพิ่มเอง</span>':''}</td></tr>`;}).join('');}).join('')
        :`<tr><td colspan="8" class="empty">${L.length?'ไม่มีรายการในตัวกรองนี้':'ยังไม่มีรายชื่อ — รอผู้จัดการฝ่ายส่งไฟล์ Survey กลับ หรือเพิ่มเองด้านล่าง'}</td></tr>`}
      </tbody></table></div>
      <div class="toolbar" style="margin-top:10px"><input id="nomAdd" list="nomEmpList" placeholder="+ เพิ่มเอง: พิมพ์รหัสหรือชื่อพนักงาน" style="width:320px" onkeydown="if(event.key==='Enter')Nom.addManual()">
        <button class="btn btn-ghost" onclick="Nom.addManual()">เพิ่มเข้า Pending</button>${Records.empDatalist(g,'nomEmpList')}</div>`;}
  function render(el,g,id,host){setCtx(g,id,host||'survey');el.innerHTML=body();}
  function openList(g,id){const c=courseById(g,id);if(!c)return;setCtx(g,id,$('drawer').classList.contains('open')?'training':'modal');
    openModal(`<h2>Pending list — <span class="code">${esc(c.code)}</span> ${esc(c.name)} <span class="note">${courseRange(c)}</span></h2><div id="nomBody">${body()}</div>
      <div class="mfoot"><button class="btn btn-ghost" onclick="Nom.openAttendance('${g}','${id}')">เช็กชื่อ / ผู้เข้าอบรม</button><button class="btn btn-red" onclick="closeModal()">ปิด</button></div>`,'wide');}
  function refresh(){const {g,id,host}=ctx;
    if(host==='survey'){App.render();return;}
    const b=$('nomBody');if(b)b.innerHTML=body();App.render();if(host==='training'&&$('drawer').classList.contains('open'))Training.openDrawer(g,id);}
  function setFil(f){fil=f;sel=new Set();refresh();}
  function toggle(id,v){if(v)sel.add(id);else sel.delete(id);refresh();}
  function selAll(v){sel=v?new Set(shown):new Set();refresh();}
  async function act(kind){const {g,id}=ctx,c=courseById(g,id),by=state.profile.username;const L=People.noms(g).filter(n=>sel.has(n.id));
    if(!L.length){toast('เลือกรายชื่อก่อน');return;}let recCh=false;
    if(kind==='confirm'){const cf=forSession(g,id).filter(n=>n.status==='confirmed').length,add=L.filter(n=>n.status!=='confirmed').length;
      if(cf+add>(+c.count||0)&&!confirm(`ยืนยันแล้วจะมี ${cf+add} คน เกินที่นั่ง ${c.count||0} ที่ — ยืนยันต่อ?`))return;
      for(const n of L){if(n.status==='confirmed')continue;n.status='confirmed';n.reason='';n.decidedBy=by;n.decidedAt=todayISO();hist(n,'Confirm');People.enroll(g,c,n.empId,n);recCh=true;}}
    else if(kind==='move'){const to=($('nomMove')||{}).value;if(!to){toast('เลือกรอบปลายทางก่อน');return;}const c2=courseById(g,to);
      for(const n of L){if(People.noms(g).some(x=>x!==n&&x.sessionId===to&&x.empId===n.empId&&ACTIVE.includes(x.status))){toast(`${n.empId} อยู่ในรอบ ${c2.code} แล้ว`);continue;}
        if(n.status==='confirmed'){if(!People.unenroll(g,n.sessionId,n.empId)){toast(`${n.empId} มีผลเข้าอบรมแล้ว — ย้ายไม่ได้`);continue;}recCh=true;}
        n.sessionId=to;n.status='pending';n.flags=People.flagsFor(g,n.empId,c2);hist(n,'ย้ายไปรอบ '+c2.code);}}
    else{let reason='';if(kind==='reject'){reason=prompt('เหตุผลที่ไม่รับ (แสดงในไฟล์ที่ส่งกลับผู้จัดการ)','');if(reason===null)return;reason=reason.trim();}
      const st={pending:'pending',waitlist:'waitlist',reject:'rejected'}[kind];
      for(const n of L){if(n.status===st)continue;
        if(n.status==='confirmed'){if(!People.unenroll(g,n.sessionId,n.empId)){toast(`${n.empId} มีผลเข้าอบรมแล้ว — แก้ที่หน้าเช็กชื่อแทน`);continue;}recCh=true;}
        n.status=st;n.reason=reason;n.decidedBy=by;n.decidedAt=todayISO();hist(n,META[st].t+(reason?': '+reason:''));}}
    sel=new Set();
    try{if(recCh)await App.saveKind('rec',g,'nomination '+kind+' '+c.code);await App.saveKind('survey',g,'nomination '+kind+' '+c.code);refresh();toast('บันทึกแล้ว');}catch(e){refresh();}}
  async function addManual(){const {g,id}=ctx,c=courseById(g,id);const v=(($('nomAdd')||{}).value||'').split('·')[0].trim();if(!v)return;
    const e=People.emp(g,v)||People.emps(g).find(x=>x.nameTh===v||x.nameEn===v);if(!e){toast(`ไม่พบพนักงาน "${v}" ในทะเบียน ${CO[g]}`);return;}
    if(e.status==='Inactive'&&!confirm('พนักงานคนนี้พ้นสภาพแล้ว — เพิ่มต่อ?'))return;
    if(forSession(g,id).some(n=>n.empId===e.empId&&ACTIVE.includes(n.status))){toast('มีรายชื่อนี้ในรอบนี้แล้ว');return;}
    const S=state.survey[g];if(!S){toast('ยังโหลด survey-'+g+' ไม่ได้');return;}if(state.missing.has('survey-'+g)){toast('สร้างไม่ได้: Worker ยังไม่อนุญาตไฟล์ survey-'+g);return;}
    const n={id:uid(),surveyId:'',sessionId:id,empId:e.empId,dept:e.dept||'',priority:null,prefer:'',note:'',status:'pending',flags:People.flagsFor(g,e.empId,c),reason:'',source:'manual',at:new Date().toISOString(),by:state.profile.username};
    hist(n,'Training เพิ่มเอง');S.nominations.push(n);try{await App.saveKind('survey',g,'manual nomination '+e.empId);refresh();toast('เพิ่ม '+People.nameOf(e)+' แล้ว');}catch(err){}}

  /* ---------- เช็กชื่อหลังอบรม ---------- */
  let att=null;
  function openAttendance(g,id){att={g,id};const c=courseById(g,id);if(!c)return;
    const R=Records.bySession(g,id).sort((a,b)=>{const da=(People.emp(g,a.empId)||{}).dept||'',db=(People.emp(g,b.empId)||{}).dept||'';return da.localeCompare(db)||a.empId.localeCompare(b.empId);});
    const end=c.end||c.start,future=isISO(end)&&end>todayISO();const cnt={};R.forEach(r=>cnt[r.status]=(cnt[r.status]||0)+1);
    const OPTS=[['attended','เข้า'],['partial','บางส่วน'],['noshow','ไม่มา'],['cancelled','ยกเลิก']];
    openModal(`<h2>ผู้เข้าอบรม — <span class="code">${esc(c.code)}</span> ${esc(c.name)}</h2>
      <p class="note" style="margin-bottom:10px">${courseRange(c)} · ${c.hours?hrs(c.hours)+' ชม./คน':'<b style="color:var(--wait)">ยังไม่ได้กรอกชั่วโมงอบรม/คน ในหน้า Training</b>'}${future?' · ยังไม่ถึงวันอบรม (กดยกเลิกล่วงหน้าได้ ระบบจะเลื่อนคนจาก Waitlist ขึ้นมาให้)':''}</p>
      <div class="toolbar"><button class="btn btn-ghost" ${cnt.enrolled?'':'disabled'} onclick="Nom.allAttended()">มาครบทุกคน (${cnt.enrolled||0})</button>
        <span class="note">${Object.entries(People.REC).map(([k,v])=>cnt[k]?`${v.t} ${cnt[k]}`:'').filter(Boolean).join(' · ')||'ยังไม่มีผู้ลงทะเบียน'}</span></div>
      <div class="tblwrap" style="max-height:60vh;overflow:auto"><table><thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>ฝ่าย</th><th>ผลการเข้าอบรม</th><th class="num">ชม.</th></tr></thead><tbody>
      ${R.length?R.map(r=>{const e=People.emp(g,r.empId);return`<tr><td><span class="code">${esc(r.empId)}</span></td><td>${esc(People.nameOf(e)||'—')}</td><td>${esc(e?People.deptName(g,e.dept):'')}</td>
        <td><div class="seg">${OPTS.map(([k,t])=>`<button class="${r.status===k?'on '+k:''}" onclick="Nom.setAtt('${r.id}','${k}')">${t}</button>`).join('')}</div></td>
        <td class="num"><input class="qin" type="number" min="0" step="0.5" value="${People.done(r)?hrs(r.hours):''}" ${People.done(r)?'':'disabled'} onchange="Nom.setHours('${r.id}',this.value)"></td></tr>`;}).join('')
        :'<tr><td colspan="5" class="empty">ยังไม่มีผู้ลงทะเบียน — Confirm รายชื่อจาก Pending list ก่อน</td></tr>'}</tbody></table></div>
      <p class="note" style="margin-top:8px">เข้า / บางส่วน = นับชั่วโมงและส่งรหัสเข้า DSD รุ่นที่ Code ตรงกันอัตโนมัติ · กดปุ่มเดิมซ้ำ = กลับเป็น "ลงทะเบียน"</p>
      <div class="mfoot"><button class="btn btn-ghost" onclick="Nom.openList('${g}','${id}')">Pending list</button><button class="btn btn-red" onclick="closeModal()">เสร็จ</button></div>`,'wide');}
  async function saveAtt(msg,{nomCh,dsdCh,promoted}={}){const {g,id}=att,c=courseById(g,id);
    try{await App.saveKind('rec',g,msg);if(nomCh)await App.saveKind('survey',g,'attendance');if(dsdCh)await App.saveDsd(g,'attendance→dsd '+c.code);
      openAttendance(g,id);App.render();if($('drawer').classList.contains('open'))Training.openDrawer(g,id);
      if(promoted)toast(`เลื่อน ${promoted.empId} จาก Waitlist ขึ้น Pending แล้ว`);}catch(e){openAttendance(g,id);}}
  const notYet=c=>{const e=c.end||c.start;return isISO(e)&&e>todayISO();};
  async function setAtt(rid,st){const {g,id}=att,c=courseById(g,id);const r=People.recs(g).find(x=>x.id===rid);if(!r)return;
    if(r.status===st)st='enrolled';if(['attended','partial','noshow'].includes(st)&&notYet(c)&&!confirm('ยังไม่ถึงวันอบรม — บันทึกผลการเข้าอบรมเลย?'))return;const prev=r.status;r.status=st;hist(r,`${(People.REC[prev]||{}).t} → ${People.REC[st].t}`);
    if(People.done(r)&&!r.hoursSet)r.hours=+c.hours||0;
    const n=r.nominationId&&People.noms(g).find(x=>x.id===r.nominationId);let nomCh=false,promoted=null;
    if(st==='cancelled'){if(n&&n.status==='confirmed'){n.status='cancelled';hist(n,'ยกเลิกหลังลงทะเบียน');nomCh=true;}
      promoted=People.promoteWaitlist(g,id,n?n.dept:(People.emp(g,r.empId)||{}).dept);if(promoted)nomCh=true;}
    else if(prev==='cancelled'&&n&&n.status==='cancelled'){n.status='confirmed';hist(n,'กลับมาลงทะเบียน');nomCh=true;}
    const dsdCh=People.syncDsd(g,r);await saveAtt('attendance '+r.empId+' '+st,{nomCh,dsdCh,promoted});}
  async function setHours(rid,v){const {g}=att;const r=People.recs(g).find(x=>x.id===rid);if(!r)return;r.hours=Math.max(0,+v||0);r.hoursSet=true;await saveAtt('hours '+r.empId);}
  async function allAttended(){const {g,id}=att,c=courseById(g,id);let dsdCh=false;if(notYet(c)&&!confirm('ยังไม่ถึงวันอบรม — บันทึกว่ามาครบทุกคนเลย?'))return;
    Records.bySession(g,id).filter(r=>r.status==='enrolled').forEach(r=>{r.status='attended';if(!r.hoursSet)r.hours=+c.hours||0;hist(r,'มาครบทุกคน');if(People.syncDsd(g,r))dsdCh=true;});
    await saveAtt('attendance all '+c.code,{dsdCh});}
  return {META,ACTIVE,counts,countLine,summary,render,openList,setFil,toggle,selAll,act,addManual,openAttendance,setAtt,setHours,allAttended};
})();

/* =====================================================================
   14) TRAINING SURVEY — โควต้า ฝ่าย × รอบ (Auto กระจาย / กำหนดเอง)
   ผู้จัดการฝ่ายเลือกรายชื่อใน Excel (1 ไฟล์/ฝ่าย) → อัปโหลดกลับ → ตรวจ → Pending list
   (ระบบจริง: Power Automate สร้างไฟล์บน SharePoint, ส่งอีเมล, อ่านไฟล์ทุก 2 ชม. — หน้านี้จำลองขั้นตอนเดียวกัน)
   ===================================================================== */
const Survey=(()=>{
  const SST={draft:{t:'ร่าง',cl:''},open:{t:'เปิดรับ',cl:'info'},closed:{t:'ปิดรับ · รอตรวจ',cl:'wait'},final:{t:'เสร็จสิ้น',cl:'ok'}};
  let cofil='ALL',stfil='ALL',view=null,viewG=null,tab='setup',sessTab=null;
  const find=(g,id)=>People.surveys(g).find(s=>s.id===id)||null;
  const cur=()=>view?find(viewG,view):null;
  const sessions=s=>(s.sessionIds||[]).map(id=>courseById(s.co,id)).filter(Boolean);
  const qOf=(s,sid,d)=>+(((s.quota||{})[sid]||{})[d])||0;
  const qDept=(s,d)=>(s.sessionIds||[]).reduce((a,sid)=>a+qOf(s,sid,d),0);
  const qSess=(s,sid)=>Object.values((s.quota||{})[sid]||{}).reduce((a,v)=>a+(+v||0),0);
  const qTotal=s=>(s.sessionIds||[]).reduce((a,sid)=>a+qSess(s,sid),0);
  const seats=s=>sessions(s).reduce((a,c)=>a+(+c.count||0),0);
  const quotaDepts=s=>{const d=new Set();for(const sid of s.sessionIds||[])for(const k in((s.quota||{})[sid]||{}))if(qOf(s,sid,k)>0)d.add(k);return[...d];};
  const byName=g=>(a,b)=>People.deptName(g,a).localeCompare(People.deptName(g,b),'th');
  const capOf=s=>s.capPct||cfg(s.co).surveyCap||30;
  const inSurvey=(s,n)=>n.surveyId===s.id||(!n.surveyId&&(s.sessionIds||[]).includes(n.sessionId));

  /* ---------- กลุ่มเป้าหมาย ---------- */
  function eligible(s){const g=s.co,T=s.target||{},ix=People.index(g),key=s.courseKey;
    return People.emps(g).filter(e=>{if(e.status==='Inactive'||!e.dept)return false;
      if((T.depts||[]).length&&!T.depts.includes(e.dept))return false;if((T.levels||[]).length&&!T.levels.includes(String(e.level||'')))return false;
      if(T.excludeAttended!==false&&ix.att(e.empId,key))return false;const en=ix.enr(e.empId,key);if(en&&!(s.sessionIds||[]).includes(en.sessionId))return false;return true;});}
  function eligByDept(s){const m={};eligible(s).forEach(e=>m[e.dept]=(m[e.dept]||0)+1);return m;}

  /* ---------- Auto: สัดส่วนตามคนเข้าเกณฑ์ + เพดาน % ต่อห้อง แล้วกระจายลงแต่ละรอบ ---------- */
  function autoQuota(elig,sess,capPct){const depts=Object.keys(elig).filter(d=>elig[d]>0),quota={};sess.forEach(x=>quota[x.id]={});
    const S=sess.reduce((a,x)=>a+x.seats,0),N=depts.reduce((a,d)=>a+elig[d],0);if(!S||!N)return{quota,total:{},left:S};
    const capS=x=>Math.max(1,Math.ceil(capPct/100*x.seats)),capT=d=>Math.min(elig[d],sess.reduce((a,x)=>a+capS(x),0));
    const e={},q={},minOne=S>=depts.length;
    depts.forEach(d=>{e[d]=S*elig[d]/N;q[d]=Math.min(Math.max(Math.floor(e[d]),minOne?1:0),capT(d));});
    let left=S-depts.reduce((a,d)=>a+q[d],0);
    while(left<0){const d=depts.filter(x=>q[x]>1).sort((a,b)=>(q[b]-e[b])-(q[a]-e[a]))[0];if(!d)break;q[d]--;left++;}
    while(left>0){const d=depts.filter(x=>q[x]<capT(x)).sort((a,b)=>((e[b]-q[b])-(e[a]-q[a]))||(elig[b]-elig[a]))[0];if(!d)break;q[d]++;left--;}
    const rem={...q},used={};sess.forEach(x=>used[x.id]=0);const cnt=(x,d)=>quota[x.id][d]||0;let moved=true;
    while(moved){moved=false;for(const d of depts.filter(x=>rem[x]>0).sort((a,b)=>rem[b]-rem[a])){
      const opts=sess.filter(x=>used[x.id]<x.seats&&cnt(x,d)<capS(x)).sort((a,b)=>(cnt(a,d)-cnt(b,d))||((b.seats-used[b.id])-(a.seats-used[a.id])));
      if(!opts.length)continue;const x=opts[0];quota[x.id][d]=cnt(x,d)+1;used[x.id]++;rem[d]--;moved=true;}}
    return{quota,total:q,left:left+depts.reduce((a,d)=>a+rem[d],0)};}
  const autoFor=s=>autoQuota(eligByDept(s),sessions(s).map(c=>({id:c.id,seats:+c.count||0})),capOf(s));
  function recalc(s){if(s.mode==='auto'&&s.status==='draft')s.quota=autoFor(s).quota;}

  /* ---------- หน้า list ---------- */
  function all(){const o=[];for(const g of scopeGenpos()){if(cofil!=='ALL'&&g!==cofil)continue;People.surveys(g).forEach(s=>o.push({s,g}));}return o;}
  function render(el){if(view){const s=cur();if(s)return renderDetail(el,s);view=null;}
    const L=all(),cnt={draft:0,open:0,closed:0,final:0};L.forEach(({s})=>cnt[s.status]++);
    const ord={open:0,closed:1,draft:2,final:3};
    const rs=L.filter(({s})=>stfil==='ALL'||s.status===stfil).sort((a,b)=>ord[a.s.status]-ord[b.s.status]||(a.s.closeDate||'').localeCompare(b.s.closeDate||''));
    const miss=scopeGenpos().filter(g=>state.missing.has('survey-'+g));
    el.innerHTML=`<div class="pagehead"><h2>Training Survey</h2><span class="note">โควต้าต่อฝ่าย → ผู้จัดการเลือกรายชื่อใน Excel → Pending list ของรอบอบรม → Training Record</span></div>
      <div class="toolbar"><button class="btn btn-red" onclick="Survey.openCreate()">+ สร้าง Survey</button><select onchange="Survey.setCo(this.value)">${genpoOptions(cofil,{all:true})}</select></div>
      ${miss.length?`<div class="banner"><b>ไฟล์ใหม่</b> <span class="note">${miss.map(g=>'survey-'+g).join(', ')} จะถูกสร้างเมื่อบันทึกครั้งแรก — ถ้าบันทึกไม่ได้ ให้เพิ่มชื่อไฟล์ในรายการที่ Worker อนุญาต</span></div>`:''}
      <div class="tiles">${[['ALL','ทั้งหมด','',L.length],['open','เปิดรับ','info',cnt.open],['closed','ปิดรับ · รอตรวจ','wait',cnt.closed],['draft','ร่าง','',cnt.draft],['final','เสร็จสิ้น','ok',cnt.final]]
        .map(([k,t,cl,n])=>`<button class="tile ${cl} ${stfil===k?'on':''}" onclick="Survey.setSt('${k}')"><b>${n}</b><span>${t}</span></button>`).join('')}</div>
      <div class="tblwrap"><table><thead><tr><th>Survey</th><th>หลักสูตร</th><th>รอบ</th><th>ปิดรับ</th><th class="num">ฝ่ายส่งกลับ</th><th class="num">รับแล้ว / โควต้า</th><th class="num">Pending</th><th>สถานะ</th></tr></thead><tbody>
      ${rs.length?rs.map(({s,g})=>{const S=sessions(s),qd=quotaDepts(s),ret=qd.filter(d=>((s.files||{})[d]||{}).returnedAt).length,N=People.noms(g).filter(n=>inSurvey(s,n));
          const act=N.filter(n=>Nom.ACTIVE.includes(n.status)).length,pend=N.filter(n=>n.status==='pending').length,dl=daysUntil(s.closeDate);
          return`<tr class="clk ${s.status==='open'&&dl!==null&&dl<0?'late':''}" onclick="Survey.openSurvey('${g}','${s.id}')"><td><span class="co ${g}">${CO[g]}</span><br><span class="code">${esc(s.code)}</span></td>
            <td class="cname">${esc(s.title)}<br><span class="by">โดย ${esc(s.by)} · ${s.mode==='auto'?'Auto':'กำหนดเอง'}</span></td><td>${S.map(c=>`<span class="code">${esc(c.code)}</span>`).join(' ')}</td>
            <td class="cdate">${fmtDMY(s.closeDate)}${s.status==='open'&&dl!==null?`<br><span class="chip ${dl<0?'alert':dl<=3?'wait':''}">${dl<0?'เลย '+(-dl)+' วัน':'เหลือ '+dl+' วัน'}</span>`:''}</td>
            <td class="num">${s.status==='draft'?'—':`${ret} / ${qd.length}`}</td><td class="num">${act} / ${qTotal(s)}</td><td class="num">${pend?`<b style="color:var(--wait)">${pend}</b>`:''}</td>
            <td><span class="chip ${SST[s.status].cl}">${SST[s.status].t}</span></td></tr>`;}).join('')
        :`<tr><td colspan="8" class="empty">ยังไม่มี Survey — กด "+ สร้าง Survey" (ต้องมีหลักสูตรใน Training Tracker และทะเบียนพนักงานในหน้า Records ก่อน)</td></tr>`}</tbody></table></div>`;}
  function setCo(v){cofil=v;App.render();}
  function setSt(v){stfil=v;App.render();}
  function openSurvey(g,id){view=id;viewG=g;tab='setup';sessTab=null;closeModal();if(state.view!=='survey')App.go('survey');else{closeDrawer();App.render();window.scrollTo(0,0);}}
  function back(){view=null;App.render();}
  function setTab(t){tab=t;App.render();}
  function setSess(id){sessTab=id;App.render();}

  /* ---------- สร้าง ---------- */
  function courseGroups(g){const m=new Map();((state.train[g]||{}).courses||[]).forEach(c=>{const k=ckey(c.name);if(!k)return;if(!m.has(k))m.set(k,{key:k,name:c.name,list:[]});m.get(k).list.push(c);});
    const t=todayISO(),fut=x=>x.list.some(c=>!c.start||(c.end||c.start)>=t)?1:0;
    return[...m.values()].map(x=>(x.list.sort((a,b)=>(a.start||'').localeCompare(b.start||'')),x)).sort((a,b)=>fut(b)-fut(a)||a.name.localeCompare(b.name,'th'));}
  const usedBy=(g,cid,except)=>People.surveys(g).find(s=>s.id!==except&&s.status!=='final'&&(s.sessionIds||[]).includes(cid));
  function openCreate(){const gs=scopeGenpos(),g0=cofil!=='ALL'?cofil:(gs.includes('HRST')?'HRST':gs[0]);
    openModal(`<h2>สร้าง Training Survey</h2>
      <div class="grid2"><div class="frow"><label>Genpo</label><select id="svCo" onchange="Survey.createCourses()">${genpoOptions(g0)}</select></div>
        <div class="frow"><label>ปิดรับรายชื่อ</label>${dateInput(addDays(todayISO(),14),'','svClose')}</div></div>
      <div class="frow"><label>หลักสูตร (จาก Training Tracker)</label><select id="svCourse" onchange="Survey.createSess()"></select></div>
      <div id="svSess"></div>
      <p class="note">สร้างเป็น "ร่าง" ก่อน แล้วกำหนดกลุ่มเป้าหมายและโควต้าในขั้นถัดไป · หลักสูตรเดียวกันหลายรอบรวมไว้ใน Survey เดียวได้</p>
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-red" onclick="Survey.create()">สร้าง</button></div>`);createCourses();}
  function createCourses(){const G=courseGroups($('svCo').value);
    $('svCourse').innerHTML=G.length?G.map(x=>`<option value="${esc(x.key)}">${esc(x.name)} (${x.list.length} รอบ)</option>`).join(''):'<option value="">— ยังไม่มีหลักสูตรใน Training Tracker —</option>';createSess();}
  function createSess(){const g=$('svCo').value,x=courseGroups(g).find(y=>y.key===$('svCourse').value),t=todayISO();
    $('svSess').innerHTML=x?`<label>รอบอบรมที่รวมใน Survey นี้</label><div class="checklist">${x.list.map(c=>{const past=(c.end||c.start)&&(c.end||c.start)<t,u=usedBy(g,c.id);
      return`<label class="ckrow"><input type="checkbox" value="${c.id}" ${!past&&!u?'checked':''}><span class="code">${esc(c.code)}</span> ${courseRange(c)||'ยังไม่กำหนดวัน'} · ${c.count||0} ที่นั่ง
        ${past?'<span class="chip">ผ่านไปแล้ว</span>':''}${u?`<span class="chip wait">อยู่ใน ${esc(u.code)}</span>`:''}</label>`;}).join('')}</div>`:'';}
  async function create(){const g=$('svCo').value,x=courseGroups(g).find(y=>y.key===$('svCourse').value);if(!x){toast('เลือกหลักสูตรก่อน');return;}
    const ids=[...document.querySelectorAll('#svSess input:checked')].map(i=>i.value);if(!ids.length){toast('เลือกอย่างน้อย 1 รอบ');return;}
    const close=parseDMY($('svClose').value);if(!close){toast('วันปิดรับต้องเป็น dd/mm/yyyy');return;}
    const S=state.survey[g];if(!S){toast('ยังโหลด survey-'+g+' ไม่ได้');return;}
    const no=Math.max(0,...S.surveys.map(s=>s.no||0))+1;
    const s={id:uid(),no,code:`SV-${g}-${String(no).padStart(3,'0')}`,co:g,title:x.name,courseKey:x.key,sessionIds:ids,mode:'auto',capPct:cfg(g).surveyCap||30,fromAuto:false,
      target:{depts:[],levels:[],excludeAttended:true},quota:{},closeDate:close,status:'draft',files:{},note:'',by:state.profile.username,createdAt:todayISO()};
    hist(s,'สร้าง Survey');recalc(s);S.surveys.push(s);
    try{await App.saveKind('survey',g,'create '+s.code);closeModal();view=s.id;viewG=g;tab='setup';App.render();toast('สร้าง '+s.code+' แล้ว');}catch(e){}}

  /* ---------- หน้า detail ---------- */
  function renderDetail(el,s){const g=s.co,qd=quotaDepts(s),ret=qd.filter(d=>((s.files||{})[d]||{}).returnedAt).length;
    const pend=People.noms(g).filter(n=>(s.sessionIds||[]).includes(n.sessionId)&&n.status==='pending').length,dl=daysUntil(s.closeDate);
    const act={draft:`<button class="btn btn-red" onclick="Survey.setStatus('open')">เปิด Survey</button>`,
      open:`<button class="btn btn-red" onclick="Survey.setStatus('closed')">ปิดรับรายชื่อ</button>`,
      closed:`<button class="btn btn-red" onclick="Survey.setStatus('final')">Finalize</button><button class="btn btn-ghost" onclick="Survey.setStatus('open')">เปิดรับอีกครั้ง</button>`,
      final:`<button class="btn btn-ghost" onclick="Survey.setStatus('closed')">กลับไปแก้ไข</button>`}[s.status];
    el.innerHTML=`<div class="pagehead"><button class="btn btn-ghost" onclick="Survey.back()">← Survey ทั้งหมด</button>
        <h2><span class="co ${g}">${CO[g]}</span> <span class="code">${esc(s.code)}</span> ${esc(s.title)}</h2><span class="chip ${SST[s.status].cl}">${SST[s.status].t}</span></div>
      <div class="toolbar">${act}<span class="note">ปิดรับ ${fmtDMY(s.closeDate)}${s.status==='open'&&dl!==null?` · ${dl<0?'เลยกำหนด '+(-dl)+' วัน':'เหลือ '+dl+' วัน'}`:''} · สร้างโดย ${esc(s.by)}</span><span style="flex:1"></span>
        ${s.status==='draft'?`<button class="btn btn-ghost" style="color:var(--alert)" onclick="Survey.del()">ลบ Survey</button>`:''}</div>
      <div class="tabs"><button class="${tab==='setup'?'on':''}" onclick="Survey.setTab('setup')">1 · รอบ · กลุ่มเป้าหมาย · โควต้า</button>
        <button class="${tab==='files'?'on':''}" onclick="Survey.setTab('files')">2 · ไฟล์ฝ่าย (${ret}/${qd.length})</button>
        <button class="${tab==='pending'?'on':''}" onclick="Survey.setTab('pending')">3 · Pending list${pend?` (${pend})`:''}</button></div>
      <div id="svBody"></div>`;
    const b=$('svBody');if(tab==='setup')b.innerHTML=setupHtml(s);else if(tab==='files')b.innerHTML=filesHtml(s);else pendingInto(b,s);}

  function setupHtml(s){const g=s.co,ed=s.status==='draft',qed=s.status==='draft'||s.status==='open',t=todayISO();
    const allS=(courseGroups(g).find(x=>x.key===s.courseKey)||{list:[]}).list,S=sessions(s),el=eligByDept(s),nEl=Object.values(el).reduce((a,b)=>a+b,0);
    const T=s.target||{},D=People.deptList(g),LV=People.levels(g),cap=capOf(s),auto=autoFor(s),seatsT=seats(s),total=qTotal(s);
    const rowsD=[...new Set([...Object.keys(el),...quotaDepts(s)])].sort(byName(g));
    let mx={p:0};S.forEach(c=>{const n=+c.count||0;if(n)rowsD.forEach(d=>{const p=qOf(s,c.id,d)/n;if(p>mx.p)mx={p,d,c};});});
    const share=d=>Math.max(0,...S.map(c=>(+c.count||0)?qOf(s,c.id,d)/(+c.count):0));
    return`<div class="svgrid">

        <table class="plain">${(ed?allS:S).map(c=>{const on=(s.sessionIds||[]).includes(c.id),past=(c.end||c.start)&&(c.end||c.start)<t,u=usedBy(g,c.id,s.id);

  async function saveS(s,msg){try{await App.saveKind('survey',s.co,msg+' '+s.code);}catch(e){}App.render();}
  const edit=()=>{const s=cur();if(!s)return null;return s;};
  async function toggleSess(id,on){const s=edit();if(!s||s.status!=='draft')return;s.sessionIds=(s.sessionIds||[]).filter(x=>x!==id);if(on)s.sessionIds.push(id);
    if(!on&&s.quota)delete s.quota[id];recalc(s);await saveS(s,'sessions');}
  async function setClose(v){const s=edit();const iso=parseDMY(v);if(!iso){toast('วันที่ต้องเป็น dd/mm/yyyy');App.render();return;}s.closeDate=iso;await saveS(s,'close date');}
  async function setField(f,v){const s=edit();s[f]=v.trim();await saveS(s,f);}
  async function togTarget(k,v){const s=edit();if(s.status!=='draft')return;s.target=s.target||{};const a=s.target[k]=s.target[k]||[];const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);recalc(s);await saveS(s,'target');}
  async function setExclude(v){const s=edit();s.target=s.target||{};s.target.excludeAttended=v;recalc(s);await saveS(s,'target');}
  async function setMode(m){const s=edit();if(s.mode===m)return;
    if(m==='auto'){if(s.status!=='draft'){if(!confirm('คำนวณโควต้าใหม่จากข้อมูลปัจจุบัน? ตัวเลขที่แก้เองจะถูกแทนที่'))return;s.quota=autoFor(s).quota;s.mode='fixed';s.fromAuto=true;}
      else{s.mode='auto';s.fromAuto=false;recalc(s);}}
    else{s.mode='fixed';}await saveS(s,'mode '+m);}
  async function setCap(v){const s=edit();s.capPct=Math.min(100,Math.max(10,Math.round(+v||30)));recalc(s);await saveS(s,'cap');}
  const bumpCap=n=>setCap(capOf(cur())+n);
  async function applyAuto(){const s=edit();s.quota=autoFor(s).quota;s.fromAuto=true;if(s.status==='draft'){s.mode='auto';s.fromAuto=false;}await saveS(s,'apply auto');}
  async function setQ(sid,d,v){const s=edit();s.quota=s.quota||{};s.quota[sid]=s.quota[sid]||{};const n=Math.max(0,Math.round(+v||0));if(n)s.quota[sid][d]=n;else delete s.quota[sid][d];
    if(s.mode==='auto'){s.mode='fixed';s.fromAuto=true;}await saveS(s,'quota');}
  async function setStatus(st){const s=cur(),g=s.co;
    if(st==='open'&&s.status==='draft'){if(!sessions(s).length){toast('เลือกรอบอบรมก่อน');return;}if(!qTotal(s)){toast('ยังไม่มีโควต้า');return;}
      const noMail=quotaDepts(s).filter(d=>!People.dept(g,d).mgrEmail);
      if(noMail.length&&!confirm(`${noMail.length} ฝ่ายยังไม่มีอีเมลผู้จัดการ (${noMail.slice(0,5).map(d=>People.deptName(g,d)).join(', ')}${noMail.length>5?' …':''})\nเปิด Survey ต่อ? (เพิ่มอีเมลได้ที่ Records → ฝ่าย & ผู้จัดการ)`))return;
      s.openedAt=todayISO();hist(s,'เปิด Survey');s.status='open';tab='files';await saveS(s,'open');toast('เปิดแล้ว — ดาวน์โหลดไฟล์ของแต่ละฝ่ายแล้วส่งให้ผู้จัดการ');return;}
    if(st==='closed'&&s.status==='open'&&!confirm('ปิดรับรายชื่อ? (ยังอัปโหลดไฟล์ที่ส่งช้าได้ ระบบจะถามยืนยัน)'))return;
    if(st==='final'){const p=People.noms(g).filter(n=>(s.sessionIds||[]).includes(n.sessionId)&&n.status==='pending').length;if(p&&!confirm(`ยังมี Pending ${p} คนที่ยังไม่ได้ตรวจ — Finalize ต่อ?`))return;}
    hist(s,SST[s.status].t+' → '+SST[st].t);s.status=st;if(st==='final')tab='pending';await saveS(s,'status '+st);}
  async function del(){const s=cur();if(!confirm(`ลบ ${s.code}?`))return;const S=state.survey[s.co];S.surveys=S.surveys.filter(x=>x!==s);S.nominations=S.nominations.filter(n=>n.surveyId!==s.id);
    view=null;try{await App.saveKind('survey',s.co,'delete '+s.code);}catch(e){}App.render();}

  /* ---------- ไฟล์ Excel ต่อฝ่าย ---------- */
  const HEAD=['EmpID','ชื่อ-สกุล','ตำแหน่ง','Level','ประวัติหลักสูตรนี้','เลือก','ลำดับ','รอบที่สะดวก','หมายเหตุ','ผลตรวจสอบ'];
  function resultText(n){const f=(n.flags||[]).length?' · ⚠ '+n.flags.join(' · '):'';
    return({pending:'✓ รับแล้ว — รอ Training ยืนยัน',confirmed:'✓ ยืนยันแล้ว',waitlist:'⚠ Waitlist (เกินโควต้า)',rejected:'✗ ไม่รับ'+(n.reason?': '+n.reason:''),withdrawn:'',cancelled:'✗ ยกเลิก'}[n.status]||'')+(n.status==='withdrawn'?'':f);}
  function buildWb(s,d){const g=s.co,S=sessions(s),ix=People.index(g);
    const list=eligible(s).filter(e=>e.dept===d),N=People.noms(g).filter(n=>n.dept===d&&inSurvey(s,n));
    N.forEach(n=>{if(!list.some(e=>e.empId===n.empId)){const e=People.emp(g,n.empId);if(e)list.push(e);}});
    list.sort((a,b)=>a.empId.localeCompare(b.empId,undefined,{numeric:true}));
    const code=id=>(courseById(g,id)||{}).code||'';
    const rows=list.map(e=>{const n=N.find(x=>x.empId===e.empId&&x.status!=='withdrawn')||N.find(x=>x.empId===e.empId),a=ix.att(e.empId,s.courseKey),on=n&&Nom.ACTIVE.includes(n.status);
      return[e.empId,People.nameOf(e),e.position||'',e.level||'',a?'เคยอบรม '+fmtDMY(a.start):'ยังไม่เคย',on?'✓':'',on&&n.priority||'',on?(n.prefer||(S.length>1?code(n.sessionId):'')):'',n?n.note||'':'',n?resultText(n):''];});
    const mgr=People.dept(g,d);
    const aoa=[['People Center Hub · Training Survey'],['Survey',s.code],['หลักสูตร',s.title],['รอบอบรม',S.map(c=>`${c.code} (${courseRange(c)})`).join('  ·  ')],
      ['ฝ่าย',`${People.deptName(g,d)} (${d})${mgr.mgrName?' · ผู้จัดการ '+mgr.mgrName:''}`],['โควต้าของฝ่าย',`${qDept(s,d)} คน`+(S.length>1?'  —  '+S.map(c=>`${c.code}: ${qOf(s,c.id,d)}`).join('  ·  '):'')],
      ['ปิดรับ',fmtDMY(s.closeDate)],['เลือกแล้ว',0],['วิธีกรอก',`ใส่ ✓ หรือ 1 ในคอลัมน์ "เลือก" · ลำดับ 1 = สำคัญที่สุด (ใช้ตัดสินเมื่อเลือกเกินโควต้า)${S.length>1?' · รอบที่สะดวก ใส่ Code เช่น '+S[0].code:''} · ห้ามแก้คอลัมน์ EmpID`],HEAD,...rows];
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['B8']={t:'n',v:rows.filter(r=>r[5]).length,f:`COUNTA(F11:F${11+rows.length+100})`};
    ws['!cols']=[{wch:12},{wch:30},{wch:24},{wch:8},{wch:20},{wch:8},{wch:8},{wch:14},{wch:28},{wch:40}];
    const meta=XLSX.utils.aoa_to_sheet([['surveyId',s.id],['genpo',g],['dept',d],['code',s.code],['generatedAt',new Date().toISOString()],['version','1']]);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Survey');XLSX.utils.book_append_sheet(wb,meta,'_meta');wb.Workbook={Sheets:[{Hidden:0},{Hidden:1}]};
    return{wb,name:`${s.code}_${safeName(People.deptName(g,d))||safeName(d)}.xlsx`};}
  function filesHtml(s){const g=s.co,qd=quotaDepts(s).sort(byName(g)),el=eligByDept(s),S=sessions(s),can=s.status!=='draft'&&!!window.XLSX;
    const fmtT=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?iso:d.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});};
    return`<div class="toolbar"><button class="btn btn-red" ${can?'':'disabled'} onclick="Survey.dlAll()">ดาวน์โหลดไฟล์ทุกฝ่าย (${qd.length})</button>
        <button class="btn btn-ghost" ${can?'':'disabled'} onclick="Survey.pickReturn()">อัปโหลดไฟล์ที่ผู้จัดการส่งกลับ</button>
        <span class="note">${s.status==='draft'?'เปิด Survey ก่อนจึงสร้างไฟล์ได้':'อัปโหลดได้หลายไฟล์พร้อมกัน · อัปโหลดซ้ำได้ ระบบจะอัปเดตตามไฟล์ล่าสุด'}</span></div>
      <div class="tblwrap"><table><thead><tr><th>ฝ่าย</th><th>ผู้จัดการ</th><th class="num">โควต้า</th><th class="num">เข้าเกณฑ์</th><th>ส่งไฟล์</th><th>ส่งกลับ</th><th>ผลตรวจ</th><th></th></tr></thead><tbody>
      ${qd.length?qd.map(d=>{const f=(s.files||{})[d]||{},m=People.dept(g,d);return`<tr><td>${esc(People.deptName(g,d))}<br><span class="by">${esc(d)}</span></td>
        <td>${m.mgrEmail?`${esc(m.mgrName||'')}<br><span class="by">${esc(m.mgrEmail)}</span>`:`<span class="chip alert">ไม่มีอีเมล</span> <span class="authlink" onclick="Records.openDepts('${g}')">เพิ่ม</span>`}</td>
        <td class="num">${qDept(s,d)}${S.length>1?`<br><span class="by">${S.map(c=>qOf(s,c.id,d)).join(' / ')}</span>`:''}</td><td class="num">${el[d]||0}</td>
        <td class="cdate">${f.sentAt?fmtT(f.sentAt):'—'}</td><td class="cdate">${f.returnedAt?`${fmtT(f.returnedAt)}<br><span class="by">${esc(f.fileName||'')}</span>`:'<span class="chip wait">รอ</span>'}</td>
        <td>${f.returnedAt?`เลือก ${f.sel} · <span style="color:var(--ok)">✓ ${f.ok}</span>${f.warn?` · <span style="color:var(--wait)">⚠ ${f.warn}</span>`:''}${f.wl?` · WL ${f.wl}`:''}${f.err?` · <span style="color:var(--alert)">✗ ${f.err}</span>`:''}`:''}</td>
        <td style="white-space:nowrap"><button class="mini" ${can?'':'disabled'} onclick="Survey.dl('${esc(d)}')">ไฟล์</button> ${m.mgrEmail&&can?`<a class="mini" href="${mailto(s,d)}" onclick="Survey.markSent('${esc(d)}')">อีเมล</a>`:''}</td></tr>`;}).join('')
        :'<tr><td colspan="8" class="empty">ยังไม่มีฝ่ายที่ได้โควต้า — กำหนดโควต้าในแท็บที่ 1</td></tr>'}</tbody></table></div>
      <p class="note" style="margin-top:8px">ไฟล์ของแต่ละฝ่ายมีเฉพาะพนักงานของฝ่ายนั้นที่เข้าเกณฑ์ · ปุ่ม "อีเมล" เปิดอีเมลพร้อมข้อความ — แนบไฟล์ที่ดาวน์โหลดแล้วส่ง · ในระบบจริง Power Automate จะสร้างไฟล์บน SharePoint ส่งอีเมล และอ่านไฟล์กลับให้เอง</p>`;}
  function mailto(s,d){const g=s.co,m=People.dept(g,d),S=sessions(s),fn=buildName(s,d);
    const sub=`[Training Survey] ${s.title} — เลือกผู้เข้าอบรม ${People.deptName(g,d)} ภายใน ${fmtDMY(s.closeDate)}`;
    const body=`เรียน ${m.mgrName||'ผู้จัดการฝ่าย '+People.deptName(g,d)}\n\nขอความร่วมมือเลือกพนักงานในฝ่ายเข้าอบรมหลักสูตร "${s.title}"\n\nรอบอบรม: ${S.map(c=>`${c.code} ${courseRange(c)}`).join(', ')}\nโควต้าของฝ่าย: ${qDept(s,d)} คน${S.length>1?' ('+S.map(c=>`${c.code}: ${qOf(s,c.id,d)}`).join(', ')+')':''}\nปิดรับ: ${fmtDMY(s.closeDate)}\n\nวิธีกรอก: เปิดไฟล์แนบ ${fn} ใส่ ✓ ในคอลัมน์ "เลือก" และลำดับความสำคัญ แล้วส่งไฟล์กลับทางอีเมลนี้\nหากเลือกเกินโควต้า ระบบจะจัดคนลำดับท้ายเป็น Waitlist\n${s.note?'\n'+s.note+'\n':''}\nขอบคุณค่ะ\nTraining & Engagement`;
    return `mailto:${encodeURIComponent(m.mgrEmail)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;}
  const buildName=(s,d)=>`${s.code}_${safeName(People.deptName(s.co,d))||safeName(d)}.xlsx`;
  async function markSent(d){const s=cur();s.files=s.files||{};s.files[d]={...(s.files[d]||{}),sentAt:new Date().toISOString()};try{await App.saveKind('survey',s.co,'sent '+d);}catch(e){}setTimeout(()=>App.render(),300);}
  async function dl(d){const s=cur();if(!window.XLSX){toast('โหลดไลบรารี Excel ไม่ได้');return;}const {wb,name}=buildWb(s,d);XLSX.writeFile(wb,name);
    s.files=s.files||{};s.files[d]={...(s.files[d]||{}),sentAt:new Date().toISOString()};try{await App.saveKind('survey',s.co,'file '+d);}catch(e){}App.render();}
  async function dlAll(){const s=cur();if(!window.XLSX){toast('โหลดไลบรารี Excel ไม่ได้');return;}const qd=quotaDepts(s);toast(`กำลังสร้าง ${qd.length} ไฟล์… (ถ้าเบราว์เซอร์ถาม ให้อนุญาตดาวน์โหลดหลายไฟล์)`);
    s.files=s.files||{};for(const d of qd){const {wb,name}=buildWb(s,d);XLSX.writeFile(wb,name);s.files[d]={...(s.files[d]||{}),sentAt:new Date().toISOString()};await new Promise(r=>setTimeout(r,350));}
    try{await App.saveKind('survey',s.co,'files all');}catch(e){}App.render();}

  /* ---------- อ่านไฟล์ที่ส่งกลับ + ตรวจสอบ ---------- */
  const NOTSEL=['0','-','no','n','ไม่','ไม่เลือก','false','✗','✘'];
  function parseReturn(wb){const mws=wb.Sheets['_meta'];if(!mws)throw new Error('ไม่ใช่ไฟล์ Survey จากระบบ (ไม่พบชีต _meta) — ใช้ไฟล์ที่ดาวน์โหลดจากหน้านี้');
    const meta={};XLSX.utils.sheet_to_json(mws,{header:1,defval:''}).forEach(r=>{if(r[0])meta[String(r[0]).trim()]=String(r[1]).trim();});
    const ws=wb.Sheets['Survey']||wb.Sheets[wb.SheetNames[0]],aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
    const hi=aoa.findIndex(r=>nkey(r[0])==='empid');if(hi<0)throw new Error('ไม่พบหัวตาราง EmpID');
    const H=aoa[hi].map(nkey),col=n=>H.indexOf(nkey(n)),cSel=col('เลือก'),cPri=col('ลำดับ'),cPre=col('รอบที่สะดวก'),cNote=col('หมายเหตุ');
    if(cSel<0)throw new Error('ไม่พบคอลัมน์ "เลือก"');const rows=[];
    for(let i=hi+1;i<aoa.length;i++){const r=aoa[i],id=String(r[0]||'').trim();if(!id)continue;const v=String(r[cSel]??'').trim().toLowerCase();
      rows.push({row:i+1,empId:id,sel:!!v&&!NOTSEL.includes(v),priority:parseInt(r[cPri])||null,prefer:cPre>=0?String(r[cPre]??'').trim():'',note:cNote>=0?String(r[cNote]??'').trim():''});}
    return{meta,rows};}
  function applyReturn(s,d,P,fileName){const g=s.co,S=sessions(s),ix=People.index(g),key=s.courseKey,res=[];if(!S.length)throw new Error('Survey ไม่มีรอบอบรม');
    const byCode=new Map(S.map(c=>[nkey(c.code),c])),Nall=state.survey[g].nominations,mine=Nall.filter(n=>n.dept===d&&inSurvey(s,n));
    const selRows=P.rows.filter(r=>r.sel).sort((a,b)=>(a.priority||999)-(b.priority||999)||a.row-b.row);
    const used={};S.forEach(c=>used[c.id]=Nall.filter(n=>n.sessionId===c.id&&n.dept===d&&n.status==='confirmed').length);
    const room=c=>qOf(s,c.id,d)-used[c.id],seen=new Set(),mgr=People.dept(g,d);
    for(const r of selRows){const e=People.emp(g,r.empId),o={row:r.row,empId:r.empId,name:People.nameOf(e),st:'err',msg:''};res.push(o);
      if(seen.has(r.empId)){o.msg='รหัสซ้ำในไฟล์';continue;}seen.add(r.empId);
      if(!e){o.msg='ไม่พบรหัสในทะเบียนพนักงาน';continue;}if(e.status==='Inactive'){o.msg='พ้นสภาพแล้ว';continue;}
      if(e.dept!==d){o.msg='ไม่ใช่พนักงานของฝ่ายนี้ (อยู่ '+People.deptName(g,e.dept)+')';continue;}
      const en=ix.enr(e.empId,key);if(en&&!(s.sessionIds||[]).includes(en.sessionId)){o.msg='ลงทะเบียนรอบอื่นแล้ว ('+(en.code||en.courseName)+')';continue;}
      const other=Nall.find(n=>n.empId===e.empId&&n.surveyId&&n.surveyId!==s.id&&Nom.ACTIVE.includes(n.status)&&(find(g,n.surveyId)||{}).courseKey===key);
      if(other){o.msg='อยู่ใน Survey อื่นของหลักสูตรนี้แล้ว ('+(find(g,other.surveyId)||{}).code+')';continue;}
      let n=mine.find(x=>x.empId===e.empId&&x.status!=='withdrawn')||mine.find(x=>x.empId===e.empId);
      if(n&&n.status==='rejected'){o.msg='Training ไม่รับ'+(n.reason?': '+n.reason:'');continue;}
      if(n&&n.status==='confirmed'){n.priority=r.priority;n.note=r.note;o.st='ok';o.msg='ยืนยันแล้ว ('+((courseById(g,n.sessionId)||{}).code||'')+')';continue;}
      const pref=r.prefer?byCode.get(nkey(r.prefer)):null;let c=pref&&room(pref)>0?pref:S.filter(x=>room(x)>0).sort((a,b)=>room(b)-room(a))[0];const wl=!c;
      if(wl)c=pref||(n&&courseById(g,n.sessionId))||S[0];else used[c.id]++;
      const flags=People.flagsFor(g,e.empId,c,ix);
      if(!n){n={id:uid(),surveyId:s.id,empId:e.empId,dept:d,source:'excel',at:new Date().toISOString(),by:'Excel · '+(mgr.mgrName||People.deptName(g,d))};Nall.push(n);mine.push(n);hist(n,'จาก Excel '+fileName);}
      else hist(n,'อัปเดตจาก Excel '+fileName);
      Object.assign(n,{surveyId:n.surveyId||s.id,sessionId:c.id,priority:r.priority,prefer:r.prefer,note:r.note,flags,status:wl?'waitlist':'pending',reason:''});
      o.st=wl?'wl':flags.length?'warn':'ok';o.msg=(wl?'เกินโควต้า → Waitlist':'รับแล้ว → '+c.code)+(flags.length?' · '+flags.join(' · '):'');}
    const selIds=new Set(selRows.map(r=>r.empId));
    for(const n of mine){if(selIds.has(n.empId))continue;const r=P.rows.find(x=>x.empId===n.empId);if(!r)continue;
      if(n.source==='excel'&&['pending','waitlist'].includes(n.status)){n.status='withdrawn';hist(n,'ผู้จัดการเอาออกใน Excel');res.push({row:r.row,empId:n.empId,name:People.nameOf(People.emp(g,n.empId)),st:'wd',msg:'เอาออก → Withdrawn'});}
      else if(n.status==='confirmed')res.push({row:r.row,empId:n.empId,name:People.nameOf(People.emp(g,n.empId)),st:'warn',msg:'ยืนยันแล้ว — หากต้องการยกเลิกให้แจ้ง Training'});}
    const cnt={sel:selRows.length,ok:res.filter(x=>x.st==='ok').length,warn:res.filter(x=>x.st==='warn').length,wl:res.filter(x=>x.st==='wl').length,err:res.filter(x=>x.st==='err').length,wd:res.filter(x=>x.st==='wd').length};
    s.files=s.files||{};s.files[d]={...(s.files[d]||{}),returnedAt:new Date().toISOString(),returnedBy:state.profile.username,fileName,...cnt};
    hist(s,`รับไฟล์ ${People.deptName(g,d)}: เลือก ${cnt.sel}`);res.sort((a,b)=>(a.row||0)-(b.row||0));return{res,cnt};}
  function pickReturn(){const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls';i.multiple=true;i.onchange=()=>processFiles([...i.files]);i.click();}
  async function processFiles(files){if(!files.length)return;const out=[],touched=new Set();
    for(const f of files){try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),P=parseReturn(wb),g=P.meta.genpo;
        if(!scopeGenpos().includes(g))throw new Error('ไฟล์นี้เป็นของ '+g+' ซึ่งไม่อยู่ในสิทธิ์');
        const s=find(g,P.meta.surveyId);if(!s)throw new Error('ไม่พบ Survey '+(P.meta.code||'')+' ในระบบ');
        if(s.status==='draft')throw new Error(s.code+' ยังเป็นร่าง');if(s.status==='final')throw new Error(s.code+' เสร็จสิ้นแล้ว');
        if(s.status==='closed'&&!confirm(`${s.code} ปิดรับแล้ว — รับไฟล์ ${f.name} ต่อ?`))continue;
        out.push({f:f.name,s,d:P.meta.dept,...applyReturn(s,P.meta.dept,P,f.name)});touched.add(g);}
      catch(e){out.push({f:f.name,error:e.message});}}
    let ok=true;for(const g of touched){try{await App.saveKind('survey',g,'survey return '+files.length+' file(s)');}catch(e){ok=false;}}
    App.render();if(ok)showResults(out);}
  function showResults(out){const ST={ok:['✓','ok'],warn:['⚠','wait'],wl:['WL','info'],err:['✗','alert'],wd:['−','']};
    openModal(`<h2>ผลตรวจไฟล์ที่ส่งกลับ (${out.length} ไฟล์)</h2>${out.map(o=>o.error?`<div class="statbox alert"><b>${esc(o.f)}</b><br>${esc(o.error)}</div>`
      :`<div class="statbox ${o.cnt.err?'wait':'ok'}"><b>${esc(People.deptName(o.s.co,o.d))}</b> <span class="by">${esc(o.f)}</span><br>
        เลือก ${o.cnt.sel} → <span style="color:var(--ok)">✓ ${o.cnt.ok}</span>${o.cnt.warn?` · <span style="color:var(--wait)">⚠ ${o.cnt.warn}</span>`:''}${o.cnt.wl?` · Waitlist ${o.cnt.wl}`:''}${o.cnt.err?` · <span style="color:var(--alert)">✗ ไม่รับ ${o.cnt.err}</span>`:''}${o.cnt.wd?` · เอาออก ${o.cnt.wd}`:''}
        ${o.res.length?`<details ${o.cnt.err||o.cnt.warn?'open':''}><summary class="note" style="cursor:pointer;margin-top:4px">รายละเอียด</summary><table class="plain" style="margin-top:4px">${o.res.map(r=>`<tr><td class="by">แถว ${r.row||''}</td><td><span class="code">${esc(r.empId)}</span></td><td>${esc(r.name||'')}</td><td><span class="chip ${ST[r.st][1]}">${ST[r.st][0]}</span> ${esc(r.msg)}</td></tr>`).join('')}</table></details>`:''}
        <div style="margin-top:6px"><button class="mini" onclick="Survey.dlFor('${o.s.co}','${o.s.id}','${esc(o.d)}')">ดาวน์โหลดไฟล์พร้อมผลตรวจ (ส่งกลับผู้จัดการ)</button></div></div>`).join('')}
      <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button><button class="btn btn-red" onclick="closeModal();Survey.setTab('pending')">ไปที่ Pending list</button></div>`,'wide');}
  function dlFor(g,id,d){const s=find(g,id);if(!s)return;const {wb,name}=buildWb(s,d);XLSX.writeFile(wb,name.replace(/\.xlsx$/,'_ผลตรวจ.xlsx'));}

  function pendingInto(b,s){const S=sessions(s);if(!S.length){b.innerHTML='<p class="note">Survey นี้ยังไม่มีรอบอบรม</p>';return;}
    if(!sessTab||!S.some(c=>c.id===sessTab))sessTab=S[0].id;
    b.innerHTML=`${S.length>1?`<div class="cofil" style="margin-bottom:12px;width:fit-content;flex-wrap:wrap">${S.map(c=>{const o=Nom.counts(s.co,c.id);
      return`<button class="${c.id===sessTab?'on':''}" onclick="Survey.setSess('${c.id}')">${esc(c.code)} · ${courseRange(c)}${o.pending?` (${o.pending})`:''}</button>`;}).join('')}</div>`:''}<div id="svPend"></div>
      <p class="note" style="margin-top:8px">Confirm = สร้าง Training Record สถานะ "ลงทะเบียน" ให้พนักงานคนนั้น · เช็กชื่อหลังอบรมได้ที่หน้า Training → เปิดรอบอบรม → เช็กชื่อ</p>`;
    Nom.render($('svPend'),s.co,sessTab,'survey');}

  /* ---------- ใช้ใน Dashboard ---------- */
  function openCount(){let n=0;for(const g of Object.keys(state.survey))n+=(state.survey[g].surveys||[]).filter(s=>s.status==='open').length;return n;}
  return {render,setCo,setSt,openSurvey,back,setTab,setSess,openCreate,createCourses,createSess,create,toggleSess,setClose,setField,togTarget,setExclude,setMode,setCap,bumpCap,
    applyAuto,setQ,setStatus,del,dl,dlAll,dlFor,markSent,pickReturn,processFiles,autoQuota,openCount,SST};
})();

/* ================= boot ================= */
App.boot();
</script>
